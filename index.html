nball. The ball keeps rolling while you answer.\n   Left flipper: \u2190 or A or Z.  Right flipper: \u2192 or D or /.  Space flips both.\n   Bumpers are atoms (+5). Roll through all three top lanes for a +25 bonus.\n   Each correct answer gives a power-up: an extra ball, a ball saver, or double points. */\n(function(){\n'use strict';\nvar L=150,R=1030,TOP=210,BOT=1000,BR=14,GRAV=950;\nvar PIV_L={x:420,y:912},PIV_R={x:760,y:912},FLEN=150,FRAD=11;\nvar REST=0.52,UP=-0.48,FSPD=20;\nvar WALLS=[\n  [L,BOT,L,330],[L,330,L+110,TOP],[L+110,TOP,R-110,TOP],[R-110,TOP,R,330],[R,330,R,BOT],\n  [L,772,PIV_L.x-6,PIV_L.y-4],[R,772,PIV_R.x+6,PIV_R.y-4],\n  [L+70,600,L+70,712],[L+70,712,L+150,760],\n  [R-70,600,R-70,712],[R-70,712,R-150,760]\n];\nvar BUMPERS=[{x:430,y:440,r:42},{x:750,y:440,r:42},{x:590,y:590,r:46}];\nvar LANES=[{x:470,y:288},{x:590,y:288},{x:710,y:288}];\nvar POSTS=[{x:530,y:288,r:9},{x:650,y:288,r:9}];\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\n\nfunction newBall(g){\n  g.balls.push({x:rand(560,620),y:TOP+40,vx:rand(-160,160),vy:60,trail:[]});\n}\nfunction flipSeg(f,side){\n  var a=side<0?f.a:Math.PI-f.a,p=side<0?PIV_L:PIV_R;\n  return {x1:p.x,y1:p.y,x2:p.x+Math.cos(a)*FLEN,y2:p.y+Math.sin(a)*FLEN,p:p};\n}\nfunction points(G,api,g,n,x,y,col){\n  var v=n*(g.pw.dbl>0?2:1);G.you+=v;api.hud();api.popup(x,y,'+'+v,col||'#ffd36b');\n}\n/* bounce off a capsule (segment with radius rad). w = angular speed of a flipper around its pivot (0 for walls) */\nfunction hitSeg(b,x1,y1,x2,y2,rad,e,piv,w){\n  var dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy,t=len2?((b.x-x1)*dx+(b.y-y1)*dy)/len2:0;\n  t=t<0?0:t>1?1:t;\n  var cx=x1+dx*t,cy=y1+dy*t,nx=b.x-cx,ny=b.y-cy,d=Math.sqrt(nx*nx+ny*ny),min=BR+rad;\n  if(d>=min)return false;\n  if(d<0.0001){nx=0;ny=-1;d=1;}\n  nx/=d;ny/=d;b.x=cx+nx*min;b.y=cy+ny*min;\n  var ux=0,uy=0;\n  if(piv&&w){ux=-w*(cy-piv.y);uy=w*(cx-piv.x);}\n  var rvx=b.vx-ux,rvy=b.vy-uy,vn=rvx*nx+rvy*ny;\n  if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;}\n  return true;\n}\nfunction stepBall(G,api,g,b,dt){\n  b.vy+=GRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;\n  var i;\n  for(i=0;i<WALLS.length;i++){var w=WALLS[i];hitSeg(b,w[0],w[1],w[2],w[3],0,0.45,null,0);}\n  [[g.fl,-1],[g.fr,1]].forEach(function(F){\n    var f=F[0],s=flipSeg(f,F[1]),w=f.w*(F[1]<0?1:-1);\n    hitSeg(b,s.x1,s.y1,s.x2,s.y2,FRAD,0.3,s.p,w);\n  });\n  for(i=0;i<BUMPERS.length;i++){\n    var k=BUMPERS[i],dx=b.x-k.x,dy=b.y-k.y,d=Math.sqrt(dx*dx+dy*dy);\n    if(d<k.r+BR){\n      var nx=dx/d,ny=dy/d;b.x=k.x+nx*(k.r+BR);b.y=k.y+ny*(k.r+BR);\n      var vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=2*vn*nx;b.vy-=2*vn*ny;}\n      b.vx+=nx*420;b.vy+=ny*420;\n      if(k.cool<=0){k.cool=0.12;k.flash=0.25;points(G,api,g,5,k.x,k.y-60,'#6df0ff');api.SND.soft();}\n    }\n  }\n  for(i=0;i<POSTS.length;i++){var p=POSTS[i];hitSeg(b,p.x,p.y,p.x,p.y,p.r,0.5,null,0);}\n  for(i=0;i<LANES.length;i++){\n    var ln=LANES[i];\n    if(!ln.on&&Math.abs(b.x-ln.x)<34&&Math.abs(b.y-ln.y)<26){\n      ln.on=true;api.SND.nice();points(G,api,g,2,ln.x,ln.y+60,'#ffd36b');\n      if(LANES.every(function(z){return z.on;})){\n        G.rival++;points(G,api,g,25,590,380,'#6df0a0');api.SND.swish();api.burst(590,330,40);\n        LANES.forEach(function(z){z.on=false;});\n      }\n    }\n  }\n  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);\n  if(sp>1900){b.vx*=1900/sp;b.vy*=1900/sp;}\n}\nfunction drawFlipper(c,s,col){\n  var a=Math.atan2(s.y2-s.y1,s.x2-s.x1);\n  c.save();c.translate(s.x1,s.y1);c.rotate(a);\n  c.fillStyle=col;c.beginPath();c.arc(0,0,FRAD+5,Math.PI/2,Math.PI*1.5);c.lineTo(FLEN,-FRAD+5);c.arc(FLEN,0,FRAD-5,-Math.PI/2,Math.PI/2);c.closePath();c.fill();\n  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(4,-FRAD+2,FLEN-10,4);\n  c.fillStyle='#0b1030';c.beginPath();c.arc(0,0,5,0,Math.PI*2);c.fill();\n  c.restore();\n}\n\nAPI=Arcade.create({\n  prefix:'pb',gameId:'pb',title:'Flipper Lab',\n  how:'Answer correctly to earn play time and power-ups. Flippers: \u2190 and \u2192 (Space flips both).',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Lane bonus'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ffd36b','--cyan':'#6df0ff','--bg':'#070b1c','--panel2':'#0c1430','--line':'#2c3f86'},\n  progression:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],pattern:[0,1,2,1,2,1,0,2],beat:0.28,\n  drawBg:function(c){\n    var gr=c.createLinearGradient(0,0,0,1080);gr.addColorStop(0,'#070b1c');gr.addColorStop(1,'#141b46');c.fillStyle=gr;c.fillRect(0,0,1180,1080);\n    c.save();c.beginPath();c.moveTo(L,BOT);c.lineTo(L,330);c.lineTo(L+110,TOP);c.lineTo(R-110,TOP);c.lineTo(R,330);c.lineTo(R,BOT);c.closePath();\n    var tg=c.createLinearGradient(0,TOP,0,BOT);tg.addColorStop(0,'#10204f');tg.addColorStop(1,'#0a1233');c.fillStyle=tg;c.fill();c.clip();\n    // faint periodic-table grid on the playfield\n    c.strokeStyle='rgba(109,240,255,.06)';c.lineWidth=2;\n    for(var x=L;x<=R;x+=55){c.beginPath();c.moveTo(x,TOP);c.lineTo(x,BOT);c.stroke();}\n    for(var y=TOP;y<=BOT;y+=55){c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();}\n    // orbit rings behind the bumpers\n    c.strokeStyle='rgba(183,139,255,.22)';c.lineWidth=3;\n    c.beginPath();c.ellipse(590,500,250,120,0,0,Math.PI*2);c.stroke();\n    c.beginPath();c.ellipse(590,500,250,120,Math.PI/3,0,Math.PI*2);c.stroke();\n    c.beginPath();c.ellipse(590,500,250,120,-Math.PI/3,0,Math.PI*2);c.stroke();\n    c.restore();\n    c.strokeStyle='#6df0ff';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';\n    for(var i=0;i<WALLS.length;i++){var w=WALLS[i];c.beginPath();c.moveTo(w[0],w[1]);c.lineTo(w[2],w[3]);c.stroke();}\n    c.fillStyle='#ff6b81';c.font='800 22px Nunito,sans-serif';c.textAlign='center';\n    c.fillText('DRAIN',590,992);\n  },\n  init:function(G){\n    G.g={balls:[],fl:{a:REST,w:0},fr:{a:REST,w:0},keys:{l:false,r:false,sp:false},pw:{dbl:0,save:0},spawnT:0.8,lost:0};\n    BUMPERS.forEach(function(k){k.cool=0;k.flash=0;});LANES.forEach(function(z){z.on=false;});\n  },\n  heat:function(G){var g=G.g;if(!g)return '';return g.pw.dbl>0?'Double points!':g.pw.save>0?'Ball saver':g.balls.length>1?g.balls.length+' balls':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){newBall(g);api.popup(590,400,'Extra ball!','#ffd36b');return {msg:'An extra ball drops in. Keep them both alive!'};}\n    if(roll===1){g.pw.save=12;api.popup(590,400,'Ball saver!','#6df0a0');return {msg:'For a while, balls that drain bounce back up.'};}\n    g.pw.dbl=12;api.popup(590,400,'Double points!','#ff6bd6');return {msg:'Every bumper and lane is worth double for a while.'};\n  },\n  onWrong:function(G){return {msg:'No power-up this time. The ball keeps rolling!'};},\n  onKeyDown:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A'||k==='z'||k==='Z')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D'||k==='/')ks.r=true;\n    if(k===' ')ks.sp=true;\n    if(API&&(ks.l||ks.r||ks.sp))API.SND.soft();\n  },\n  onKeyUp:function(k,G){\n    if(!G||!G.g||!G.g.keys)return;var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A'||k==='z'||k==='Z')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D'||k==='/')ks.r=false;\n    if(k===' ')ks.sp=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    BUMPERS.forEach(function(k){if(k.flash>0)k.flash-=dt;if(k.cool>0)k.cool-=dt;});\n    if(!running){g.fl.w=0;g.fr.w=0;return;}\n    if(g.pw.dbl>0)g.pw.dbl-=dt;if(g.pw.save>0)g.pw.save-=dt;\n    var n=Math.ceil(dt/0.002),h=dt/n,s,i;\n    var wantL=g.keys.l||g.keys.sp,wantR=g.keys.r||g.keys.sp;\n    for(s=0;s<n;s++){\n      [[g.fl,wantL],[g.fr,wantR]].forEach(function(F){\n        var f=F[0],tgt=F[1]?UP:REST,old=f.a,d=tgt-f.a,mx=FSPD*h;\n        f.a+=d>mx?mx:d<-mx?-mx:d;f.w=(f.a-old)/h;\n      });\n      for(i=g.balls.length-1;i>=0;i--)stepBall(G,api,g,g.balls[i],h);\n    }\n    for(i=g.balls.length-1;i>=0;i--){\n      var b=g.balls[i];\n      b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();\n      if(b.y>BOT+BR*2||b.x<L-40||b.x>R+40){\n        if(g.pw.save>0){b.x=rand(560,620);b.y=BOT-30;b.vx=rand(-200,200);b.vy=-1500;b.trail=[];api.popup(590,860,'Saved!','#6df0a0');api.SND.nice();continue;}\n        g.balls.splice(i,1);\n        if(!g.balls.length){G.you=Math.max(0,G.you-5);api.hud();api.popup(590,840,'Ball drained \u22125','#ff6b81');api.SND.bad();g.spawnT=1.0;}\n      }\n    }\n    if(!g.balls.length){g.spawnT-=dt;if(g.spawnT<=0)newBall(g);}\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g||!g.fl)return;\n    LANES.forEach(function(z){\n      c.fillStyle=z.on?'#ffd36b':'rgba(255,211,107,.18)';c.beginPath();c.arc(z.x,z.y,16,0,Math.PI*2);c.fill();\n      c.strokeStyle='#ffd36b';c.lineWidth=3;c.stroke();\n    });\n    POSTS.forEach(function(p){c.fillStyle='#c9d6ff';c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();});\n    var syms=['H','He','O'];\n    BUMPERS.forEach(function(k,i){\n      var f=Math.max(0,k.flash)/0.25;\n      c.fillStyle=f>0?'#ffffff':'#1d3a7a';c.beginPath();c.arc(k.x,k.y,k.r,0,Math.PI*2);c.fill();\n      c.lineWidth=6;c.strokeStyle=f>0?'#ffd36b':'#6df0ff';c.stroke();\n      c.strokeStyle='rgba(183,139,255,.8)';c.lineWidth=3;\n      c.beginPath();c.ellipse(k.x,k.y,k.r+16,k.r*0.45,api.t*1.4+i,0,Math.PI*2);c.stroke();\n      c.fillStyle=f>0?'#0b1030':'#eef3ff';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText(syms[i],k.x,k.y+12);\n    });\n    drawFlipper(c,flipSeg(g.fl,-1),'#ff6bd6');drawFlipper(c,flipSeg(g.fr,1),'#ff6bd6');\n    if(g.pw.save>0){c.strokeStyle='rgba(109,240,160,'+(0.5+0.4*Math.sin(api.t*8))+')';c.lineWidth=8;c.beginPath();c.moveTo(PIV_L.x+FLEN-10,BOT-6);c.lineTo(PIV_R.x-FLEN+10,BOT-6);c.stroke();}\n    g.balls.forEach(function(b){\n      b.trail.forEach(function(t,i){c.globalAlpha=i/18;c.fillStyle='#ffd36b';c.beginPath();c.arc(t.x,t.y,BR*0.8,0,Math.PI*2);c.fill();});\n      c.globalAlpha=1;var gr=c.createRadialGradient(b.x-4,b.y-5,2,b.x,b.y,BR);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#b9c6e6');\n      c.fillStyle=gr;c.beginPath();c.arc(b.x,b.y,BR,0,Math.PI*2);c.fill();\n    });\n    if(!g.balls.length){c.fillStyle='#eef3ff';c.font='800 64px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('Next ball\u2026',590,720);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,1004,600,44);\n    c.fillStyle='#eef3ff';c.font='800 22px Nunito,sans-serif';c.textAlign='center';\n    var tx=[];if(g.pw.dbl>0)tx.push('Double '+Math.ceil(g.pw.dbl)+'s');if(g.pw.save>0)tx.push('Saver '+Math.ceil(g.pw.save)+'s');\n    c.fillText(tx.length?tx.join('  \u00b7  '):'\u2190 left flipper  \u00b7  \u2192 right flipper  \u00b7  Space both',590,1034);\n  },\n  resultText:function(G){return G.you+' points \u00b7 '+G.rival+' lane bonus'+(G.rival===1?'':'es');}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "nv": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Nova Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Nova Lab: space shooter. Your probe fires on its own; move with \u2190 \u2192 (or A and D).\n   Clear each wave of space blobs. Getting hit costs 5 points.\n   Each correct answer gives a power-up: triple shot, a shield, or rapid fire. */\n(function(){\n'use strict';\nvar L=60,R=1120,TOP=200,BOT=1000,SHIPY=925,COLS=8,ROWS=4;\nvar ROWCOL=['#ff6b81','#ffd36b','#6df0a0','#38d6ff'];\nvar API=null,STARS=[];\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfor(var si=0;si<90;si++)STARS.push({x:rand(L,R),y:rand(TOP,BOT),s:rand(1,3),v:rand(20,70)});\n\nfunction wave(g){\n  g.foes=[];g.dir=1;g.ox=0;g.oy=0;\n  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)\n    g.foes.push({c:c,r:r,hp:r===0?2:1,val:ROWS-r,col:ROWCOL[r],dive:null,ph:rand(0,6)});\n  g.speed=70+g.waves*14;g.fireT=1.6;g.diveT=3.5;\n}\nfunction foePos(g,f){\n  if(f.dive)return {x:f.dive.x,y:f.dive.y};\n  return {x:250+f.c*92+g.ox,y:TOP+90+f.r*78+g.oy};\n}\nfunction hurt(G,api,g){\n  if(g.inv>0)return;\n  if(g.pw.shield>0){g.pw.shield=0;g.inv=1.2;api.popup(g.x,SHIPY-90,'Shield blocked it!','#6df0ff');api.SND.nice();return;}\n  G.you=Math.max(0,G.you-5);api.hud();g.inv=2;api.shake(0.25);api.SND.bad();api.popup(g.x,SHIPY-90,'Hit \u22125','#ff6b81');api.burst(g.x,SHIPY,20);\n}\nfunction drawFoe(c,x,y,col,t,hp){\n  var w=Math.sin(t*6)*4;\n  c.fillStyle=col;c.beginPath();\n  c.moveTo(x-30,y+10);\n  c.quadraticCurveTo(x-34,y-26,x,y-28);c.quadraticCurveTo(x+34,y-26,x+30,y+10);\n  for(var i=0;i<4;i++){var bx=x+30-i*20;c.quadraticCurveTo(bx-5,y+22+(i%2?w:-w),bx-10,y+12);c.quadraticCurveTo(bx-15,y+20,bx-20,y+10);}\n  c.closePath();c.fill();\n  if(hp>1){c.strokeStyle='#ffffff';c.lineWidth=3;c.stroke();}\n  c.fillStyle='#0b1030';c.beginPath();c.arc(x-10,y-8,6,0,Math.PI*2);c.arc(x+10,y-8,6,0,Math.PI*2);c.fill();\n  c.fillStyle='#ffffff';c.beginPath();c.arc(x-8,y-10,2,0,Math.PI*2);c.arc(x+12,y-10,2,0,Math.PI*2);c.fill();\n}\nfunction drawShip(c,x,y,t,flash){\n  if(flash&&Math.floor(t*12)%2)return;\n  c.fillStyle='#ff9f43';c.beginPath();c.moveTo(x-12,y+30);c.lineTo(x,y+48+Math.sin(t*40)*6);c.lineTo(x+12,y+30);c.fill();\n  c.fillStyle='#d9e4ff';c.beginPath();c.moveTo(x,y-38);c.lineTo(x+20,y+4);c.lineTo(x+46,y+26);c.lineTo(x+18,y+32);c.lineTo(x-18,y+32);c.lineTo(x-46,y+26);c.lineTo(x-20,y+4);c.closePath();c.fill();\n  c.fillStyle='#38d6ff';c.beginPath();c.ellipse(x,y-4,9,15,0,0,Math.PI*2);c.fill();\n  c.fillStyle='#ff6bd6';c.fillRect(x-44,y+20,10,8);c.fillRect(x+34,y+20,10,8);\n}\n\nAPI=Arcade.create({\n  prefix:'nv',gameId:'nv',title:'Nova Lab',\n  how:'Answer correctly to earn play time and power-ups. Move with \u2190 \u2192. Your probe fires on its own.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Waves'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#38d6ff','--cyan':'#6df0ff','--bg':'#05050f','--panel2':'#0c0a22','--line':'#3a2f7a'},\n  progression:[[57,60,64],[55,59,62],[53,57,60],[52,55,59]],pattern:[0,2,1,2,0,2,1,0],beat:0.26,\n  drawBg:function(c){\n    var gr=c.createLinearGradient(0,0,0,1080);gr.addColorStop(0,'#05050f');gr.addColorStop(1,'#120a2e');c.fillStyle=gr;c.fillRect(0,0,1180,1080);\n    var nb=c.createRadialGradient(880,420,10,880,420,420);nb.addColorStop(0,'rgba(183,139,255,.28)');nb.addColorStop(1,'rgba(183,139,255,0)');c.fillStyle=nb;c.fillRect(0,0,1180,1080);\n    var pl=c.createRadialGradient(240,1000,40,240,1080,330);pl.addColorStop(0,'#2b6f9e');pl.addColorStop(1,'#0b1f3a');\n    c.fillStyle=pl;c.beginPath();c.arc(240,1240,330,0,Math.PI*2);c.fill();\n    c.strokeStyle='rgba(109,240,255,.5)';c.lineWidth=4;c.strokeRect(L,TOP,R-L,BOT-TOP);\n  },\n  init:function(G){\n    var g=G.g={x:590,keys:{},shots:[],bombs:[],foes:[],waves:0,pw:{tri:0,shield:0,rapid:0,cool:0},inv:0,gunT:0,dir:1,ox:0,oy:0,speed:70,fireT:2,diveT:3,clearT:0};\n    wave(g);\n  },\n  heat:function(G){var g=G.g;if(!g||!g.pw)return '';return g.pw.tri>0?'Triple shot!':g.pw.rapid>0?'Rapid fire!':g.pw.shield>0?'Shield up':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.tri=12;g.pw.cool=0;api.popup(g.x,SHIPY-90,'Triple shot!','#ffd36b');return {msg:'Your probe fires three lasers at once.'};}\n    if(roll===1){g.pw.shield=16;api.popup(g.x,SHIPY-90,'Shield!','#6df0ff');return {msg:'A shield blocks the next hit.'};}\n    g.pw.rapid=12;g.pw.cool=0;api.popup(g.x,SHIPY-90,'Rapid fire!','#ff6bd6');return {msg:'Your probe fires twice as fast.'};\n  },\n  onWrong:function(G,api){var g=G.g;g.pw.cool=5;return {msg:'Your laser cools down and fires slower for a few seconds.'};},\n  onKeyDown:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n  },\n  onKeyUp:function(k,G){\n    if(!G||!G.g||!G.g.keys)return;var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!g.pw)return;\n    STARS.forEach(function(s){if(running){s.y+=s.v*dt;if(s.y>BOT)s.y=TOP;}});\n    if(!running)return;\n    var i,j;\n    ['tri','shield','rapid','cool'].forEach(function(k){if(g.pw[k]>0)g.pw[k]-=dt;});\n    if(g.inv>0)g.inv-=dt;\n    g.x=Math.max(L+50,Math.min(R-50,g.x+((g.keys.r?1:0)-(g.keys.l?1:0))*760*dt));\n    // fire\n    g.gunT-=dt;\n    if(g.gunT<=0&&g.clearT<=0){\n      g.gunT=g.pw.rapid>0?0.14:g.pw.cool>0?0.55:0.28;\n      g.shots.push({x:g.x,y:SHIPY-40,vx:0});\n      if(g.pw.tri>0){g.shots.push({x:g.x-16,y:SHIPY-30,vx:-220});g.shots.push({x:g.x+16,y:SHIPY-30,vx:220});}\n    }\n    for(i=g.shots.length-1;i>=0;i--){var s=g.shots[i];s.y-=1100*dt;s.x+=s.vx*dt;if(s.y<TOP||s.x<L||s.x>R)g.shots.splice(i,1);}\n    // wave cleared pause\n    if(g.clearT>0){g.clearT-=dt;if(g.clearT<=0)wave(g);return;}\n    // formation movement\n    var inForm=g.foes.filter(function(f){return !f.dive;});\n    if(inForm.length){\n      var minx=1e9,maxx=-1e9,maxy=-1e9;\n      inForm.forEach(function(f){var p=foePos(g,f);minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y);});\n      g.ox+=g.dir*g.speed*dt;\n      if(maxx+g.dir*g.speed*dt>R-40||minx+g.dir*g.speed*dt<L+40){g.dir*=-1;g.oy+=26;}\n      if(maxy>SHIPY-120){g.oy-=260;G.you=Math.max(0,G.you-5);api.hud();api.popup(590,600,'They got too close! \u22125','#ff6b81');api.SND.bad();}\n    }\n    // enemy shots and dives\n    g.fireT-=dt;\n    if(g.fireT<=0&&g.foes.length){g.fireT=Math.max(0.5,1.5-g.waves*0.12)*rand(0.7,1.3);\n      var sh=g.foes[Math.floor(Math.random()*g.foes.length)],p=foePos(g,sh);g.bombs.push({x:p.x,y:p.y+20,v:300+g.waves*20});}\n    g.diveT-=dt;\n    if(g.diveT<=0&&inForm.length){g.diveT=Math.max(2,5-g.waves*0.4);\n      var d=inForm[Math.floor(Math.random()*inForm.length)],q=foePos(g,d);d.dive={x:q.x,y:q.y,t:0,tx:g.x};}\n    g.foes.forEach(function(f){\n      if(!f.dive)return;var dv=f.dive;dv.t+=dt;dv.y+=(260+g.waves*20)*dt;dv.x+=Math.sin(dv.t*3)*200*dt+(dv.tx-dv.x)*0.6*dt;\n      if(dv.y>BOT+40){f.dive=null;}\n    });\n    // bombs hit ship\n    for(i=g.bombs.length-1;i>=0;i--){var b=g.bombs[i];b.y+=b.v*dt;\n      if(b.y>BOT){g.bombs.splice(i,1);continue;}\n      if(Math.abs(b.x-g.x)<36&&Math.abs(b.y-SHIPY)<36){g.bombs.splice(i,1);hurt(G,api,g);}}\n    // shots hit foes; divers ram ship\n    for(j=g.foes.length-1;j>=0;j--){\n      var f=g.foes[j],fp=foePos(g,f),dead=false;\n      for(i=g.shots.length-1;i>=0;i--){var s2=g.shots[i];\n        if(Math.abs(s2.x-fp.x)<32&&Math.abs(s2.y-fp.y)<30){g.shots.splice(i,1);f.hp--;\n          if(f.hp<=0){dead=true;var v=f.val*(f.dive?2:1);G.you+=v;api.hud();api.popup(fp.x,fp.y-30,'+'+v,f.col);api.burst(fp.x,fp.y,8);api.SND.soft();break;}}}\n      if(!dead&&f.dive&&Math.abs(fp.x-g.x)<50&&Math.abs(fp.y-SHIPY)<44){dead=true;hurt(G,api,g);}\n      if(dead)g.foes.splice(j,1);\n    }\n    if(!g.foes.length&&g.clearT<=0){\n      g.waves++;G.rival=g.waves;G.you+=15;api.hud();api.popup(590,560,'Wave cleared! +15','#6df0a0');api.SND.swish();api.burst(590,560,50);\n      g.clearT=1.6;g.bombs=[];\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g||!g.pw)return;\n    STARS.forEach(function(s){c.fillStyle='rgba(238,243,255,'+(0.3+s.s*0.2)+')';c.fillRect(s.x,s.y,s.s,s.s);});\n    g.foes.forEach(function(f){var p=foePos(g,f);drawFoe(c,p.x,p.y,f.col,api.t+f.ph,f.hp);});\n    c.fillStyle='#ff6b81';g.bombs.forEach(function(b){c.beginPath();c.arc(b.x,b.y,8,0,Math.PI*2);c.fill();});\n    c.fillStyle=g.pw.cool>0?'#7d8bb5':'#6df0a0';g.shots.forEach(function(s){c.fillRect(s.x-3,s.y-16,6,24);});\n    drawShip(c,g.x,SHIPY,api.t,g.inv>0);\n    if(g.pw.shield>0){c.strokeStyle='rgba(109,240,255,'+(0.55+0.3*Math.sin(api.t*6))+')';c.lineWidth=5;c.beginPath();c.arc(g.x,SHIPY,62,0,Math.PI*2);c.stroke();}\n    if(g.clearT>0){c.fillStyle='#eef3ff';c.font='800 64px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('Wave '+(g.waves+1)+' incoming\u2026',590,520);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,1004,600,44);\n    c.fillStyle='#eef3ff';c.font='800 22px Nunito,sans-serif';c.textAlign='center';\n    var tx=[];if(g.pw.tri>0)tx.push('Triple '+Math.ceil(g.pw.tri)+'s');if(g.pw.rapid>0)tx.push('Rapid '+Math.ceil(g.pw.rapid)+'s');if(g.pw.shield>0)tx.push('Shield');if(g.pw.cool>0)tx.push('Slow laser '+Math.ceil(g.pw.cool)+'s');\n    c.fillText(tx.length?tx.join('  \u00b7  '):'\u2190 \u2192 move  \u00b7  your probe fires on its own',590,1034);\n  },\n  resultText:function(G){return 'You cleared '+G.rival+' wave'+(G.rival===1?'':'s')+' \u00b7 '+G.you+' points';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "sp": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Sprint Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Sprint Lab: endless runner. A scientist sprints through the lab.\n   Jump with Space or \u2191 (or W). Press again in the air for a double jump.\n   Grab atoms for points; crashing into lab gear costs 5 points.\n   Each correct answer gives a power-up: a shield bubble, an atom magnet, or double points. */\n(function(){\n'use strict';\nvar GROUND=900,RX=250,GRAV=2700,JUMP=1080,JUMP2=900,TOP=200;\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\nvar KINDS=[\n  {k:'beaker',w:46,h:62},{k:'flask',w:58,h:78},{k:'crate',w:76,h:76},{k:'stack',w:76,h:140},{k:'cone',w:56,h:56}\n];\nfunction spawnObs(g){\n  var pool=g.dist<2500?KINDS.slice(0,3):KINDS,o=pool[Math.floor(Math.random()*pool.length)];\n  g.obs.push({k:o.k,x:1240,w:o.w,h:o.h,passed:false});\n  if(Math.random()<0.25&&g.dist>3000&&o.h<80){var o2=KINDS[Math.floor(Math.random()*2)];g.obs.push({k:o2.k,x:1240+o.w+6,w:o2.w,h:o2.h,passed:false});}\n  g.nextObs=rand(g.speed*0.95,g.speed*1.7);\n}\nfunction spawnAtoms(g){\n  var h=Math.random()<0.5?rand(60,120):rand(200,300),n=3+Math.floor(Math.random()*3);\n  for(var i=0;i<n;i++)g.atoms.push({x:1240+i*60,y:GROUND-h-Math.sin(i/(n-1)*Math.PI)*40,got:false});\n  g.nextAtoms=rand(500,900);\n}\nfunction drawObs(c,o){\n  var x=o.x,y=GROUND-o.h;\n  if(o.k==='beaker'){c.fillStyle='rgba(200,230,255,.35)';c.fillRect(x,y,o.w,o.h);c.fillStyle='#6df0a0';c.fillRect(x+3,y+o.h*0.45,o.w-6,o.h*0.55-3);\n    c.strokeStyle='#d9e4ff';c.lineWidth=4;c.strokeRect(x,y,o.w,o.h);}\n  else if(o.k==='flask'){c.fillStyle='rgba(200,230,255,.35)';c.beginPath();c.moveTo(x+o.w*0.38,y);c.lineTo(x+o.w*0.62,y);c.lineTo(x+o.w*0.62,y+o.h*0.35);\n    c.lineTo(x+o.w,y+o.h);c.lineTo(x,y+o.h);c.lineTo(x+o.w*0.38,y+o.h*0.35);c.closePath();c.fill();c.strokeStyle='#d9e4ff';c.lineWidth=4;c.stroke();\n    c.fillStyle='#ff6bd6';c.beginPath();c.moveTo(x+o.w*0.2,y+o.h*0.7);c.lineTo(x+o.w*0.8,y+o.h*0.7);c.lineTo(x+o.w-3,y+o.h-3);c.lineTo(x+3,y+o.h-3);c.closePath();c.fill();}\n  else if(o.k==='crate'||o.k==='stack'){var n=o.k==='stack'?2:1,hh=o.h/n;\n    for(var i=0;i<n;i++){var yy=y+i*hh;c.fillStyle='#b9824a';c.fillRect(x,yy,o.w,hh-2);c.strokeStyle='#7a5228';c.lineWidth=4;c.strokeRect(x+2,yy+2,o.w-4,hh-6);\n      c.beginPath();c.moveTo(x+4,yy+4);c.lineTo(x+o.w-4,yy+hh-6);c.stroke();\n      c.fillStyle='#ffd36b';c.font='800 18px Nunito,sans-serif';c.textAlign='center';c.fillText('\u26a0',x+o.w/2,yy+hh/2+6);}}\n  else{c.fillStyle='#ff9f43';c.beginPath();c.moveTo(x+o.w/2,y);c.lineTo(x+o.w,y+o.h);c.lineTo(x,y+o.h);c.closePath();c.fill();\n    c.fillStyle='#ffffff';c.fillRect(x+o.w*0.3,y+o.h*0.5,o.w*0.4,8);}\n}\nfunction drawRunner(c,g,t){\n  var x=RX,y=g.y,air=g.y<GROUND-1,ph=g.legT*14;\n  if(g.inv>0&&Math.floor(t*12)%2)return;\n  c.save();c.translate(x,y);\n  c.strokeStyle='#1b2a5a';c.lineWidth=10;c.lineCap='round';\n  var a1=air?0.6:Math.sin(ph)*0.8,a2=air?-0.4:-Math.sin(ph)*0.8;\n  c.beginPath();c.moveTo(0,-50);c.lineTo(Math.sin(a1)*40,-50+Math.cos(a1)*48);c.stroke();\n  c.beginPath();c.moveTo(0,-50);c.lineTo(Math.sin(a2)*40,-50+Math.cos(a2)*48);c.stroke();\n  c.fillStyle='#ffffff';c.beginPath();c.moveTo(-20,-112);c.lineTo(20,-112);c.lineTo(26,-44);c.lineTo(-26,-44);c.closePath();c.fill();\n  c.strokeStyle='#c9d6ff';c.lineWidth=3;c.stroke();\n  c.strokeStyle='#f2c7a0';c.lineWidth=9;\n  c.beginPath();c.moveTo(-14,-100);c.lineTo(-14-Math.sin(a1)*26,-72);c.stroke();\n  c.beginPath();c.moveTo(14,-100);c.lineTo(14-Math.sin(a2)*26,-72);c.stroke();\n  c.fillStyle='#f2c7a0';c.beginPath();c.arc(2,-134,22,0,Math.PI*2);c.fill();\n  c.fillStyle='#5b3a1e';c.beginPath();c.arc(-2,-142,22,Math.PI*0.95,Math.PI*2.05);c.fill();\n  c.fillStyle='#38d6ff';c.fillRect(-4,-142,30,10);c.fillStyle='#0b1030';c.fillRect(-4,-142,30,3);\n  c.restore();\n  if(g.pw.shield>0){c.strokeStyle='rgba(109,240,255,'+(0.55+0.3*Math.sin(t*6))+')';c.lineWidth=5;c.beginPath();c.arc(x,y-78,92,0,Math.PI*2);c.stroke();}\n}\nfunction drawAtom(c,x,y,t){\n  c.fillStyle='#ffd36b';c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.fill();\n  c.strokeStyle='#6df0ff';c.lineWidth=3;\n  for(var i=0;i<3;i++){c.beginPath();c.ellipse(x,y,22,8,t*2+i*Math.PI/3,0,Math.PI*2);c.stroke();}\n}\n\nAPI=Arcade.create({\n  prefix:'sp',gameId:'sp',title:'Sprint Lab',\n  how:'Answer correctly to earn play time and power-ups. Jump with Space or \u2191. Press again in the air to double jump.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Jumps cleared'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#6df0a0','--cyan':'#6df0ff','--bg':'#071419','--panel2':'#0b1e26','--line':'#22566a'},\n  progression:[[60,64,67],[62,65,69],[57,60,64],[55,59,62]],pattern:[0,1,2,1,0,1,2,2],beat:0.22,\n  drawBg:function(c){\n    var gr=c.createLinearGradient(0,0,0,1080);gr.addColorStop(0,'#071419');gr.addColorStop(1,'#0f2c35');c.fillStyle=gr;c.fillRect(0,0,1180,1080);\n    c.fillStyle='#0a1f27';c.fillRect(0,GROUND,1180,1080-GROUND);\n    c.fillStyle='#6df0ff';c.fillRect(0,GROUND,1180,6);\n  },\n  init:function(G){\n    G.g={y:GROUND,vy:0,jumps:0,legT:0,speed:430,dist:0,obs:[],atoms:[],nextObs:600,nextAtoms:300,inv:0,pw:{shield:0,mag:0,dbl:0},keys:{},pts:0,scroll:0};\n  },\n  heat:function(G){var g=G.g;if(!g||!g.pw)return '';return g.pw.dbl>0?'Double points!':g.pw.mag>0?'Atom magnet':g.pw.shield>0?'Shield up':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.shield=16;api.popup(RX,GROUND-260,'Shield!','#6df0ff');return {msg:'A bubble shield blocks your next crash.'};}\n    if(roll===1){g.pw.mag=12;api.popup(RX,GROUND-260,'Atom magnet!','#ffd36b');return {msg:'Atoms fly to you for a while.'};}\n    g.pw.dbl=12;api.popup(RX,GROUND-260,'Double points!','#ff6bd6');return {msg:'Everything is worth double for a while.'};\n  },\n  onWrong:function(G){return {msg:'No power-up this time. Keep running!'};},\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g||!g.pw)return;\n    if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){\n      if(g.jumps===0&&g.y>=GROUND-1){g.vy=-JUMP;g.jumps=1;api.SND.soft();}\n      else if(g.jumps<2){g.vy=-JUMP2;g.jumps=2;api.SND.soft();}\n    }\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!g.pw||!running)return;\n    var i,mult=g.pw.dbl>0?2:1;\n    ['shield','mag','dbl'].forEach(function(k){if(g.pw[k]>0)g.pw[k]-=dt;});\n    if(g.inv>0)g.inv-=dt;\n    g.speed=Math.min(780,430+g.dist/60);\n    var mv=g.speed*dt;g.dist+=mv;g.scroll+=mv;g.legT+=dt*(g.speed/430);\n    g.vy+=GRAV*dt;g.y+=g.vy*dt;if(g.y>=GROUND){g.y=GROUND;g.vy=0;g.jumps=0;}\n    // distance points\n    g.pts+=mv;while(g.pts>=300){g.pts-=300;G.you+=mult;api.hud();}\n    g.nextObs-=mv;if(g.nextObs<=0)spawnObs(g);\n    g.nextAtoms-=mv;if(g.nextAtoms<=0)spawnAtoms(g);\n    for(i=g.obs.length-1;i>=0;i--){var o=g.obs[i];o.x-=mv;\n      if(o.x+o.w<-20){g.obs.splice(i,1);continue;}\n      var hit=RX+20>o.x+6&&RX-20<o.x+o.w-6&&g.y>GROUND-o.h+6;\n      if(hit){\n        g.obs.splice(i,1);\n        if(g.pw.shield>0){g.pw.shield=0;g.inv=0.8;api.popup(RX,GROUND-240,'Shield blocked it!','#6df0ff');api.SND.nice();api.burst(o.x,GROUND-o.h/2,14);}\n        else if(g.inv<=0){G.you=Math.max(0,G.you-5);api.hud();g.inv=1.5;api.shake(0.25);api.SND.bad();api.popup(RX,GROUND-240,'Crash \u22125','#ff6b81');api.burst(o.x,GROUND-o.h/2,14);}\n        continue;\n      }\n      if(!o.passed&&o.x+o.w<RX-20){o.passed=true;G.rival++;api.hud();}\n    }\n    for(i=g.atoms.length-1;i>=0;i--){var a=g.atoms[i];a.x-=mv;\n      if(g.pw.mag>0){var dx=RX-a.x,dy=(g.y-80)-a.y,d=Math.sqrt(dx*dx+dy*dy);if(d<520&&d>1){a.x+=dx/d*900*dt;a.y+=dy/d*900*dt;}}\n      if(a.x<-40){g.atoms.splice(i,1);continue;}\n      if(Math.abs(a.x-RX)<46&&Math.abs(a.y-(g.y-80))<90){g.atoms.splice(i,1);var v=2*mult;G.you+=v;api.hud();api.popup(a.x,a.y-30,'+'+v,'#ffd36b');api.SND.nice();}\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g||!g.pw)return;\n    // shelves and windows scroll slowly behind\n    var off=-(g.scroll*0.3)%320;\n    for(var x=off;x<1180;x+=320){\n      c.fillStyle='rgba(109,240,255,.07)';c.fillRect(x+30,TOP+130,220,300);\n      c.strokeStyle='rgba(109,240,255,.2)';c.lineWidth=3;c.strokeRect(x+30,TOP+130,220,300);\n      c.fillStyle='rgba(109,240,255,.16)';c.fillRect(x+30,TOP+270,220,6);\n      c.fillStyle='r \u2193 (or W and S). Every 10 yards = 1 point. A touchdown = 7 points.\n   Each correct answer gives a power-up: a speed burst, a spin move, or blockers who clear the way. */\n(function(){\n'use strict';\nvar FT=230,FB=990,PX=330,YD=24,START=20;\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfunction yardOf(g){return START+g.dist/YD;}\nfunction newDrive(g){g.dist=0;g.last10=2;g.defs=[];g.spawnT=1.2;g.y=(FT+FB)/2;}\nfunction spawnDef(g){\n  var n=yardOf(g)>60?2:1;\n  for(var i=0;i<n;i++)g.defs.push({x:1230+i*rand(60,160),y:rand(FT+50,FB-50),sp:rand(90,170),chase:rand(110,200),ph:rand(0,6)});\n  g.spawnT=Math.max(0.55,1.25-g.tds*0.08)*rand(0.75,1.25);\n}\nfunction drawPlayer(c,x,y,col,t,run,ball){\n  var s=Math.sin(t*18)*(run?6:0);\n  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(x,y+26,30,10,0,0,Math.PI*2);c.fill();\n  c.fillStyle='#1b2a5a';c.fillRect(x-14,y+6+s*0.5,9,20);c.fillRect(x+5,y+6-s*0.5,9,20);\n  c.fillStyle=col;c.beginPath();c.ellipse(x,y-4,24,20,0,0,Math.PI*2);c.fill();\n  c.fillStyle='#ffffff';c.fillRect(x-24,y-12,48,5);\n  c.fillStyle=col;c.beginPath();c.arc(x+4,y-28,15,0,Math.PI*2);c.fill();\n  c.strokeStyle='#d9e4ff';c.lineWidth=3;c.beginPath();c.moveTo(x+12,y-34);c.lineTo(x+22,y-24);c.moveTo(x+12,y-22);c.lineTo(x+22,y-24);c.stroke();\n  if(ball){c.fillStyle='#8a4b22';c.beginPath();c.ellipse(x+22,y-2,13,8,-0.4,0,Math.PI*2);c.fill();\n    c.strokeStyle='#ffffff';c.lineWidth=2;c.beginPath();c.moveTo(x+16,y);c.lineTo(x+27,y-5);c.stroke();}\n}\n\nAPI=Arcade.create({\n  prefix:'fb',gameId:'fb',title:'Gridiron Lab',\n  how:'Answer correctly to earn play time and power-ups. Dodge defenders with \u2191 \u2193. Reach the end zone for 7 points.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Touchdowns'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ff9f43','--cyan':'#6df0a0','--bg':'#06140c','--panel2':'#0b2016','--line':'#24603e'},\n  progression:[[55,59,62],[57,60,64],[53,57,60],[55,59,62]],pattern:[0,0,2,1,0,2,1,1],beat:0.25,\n  drawBg:function(c){c.fillStyle='#06140c';c.fillRect(0,0,1180,1080);},\n  init:function(G){G.g={y:(FT+FB)/2,dist:0,keys:{},defs:[],tds:0,pw:{fast:0,spin:0},spinUse:0,inv:0,party:0,last10:2,spawnT:1.2,scroll:0};newDrive(G.g);},\n  heat:function(G){var g=G.g;if(!g||!g.pw)return '';return g.pw.fast>0?'Speed burst!':g.pw.spin>0?'Spin move ready':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.fast=10;api.popup(PX+100,g.y-80,'Speed burst!','#ffd36b');return {msg:'You run much faster for a while.'};}\n    if(roll===1){g.pw.spin=18;api.popup(PX+100,g.y-80,'Spin move!','#6df0ff');return {msg:'Your next tackle misses: you spin right past it.'};}\n    var n=g.defs.length;g.defs.forEach(function(d){api.burst(d.x,d.y,6);});g.defs=[];g.spawnT=1.5;\n    api.popup(PX+200,g.y-80,'Blockers!','#6df0a0');return {msg:'Your blockers cleared '+(n?n+' defender'+(n===1?'':'s'):'the way')+'.'};\n  },\n  onWrong:function(){return {msg:'No power-up this time. Keep running!'};},\n  onKeyDown:function(k,G){var ks=G.g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=true;if(k==='ArrowDown'||k==='s'||k==='S')ks.d=true;},\n  onKeyUp:function(k,G){if(!G||!G.g||!G.g.keys)return;var ks=G.g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=false;if(k==='ArrowDown'||k==='s'||k==='S')ks.d=false;},\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!g.pw||!running)return;\n    ['fast','spin'].forEach(function(k){if(g.pw[k]>0)g.pw[k]-=dt;});\n    if(g.inv>0)g.inv-=dt;\n    if(g.party>0){g.party-=dt;if(g.party<=0)newDrive(g);return;}\n    g.y=Math.max(FT+40,Math.min(FB-40,g.y+((g.keys.d?1:0)-(g.keys.u?1:0))*520*dt));\n    var sp=(g.pw.fast>0?470:310)+Math.min(80,g.tds*10),mv=sp*dt;\n    g.dist+=mv;g.scroll+=mv;\n    var yd=yardOf(g);\n    while(yd>=(g.last10+1)*10&&g.last10<9){g.last10++;G.you+=1;api.hud();api.popup(PX,g.y-70,'+1','#ffd36b');}\n    if(yd>=100){\n      g.tds++;G.rival=g.tds;G.you+=7;api.hud(); .PI*2;return a;}\nfunction placeItems(g,upTo){\n  while(g.itemX<upTo){\n    g.itemX+=rand(260,420);\n    if(g.itemX>g.nextFuel){g.items.push({k:'fuel',x:g.itemX});g.nextFuel=g.itemX+rand(1600,2200);}\n    else g.items.push({k:'gem',x:g.itemX});\n  }\n}\nfunction crash(G,api,g,why){\n  if(g.pw.shield>0){g.pw.shield=0;g.ang=slope(g.x);g.air=false;g.y=GY(g.x);g.va=0;api.popup(SXR,g.y-160,'Shield saved you!','#6df0ff');api.SND.nice();return;}\n  G.you=Math.max(0,G.you-5);api.hud();api.shake(0.35);api.SND.bad();api.burst(SXR,GY(g.x)-60,24);\n  api.popup(SXR+80,GY(g.x)-180,why+' \u22125','#ff6b81');\n  g.x=Math.max(0,g.safe-150);g.y=GY(g.x);g.v=0;g.vx=0;g.vy=0;g.air=false;g.ang=slope(g.x);g.va=0;g.inv=1.2;\n}\n\nAPI=Arcade.create({\n  prefix:'hc',gameId:'hc',title:'Rover Lab',\n  how:'Answer correctly to earn play time and power-ups. \u2192 gas, \u2190 brake. In the air, \u2192 and \u2190 tip the rover. Land on your wheels!',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Meters'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ffd36b','--cyan':'#b78bff','--bg':'#07070f','--panel2':'#11101e','--line':'#3d3870'},\n  progression:[[53,57,60],[55,59,62],[57,60,64],[52,55,59]],pattern:[0,1,2,0,1,2,1,0],beat:0.32,\n  drawBg:function(c){\n    c.fillStyle='#07070f';c.fillRect(0,0,1180,1080);\n    for(var i=0;i<120;i++){c.fillStyle='rgba(238,243,255,'+Math.random().toFixed(2)+')';c.fillRect(Math.random()*1180,200+Math.random()*560,2,2);}\n    var e=c.createRadialGradient(930,330,10,930,330,90);e.addColorStop(0,'#5fb0ff');e.addColorStop(1,'#1d4f8a');\n    c.fillStyle=e;c.beginPath();c.arc(930,330,80,0,Math.PI*2);c.fill();\n    c.fillStyle='rgba(109,240,160,.7)';c.beginPath();c.ellipse(905,315,26,18,0.4,0,Math.PI*2);c.ellipse(955,355,20,12,-0.3,0,Math.PI*2);c.fill();\n  },\n  init:function(G){\n    var g=G.g={x:200,y:GY(200),v:0,vx:0,vy:0,air:false,ang:0,va:0,keys:{},fuel:100,safe:200,best:200,pw:{turbo:0,shield:0},inv:0,items:[],itemX:500,nextFuel:1800,pts: eWidth=5;c.beginPath();\n    for(x=0;x<=1180;x+=8){if(x===0)c.moveTo(x,GY(cam+x));else c.lineTo(x,GY(cam+x));}c.stroke();\n    // craters\n    c.fillStyle='rgba(30,28,48,.6)';\n    for(var k=Math.floor(cam/230);k<(cam+1180)/230;k++){var cxw=k*230+((k*97)%120),cy=GY(cxw)+40+((k*53)%60);c.beginPath();c.ellipse(cxw-cam,cy,26,9,0,0,Math.PI*2);c.fill();}\n    // distance flags\n    for(var m=Math.ceil(cam/2000)*2000;m<cam+1180;m+=2000){var fy=GY(m);c.strokeStyle='#eef3ff';c.lineWidth=3;c.beginPath();c.moveTo(m-cam,fy);c.lineTo(m-cam,fy-90);c.stroke();\n      c.fillStyle='#ff6bd6';c.fillRect(m-cam,fy-90,44,26);c.fillStyle='#eef3ff';c.font='800 18px Nunito,sans-serif';c.textAlign='left';c.fillText(Math.round(m/40)+'m',m-cam+4,fy-71);}\n    // items\n    g.items.forEach(function(it){var sx=it.x-cam,sy=GY(it.x)-70+Math.sin(api.t*3+it.x)*6;if(sx<-40||sx>1220)return;\n      if(it.k==='fuel'){c.fillStyle='#ff6b81';c.fillRect(sx-18,sy-24,36,48);c.fillStyle='#fff';c.font='800 22px Nunito,sans-serif';c.textAlign='center';c.fillText('F',sx,sy+8);}\n      else{c.fillStyle='#b78bff';c.beginPath();c.moveTo(sx,sy-22);c.lineTo(sx+14,sy);c.lineTo(sx,sy+22);c.lineTo(sx-14,sy);c.closePath();c.fill();c.fillStyle='rgba(255,255,255,.5)';c.fillRect(sx-3,sy-14,4,10);}});\n    // rover\n    if(!(g.inv>0&&Math.floor(api.t*12)%2)){\n      c.save();c.translate(SXR,g.y);c.rotate(g.ang);\n      c.fillStyle='#d9e4ff';c.fillRect(-54,-62,108,30);c.fillStyle='#38d6ff';c.fillRect(-10,-82,40,22);\n      c.fillStyle='#ffd36b';c.fillRect(-50,-36,100,8);\n      c.strokeStyle='#d9e4ff';c.lineWidth=4;c.beginPath();c.moveTo(-40,-62);c.lineTo(-40,-100);c.stroke();c.fillStyle='#ff6bd6';c.beginPath();c.arc(-40,-104,6,0,Math.PI*2);c.fill();\n      [-WB,WB].forEach(function(wx){c.save();c.translate(wx,-16);c.rotate(g.x/16);c.fillStyle='#1b1a2e';c.beginPath();c.arc(0,0,18,0,Math.PI*2);c.fill();\n        c.strokeStyle='#9db0d6';c.lineWidth=4;c.beginPath();c.moveTo(-14,0);c.lineTo(14,0);c.moveTo(0,-14);c.lineTo(0,14);c.  pass traffic for points, and avoid crashes.\n   Each correct answer gives a power-up: nitro, a shield, or double points. */\n(function(){\n'use strict';\nvar CY=880,RW=520,TOPY=200;\nvar COLS=['#ff6b81','#ffd36b','#b78bff','#6df0a0','#ff9f43','#d9e4ff'];\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfunction center(d){var a=Math.min(1,d/6000);return 590+a*(160*Math.sin(d/1300)+70*Math.sin(d/560+1));}\nfunction drawCar(c,x,y,col,t,me){\n  c.fillStyle='rgba(0,0,0,.3)';c.fillRect(x-28,y-44,62,96);\n  c.fillStyle='#14182e';c.fillRect(x-34,y-36,12,24);c.fillRect(x+22,y-36,12,24);c.fillRect(x-34,y+14,12,24);c.fillRect(x+22,y+14,12,24);\n  c.fillStyle=col;c.beginPath();c.moveTo(x-24,y-48);c.lineTo(x+24,y-48);c.lineTo(x+28,y+46);c.lineTo(x-28,y+46);c.closePath();c.fill();\n  c.fillStyle='#0b1030';c.fillRect(x-18,y-28,36,18);c.fillRect(x-18,y+18,36,12);\n  if(me){c.fillStyle='#ffffff';c.fillRect(x-4,y-48,8,94);}\n}\n\nAPI=Arcade.create({\n  prefix:'rc',gameId:'rc',title:'Circuit Lab',\n  how:'Answer correctly to earn play time and power-ups. Steer with \u2190 \u2192, brake with \u2193. Pass cars and stay on the road.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Cars passed'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#38d6ff','--cyan':'#ff9f43','--bg':'#0b0d14','--panel2':'#131826','--line':'#384263'},\n  progression:[[55,59,62],[57,60,64],[60,64,67],[53,57,60]],pattern:[0,1,2,1,0,1,2,1],beat:0.2,\n  drawBg:function(c){c.fillStyle='#0b0d14';c.fillRect(0,0,1180,1080);},\n  init:function(G){G.g={x:590,d:0,speed:300,keys:{},cars:[],next:500,pw:{nitro:0,shield:0,dbl:0},inv:0,pts:0,off:false};},\n  heat:function(G){var g=G.g;if(!g||!g.pw)return '';return g.pw.nitro>0?'Nitro!':g.pw.dbl>0?'Double points!':g.pw.shield>0?'Shield up':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.nitro=7;api.popup(g.x,CY-140,'Nitro!','#ffd36b');return {msg:'Nitro! You go super fast and s rgba(255,255,255,.35)';c.fillRect(p.x-PW/2,y,PW,5);\n      if(p.k==='crack'){c.strokeStyle='#6b4a2a';c.lineWidth=3;c.beginPath();c.moveTo(p.x-20,y);c.lineTo(p.x-6,y+10);c.lineTo(p.x+8,y+3);c.lineTo(p.x+18,y+18);c.stroke();}\n      if(p.spring){c.strokeStyle='#ffd36b';c.lineWidth=4;c.beginPath();c.moveTo(p.x-12,y);for(var s=0;s<4;s++)c.lineTo(p.x+(s%2?12:-12),y-6-s*6);c.stroke();}});\n    g.atoms.forEach(function(a){var y=a.y-g.camY;c.fillStyle='#ffd36b';c.beginPath();c.arc(a.x,y,8,0,Math.PI*2);c.fill();c.strokeStyle='#6df0ff';c.lineWidth=3;\n      for(var i=0;i<3;i++){c.beginPath();c.ellipse(a.x,y,20,7,api.t*2+i*1.05,0,Math.PI*2);c.stroke();}});\n    if(!(g.inv>0&&Math.floor(api.t*12)%2)){\n      var x=g.x,y=g.y-g.camY,sq=g.vy<0?1.08:0.94;\n      c.save();c.translate(x,y);c.scale(1/sq,sq);\n      if(g.pw.jet>0){c.fillStyle='#ffd36b';c.beginPath();c.moveTo(-30,-10);c.lineTo(-24,30+Math.random()*20);c.lineTo(-18,-10);c.moveTo(18,-10);c.lineTo(24,30+Math.random()*20);c.lineTo(30,-10);c.fill();}\n      c.fillStyle='#6df0a0';c.beginPath();c.ellipse(0,-34,30,34,0,0,Math.PI*2);c.fill();\n      c.fillStyle='#ffffff';c.beginPath();c.arc(-10,-42,9,0,Math.PI*2);c.arc(12,-42,9,0,Math.PI*2);c.fill();\n      c.fillStyle='#0b1030';c.beginPath();c.arc(-8+g.vx/120,-42,4,0,Math.PI*2);c.arc(14+g.vx/120,-42,4,0,Math.PI*2);c.fill();\n      c.fillStyle=g.pw.boots>0?'#ffd36b':'#1b2a5a';c.fillRect(-22,-4,14,8);c.fillRect(8,-4,14,8);\n      c.restore();\n    }\n    c.restore();\n    if(g.pw.net>0){c.strokeStyle='rgba(109,240,255,'+(0.5+0.3*Math.sin(api.t*6))+')';c.lineWidth=6;c.setLineDash([16,10]);c.beginPath();c.moveTo(L-30,994);c.lineTo(R+30,994);c.stroke();c.setLineDash([]);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,1004,600,44);c.fillStyle='#eef3ff';c.font='800 22px Nunito,sans-serif';c.textAlign='center';\n    var tx=[];if(g.pw.boots>0)tx.push('Boots '+Math.ceil(g.pw.boots)+'s');if(g.pw.jet>0)tx.push('Jetpack');if(g.pw.net>0)tx.push('Net ready');\n    c.fillText(tx.length?tx <script>
(function(){
'use strict';

function fit(){$('stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
addEventListener('resize',fit);fit();

var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

  if(last){if(GAMES.some(function(g){return g.id===last.game;}))st.game=last.game;
    var i=SikesQ.findSet(last.set);if(i>=0){st.set=last.set;st.grade=SETS[i].grade;st.topics=(last.topics||[]).slice();}}}catch(e){}

function curGame(){return GAMES.filter(function(g){return g.id===st.game;})[0];}

  var box=$('games');box.innerHTML='';
  GAMES.forEach(function(g){
    var b=document.createElement('button');b.className='gcard'+(g.id===st.game?' on':'');b.tabIndex=-1;
    var tl=topLine(g.id);b.innerHTML=g.art+'<div class="tx"><div class="nm">'+g.name+'</div><div class="ds">'+g.desc+'</div><div class="top'+(tl.indexOf('Top:')===0?'':' none')+'">'+tl+'</div></div>';
    b.addEventListener('click',function(){b.blur();st.game=g.id;renderGames();renderSummary();});
    box.appendChild(b);
  });
}

  var tabs=$('tabs');tabs.innerHTML='';
  [6,7,8].forEach(function(gr){

    b.addEventListener('click',function(){b.blur();st.grade=gr;

  SETS.filter(function(s){return s.grade===st.grade;}).forEach(function(s){

    b.innerHTML='<div class="sn">'+s.name+'</div><div class="st">TEKS '+s.teks+'</div>';

}

var LB={updated:null,games:{},skills:{}},lbGame=GAMES[0].id,lbSkill='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

}

  GAMES.forEach(function(g){
    var b=document.createElement('button');b.className='ltab'+(g.id===lbGame?' on':'');b.tabIndex=-1;b.textContent=g.name;
    b.addEventListener('click',function(){b.blur();lbGame=g.id;lbSkill='';renderLB();});tabs.appendChild(b);
  });
  var sk=(LB.skills&&LB.skills[lbGame])||{},sel=$('lbsel');sel.innerHTML='';
  var o=document.createElement('option');o.value='';o.textContent='All skills';sel.appendChild(o);
  SETS.forEach(function(s){if(sk[s.id]&&sk[s.id].length){var op=document.createElement('option');op.value=s.id;op.textContent='Grade '+s.grade+'  ·  '+s.name+'  (TEKS '+s.teks+')';sel.appendChild(op);}});
  if(lbSkill&&!sk[lbSkill])lbSkill='';sel.value=lbSkill;
  var list=lbSkill?sk[lbSkill]:((LB.games&&LB.games[lbGame])||[]),box=$('lbboard');
  if(!list||!list.length){box.innerHTML='<div class="lempty">No scores posted for this game yet.<br>Play a round and show your teacher your code!</div>';}
  else{
    var out='<div class="lhdr"><div>Rank</div><div>Name</div><div>Score</div><div>Skill</div><div>Accuracy</div></div>';
    list.slice(0,10).forEach(function(x,i){
      out+='<div class="lrow r'+(i+1)+'"><div class="rk">'+(i+1)+'</div><div>'+esc(x.name)+'</div><div class="sc">'+x.score+'</div><div class="sk">'+esc(x.skill)+'</div><div>'+Math.round(100*x.correct/x.answered)+'% ('+x.correct+'/'+x.answered+')</div></div>';
    });
    box.innerHTML=out;
  }
  $('lbfoot').textContent=LB.updated?('Updated '+new Date(LB.updated).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})):'';
}
$('lbsel').addEventListener('change',function(){lbSkill=this.value;renderLB();this.blur();});
function showView(v){
  var lb=v==='lb';
  $('playView').classList.toggle('hidden',lb);$('lbView').classList.toggle('hidden',!lb);
  $('nav-play').classList.toggle('on',!lb);$('nav-lb').classList.toggle('on',lb);
  if(lb){renderLB();loadLB();}
  try{history.replaceState(null,'',lb?'#leaderboard':location.pathname+location.search);}catch(e){}
}
$('nav-play').addEventListener('click',function(){showView('play');});
$('nav-lb').addEventListener('click',function(){showView('lb');});
var lastLive=0;
function loadLB(force){
  function got(j){LB=j||LB;renderGames();if(!$('lbView').classList.contains('hidden'))renderLB();}
  if(!lastLive&&window.__LB_DATA)got(window.__LB_DATA);                         // scores you uploaded by hand (leaderboard.js)
  var url=(window.SIKES_SETTINGS||{}).csvUrl;                                  // live scores from your published Google Sheet
  if(!url||Date.now()-lastLive<30000&&!force)return;
  try{
    fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text();})
      .then(function(t){lastLive=Date.now();got(SikesBoard.fromCSV(t));}).catch(function(){});
  }catch(e){}
}

/* open the chosen game with the chosen skill */
function play(){
  var s=curSet(),g=curGame(),all=st.topics.length===s.topicIds.length;
  store.set(KEY,JSON.stringify({game:st.game,set:st.set,topics:st.topics}));
  var params={set:s.id};if(!all)params.topics=st.topics.join(',');
  if(window.__EMBED_GAMES){launchFramed(g,params);return;}
  var url='games/'+g.file+'?set='+encodeURIComponent(s.id)+(all?'':'&topics='+encodeURIComponent(st.topics.join(',')));
  window.location.href=url;
}
function launchFramed(g,params){   // used only by the single-file preview
  var SH=window.__EMBED_SHARED||{};
  var html=window.__EMBED_GAMES[g.id]
    .replace(/<!--CSS-->/,function(){return '<style>'+SH.css+'</style>';})
    .replace(/<!--JS:([\w.]+)-->/g,function(m,n){return '<script>'+SH.js[n]+'<\/script>';})
    .replace('<head>','<head><script>window.__SIKES_PARAMS='+JSON.stringify(params)+';window.__SIKES_SETTINGS='+JSON.stringify(window.SIKES_SETTINGS||{})+';<\/script>');
  var f=$('frame');f.innerHTML='';var ifr=document.createElement('iframe');ifr.setAttribute('allow','fullscreen; clipboard-write');ifr.srcdoc=html;
  f.appendChild(ifr);f.classList.remove('hidden');setTimeout(function(){try{ifr.contentWindow.focus();}catch(e){}},300);
}
addEventListener('message',function(e){if(e.data&&e.data.sikes==='home'){$('frame').classList.add('hidden');$('frame').innerHTML='';}});
$('play').addEventListener('click',play);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('frame').classList.contains('hidden')&&!$('playView').classList.contains('hidden')){e.preventDefault();play();}});

renderGames();renderSkills();renderSummary();loadLB();
if(location.hash==='#leaderboard')showView('lb');
window.__HUB={st:st,play:play};
})();
</script>
</body>
</html>
