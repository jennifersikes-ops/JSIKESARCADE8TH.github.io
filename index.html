k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    g.t+=dt;stepFish(g,dt);\n    if(g.state!=='reel'){\n      g.hookX=Math.max(110,Math.min(1070,g.hookX+((g.keys.r?1:0)-(g.keys.l?1:0))*400*dt));\n    }\n    if(g.state==='drop'){\n      g.hookY+=360*dt;\n      var reach=G.streak>=3?36:20;\n      for(var i=0;i<g.fish.length;i++){\n        var f=g.fish[i];\n        if(Math.abs(g.hookX-f.x)<f.r*1.7+reach&&Math.abs(g.hookY-f.y)<f.r+reach){\n          f.hooked=true;g.got=f;g.state='reel';g.reelT=0;\n          G.you+=f.val;G.rival++;g.caught++;api.hud();\n          api.popup(f.x,f.y-50,'+'+f.val+(f.gold?' Golden!':''),f.gold?'#ffcf5a':'#4fd8ff');\n          api.burst(f.x,f.y,f.gold?44:18);f.gold?api.SND.swish():api.SND.nice();if(f.gold)api.shake(0.2);\n          break;\n        }\n      }\n      if(g.state==='drop'&&g.hookY>=BOTTOM){g.state='reel';g.reelT=0;api.popup(g.hookX,BOTTOM-60,'Nothing\u2026','#9db0d6');api.SND.soft();}\n    }else if(g.state==='reel'){\n      g.reelT+=dt;g.hookY-=(g.got?720:1000)*dt;\n      if(g.got){g.got.x+=(g.hookX-g.got.x)*Math.min(1,dt*12);g.got.y=g.hookY+g.got.r;}\n      if(g.hookY<=SURFACE){\n        g.hookY=SURFACE;g.state='idle';\n        if(g.got){var i2=g.fish.indexOf(g.got);if(i2>=0){g.fish[i2]=newFish(g.got.lane,g.got.dir>0?-70:1250);}g.got=null;}\n        api.resolve();\n      }\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    g.fish.forEach(function(f){drawFish(c,f);});\n    // boat\n    c.fillStyle='#8b5a2b';c.beginPath();c.moveTo(430,290);c.lineTo(780,290);c.lineTo(720,340);c.lineTo(490,340);c.closePath();c.fill();\n    c.fillStyle='#ffcf5a';c.fillRect(430,282,350,10);\n    c.fillStyle='#f2c7a0';c.beginPath();c.arc(560,240,22,0,Math.PI*2);c.fill();c.fillStyle='#e0563a';c.fillRect(538,262,46,30);c.fillStyle='#1a1330';c.beginPath();c.arc(560,230,24,Math.PI,2*Math.PI);c.fill();\n    c.strokeStyle='#d9b87a';c.lineWidth=7;c.beginPath();c.moveTo(580,268);c.lineTo(TIP.x,TIP.y);c.stroke();\n    // line and hook\n    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.moveTo(TIP.x,TIP.y);c.lineTo(g.hookX,g.hookY);c.stroke();\n    var wide=G.streak>=3&&g.state!=='reel';\n    c.strokeStyle='#eef3ff';c.lineWidth=5;c.beginPath();c.arc(g.hookX,g.hookY+12,10,0,Math.PI*1.2);c.stroke();\n    if(wide){c.strokeStyle='rgba(255,207,107,.7)';c.lineWidth=3;c.beginPath();c.arc(g.hookX,g.hookY+8,34,0,Math.PI*2);c.stroke();}\n    if(g.got)drawFish(c,g.got);\n    // depth value hints\n    c.fillStyle='rgba(238,243,255,.55)';c.font='800 22px Nunito,sans-serif';c.textAlign='left';\n    for(var i=0;i<5;i++)c.fillText((i+1)+' pt'+(i?'s':''),16,LANES[i]+7);\n    // helper bar\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,950,600,70);\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n    c.fillText(G.phase==='act'?'\u2190 \u2192 move the hook, Space to cast':G.phase==='flight'?'Steer with \u2190 \u2192':'Answer a question to earn a cast',590,992);\n  },\n  resultText:function(G){return 'You caught '+G.rival+' fish \u00b7 '+G.you+' points';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "bk": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Brick Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Brick Lab: brick breaker. The ball never stops while you answer.\n   Move the paddle with the left and right arrow keys (or A and D). Each correct answer gives a power-up:\n   a wide paddle, two extra balls, or a fireball that smashes through bricks. */\n(function(){\n'use strict';\nvar L=70,R=1110,TOP=160,PADY=960,BR=13,COLS=10,ROWS=6,BW=96,BH=34,GAP=6;\nvar ROWCOL=['#ff6b81','#ff9f43','#ffd36b','#6df0a0','#38d6ff','#b78bff'];\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\n\nfunction wave(g){\n  g.bricks=[];\n  var holes=Math.random()<0.5;\n  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){\n    if(holes&&r>=2&&r<=3&&(c===4||c===5))continue;\n    g.bricks.push({x:L+10+c*(BW+GAP),y:TOP+40+r*(BH+GAP),w:BW,h:BH,hp:r<2?2:1,val:r<2?3:1,col:ROWCOL[r]});\n  }\n}\nfunction launch(g,x,y,speed){\n  var a=rand(-0.5,0.5);return {x:x,y:y,vx:Math.sin(a)*speed,vy:-Math.cos(a)*speed,fire:false,trail:[]};\n}\nfunction padW(g){return g.pw.narrow>0?110:g.pw.wide>0?270:170;}\nfunction hitBrick(G,api,g,b,b2){\n  b.hp-=(b2&&b2.fire)?9:1;\n  if(b.hp<=0){\n    var i=g.bricks.indexOf(b);if(i>=0)g.bricks.splice(i,1);\n    G.you+=b.val;api.hud();api.burst(b.x+b.w/2,b.y+b.h/2,6);\n    if(!g.bricks.length){\n      g.waves++;G.rival=g.waves;G.you+=10;api.hud();api.popup(590,520,'Wave cleared! +10','#6df0a0');api.SND.swish();api.burst(590,520,50);\n      wave(g);g.balls.forEach(function(x){x.y=Math.max(x.y,TOP+420);});\n    }\n  }else{api.SND.soft();}\n}\nfunction stepBall(G,api,g,b,dt){\n  b.x+=b.vx*dt;b.y+=b.vy*dt;\n  if(b.x<L+BR){b.x=L+BR;b.vx=Math.abs(b.vx);}\n  if(b.x>R-BR){b.x=R-BR;b.vx=-Math.abs(b.vx);}\n  if(b.y<TOP+BR){b.y=TOP+BR;b.vy=Math.abs(b.vy);}\n  // paddle\n  var pw=padW(g),px=g.pad-pw/2;\n  if(b.vy>0&&b.y+BR>=PADY&&b.y-BR<=PADY+22&&b.x>=px-BR&&b.x<=px+pw+BR){\n    var rel=Math.max(-1,Math.min(1,(b.x-g.pad)/(pw/2))),sp=Math.min(780,Math.hypot(b.vx,b.vy)+8),ang=rel*1.05;\n    b.vx=Math.sin(ang)*sp;b.vy=-Math.cos(ang)*sp;b.y=PADY-BR;api.SND.soft();\n  }\n  // bricks\n  for(var i=0;i<g.bricks.length;i++){\n    var k=g.bricks[i],cx=Math.max(k.x,Math.min(b.x,k.x+k.w)),cy=Math.max(k.y,Math.min(b.y,k.y+k.h)),dx=b.x-cx,dy=b.y-cy;\n    if(dx*dx+dy*dy<BR*BR){\n      if(!b.fire){\n        var ox=(b.x-(k.x+k.w/2))/(k.w/2+BR),oy=(b.y-(k.y+k.h/2))/(k.h/2+BR);\n        if(Math.abs(ox)>Math.abs(oy)){b.vx=ox>0?Math.abs(b.vx):-Math.abs(b.vx);b.x+=ox>0?2:-2;}else{b.vy=oy>0?Math.abs(b.vy):-Math.abs(b.vy);b.y+=oy>0?2:-2;}\n        hitBrick(G,api,g,k,b);break;\n      }\n      hitBrick(G,api,g,k,b);i--;\n    }\n  }\n  // keep the ball from going flat\n  if(Math.abs(b.vy)<140){b.vy=(b.vy<0?-1:1)*140;}\n}\nAPI=Arcade.create({\n  prefix:'bk',gameId:'bk',title:'Brick Lab',\n  how:'Answer correctly to earn play time and power-ups. Move the paddle with \u2190 \u2192.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Waves'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ff6bd6','--cyan':'#6df0ff','--bg':'#0a0716','--panel2':'#100a22','--line':'#44307a'},\n  progression:[[57,61,64],[53,57,60],[55,59,62],[52,57,60]],pattern:[0,2,1,2,0,1,2,1],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#0a0716');g.addColorStop(1,'#1a0f3a');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(182,139,255,.08)';c.lineWidth=2;\n    for(var x=L;x<=R;x+=40){c.beginPath();c.moveTo(x,TOP);c.lineTo(x,1040);c.stroke();}\n    for(var y=TOP;y<1040;y+=40){c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();}\n    c.strokeStyle='#6df0ff';c.lineWidth=6;c.beginPath();c.moveTo(L,1040);c.lineTo(L,TOP);c.lineTo(R,TOP);c.lineTo(R,1040);c.stroke();\n  },\n  init:function(G){\n    var g=G.g={pad:590,balls:[],bricks:[],keys:{},pw:{wide:0,narrow:0,fire:0},waves:0,launchT:1.0,spd:520};\n    wave(g);\n  },\n  heat:function(G){var g=G.g;if(!g)return '';return g.pw.fire>0?'Fireball!':g.pw.wide>0?'Wide paddle':g.balls.length>1?g.balls.length+' balls':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.wide=14;g.pw.narrow=0;api.popup(g.pad,PADY-70,'Wide paddle!','#6df0ff');return {msg:'Your paddle is extra wide for a while.'};}\n    if(roll===1){\n      var src=g.balls.length?g.balls[0]:{x:g.pad,y:PADY-60,vx:0,vy:-1};\n      for(var i=0;i<2;i++){var b=launch(g,src.x,src.y,Math.max(480,Math.hypot(src.vx,src.vy)));g.balls.push(b);}\n      api.popup(g.pad,PADY-70,'Extra balls!','#ffd36b');return {msg:'Two extra balls are in play!'};\n    }\n    g.pw.fire=8;g.balls.forEach(function(b){b.fire=true;});api.popup(g.pad,PADY-70,'Fireball!','#ff9f43');\n    return {msg:'Fireballs smash through bricks for a few seconds.'};\n  },\n  onWrong:function(G,api){var g=G.g;g.pw.narrow=8;g.pw.wide=0;return {msg:'Your paddle shrinks for a few seconds. The ball keeps going!'};},\n  onKeyDown:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var pw=padW(g);\n    g.pad=Math.max(L+pw/2,Math.min(R-pw/2,g.pad+((g.keys.r?1:0)-(g.keys.l?1:0))*820*dt));\n    ['wide','narrow','fire'].forEach(function(k){if(g.pw[k]>0){g.pw[k]-=dt;if(g.pw[k]<=0&&k==='fire')g.balls.forEach(function(b){b.fire=false;});}});\n    if(!g.balls.length){\n      g.launchT-=dt;\n      if(g.launchT<=0){var b=launch(g,g.pad,PADY-40,g.spd);b.fire=g.pw.fire>0;g.balls.push(b);}\n    }\n    var n=Math.ceil(dt/0.004),h=dt/n;\n    for(var s=0;s<n;s++){for(var i=g.balls.length-1;i>=0;i--){stepBall(G,api,g,g.balls[i],h);}}\n    for(var j=g.balls.length-1;j>=0;j--){\n      if(g.balls[j].y>1040){g.balls.splice(j,1);\n        if(!g.balls.length){G.you=Math.max(0,G.you-2);api.hud();api.popup(g.pad,PADY-80,'Ball lost \u22122','#ff6b81');api.SND.bad();g.launchT=1.0;}}\n    }\n    g.balls.forEach(function(b){b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();});\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    g.bricks.forEach(function(b){\n      c.fillStyle=b.col;c.fillRect(b.x,b.y,b.w,b.h);\n      c.fillStyle='rgba(255,255,255,.28)';c.fillRect(b.x,b.y,b.w,6);\n      if(b.hp>1){c.strokeStyle='#ffffff';c.lineWidth=3;c.strokeRect(b.x+3,b.y+3,b.w-6,b.h-6);}\n    });\n    var pw=padW(g),px=g.pad-pw/2;\n    c.fillStyle=g.pw.narrow>0?'#ff6b81':g.pw.wide>0?'#6df0ff':'#ff6bd6';c.fillRect(px,PADY,pw,22);\n    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(px,PADY,pw,6);\n    g.balls.forEach(function(b){\n      b.trail.forEach(function(t,i){c.globalAlpha=i/16;c.fillStyle=b.fire?'#ff9f43':'#ffffff';c.beginPath();c.arc(t.x,t.y,BR*0.8,0,Math.PI*2);c.fill();});\n      c.globalAlpha=1;c.fillStyle=b.fire?'#ff9f43':'#ffffff';c.beginPath();c.arc(b.x,b.y,BR,0,Math.PI*2);c.fill();\n      if(b.fire){c.strokeStyle='#ff5d2e';c.lineWidth=4;c.beginPath();c.arc(b.x,b.y,BR+4,0,Math.PI*2);c.stroke();}\n    });\n    if(!g.balls.length){c.fillStyle='#eef3ff';c.font='800 70px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('Get ready\u2026',590,720);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,1002,600,48);\n    c.fillStyle='#eef3ff';c.font='800 24px Nunito,sans-serif';c.textAlign='center';\n    var tx=[];if(g.pw.wide>0)tx.push('Wide '+Math.ceil(g.pw.wide)+'s');if(g.pw.fire>0)tx.push('Fire '+Math.ceil(g.pw.fire)+'s');if(g.pw.narrow>0)tx.push('Small '+Math.ceil(g.pw.narrow)+'s');\n    c.fillText(tx.length?tx.join('  \u00b7  '):'\u2190 \u2192 move the paddle  \u00b7  answers give power-ups',590,1034);\n  },\n  resultText:function(G){return 'You cleared '+G.rival+' wave'+(G.rival===1?'':'s')+' \u00b7 '+G.you+' points';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "fc": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Fit Check \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Fit Check: style an outfit for a client. A correct answer earns one piece.\n   Press the left and right arrow keys to choose a piece, then Space to put it on.\n   Pieces that match the client's event score 3, other pieces score 1, and a full matching look earns a bonus. */\n(function(){\n'use strict';\nvar CX=450,SLOTS=['Top','Bottoms','Shoes','Accessory'];\nvar SKIN='#cdbbe0',API=null;\nvar THEMES=[\n {name:'Science Fair',tip:'Lab-ready and safe'},\n {name:'Beach Day',tip:'Sunny and breezy'},\n {name:'Snow Day',tip:'Warm and cozy'},\n {name:'Party Night',tip:'Sparkly and bold'}\n];\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfunction shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}\nfunction rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\nfunction star(c,x,y,r,col){c.fillStyle=col;c.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,k=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k);}c.closePath();c.fill();}\n\n/* ----- the clothes: ITEMS[slot][theme] ----- */\nvar ITEMS=[\n [ /* tops */\n  {name:'Lab coat',draw:function(c,x){\n    c.fillStyle='#f4f7ff';rr(c,x-92,348,184,300,18);c.fill();rr(c,x-134,352,50,240,22);c.fill();rr(c,x+84,352,50,240,22);c.fill();\n    c.fillStyle='#dfe7fb';c.beginPath();c.moveTo(x-40,348);c.lineTo(x,430);c.lineTo(x+40,348);c.lineTo(x+12,348);c.lineTo(x,380);c.lineTo(x-12,348);c.closePath();c.fill();\n    c.strokeStyle='#b9c6e8';c.lineWidth=4;c.beginPath();c.moveTo(x,430);c.lineTo(x,640);c.stroke();c.strokeRect(x+34,505,42,46);\n    c.fillStyle='#38d6ff';c.fillRect(x+48,494,6,18);c.fillStyle='#ff6b81';c.fillRect(x+60,494,6,18);}},\n  {name:'Beach tank',draw:function(c,x){\n    c.fillStyle='#ff7a8a';rr(c,x-68,366,136,210,16);c.fill();c.fillRect(x-68,350,32,30);c.fillRect(x+36,350,32,30);\n    c.fillStyle=SKIN;c.beginPath();c.arc(x,366,34,0,Math.PI);c.fill();\n    c.fillStyle='rgba(255,255,255,.75)';c.fillRect(x-68,440,136,12);c.fillRect(x-68,490,136,12);}},\n  {name:'Puffer jacket',draw:function(c,x){\n    c.fillStyle='#4aa8ff';rr(c,x-98,346,196,258,30);c.fill();rr(c,x-140,350,54,250,27);c.fill();rr(c,x+86,350,54,250,27);c.fill();\n    c.strokeStyle='#2f7fd1';c.lineWidth=5;for(var y=420;y<=570;y+=70){c.beginPath();c.moveTo(x-96,y);c.lineTo(x+96,y);c.stroke();}\n    c.beginPath();c.moveTo(x,372);c.lineTo(x,602);c.stroke();c.fillStyle='#2f7fd1';rr(c,x-38,334,76,30,13);c.fill();}},\n  {name:'Sparkle top',draw:function(c,x){\n    c.fillStyle='#a24bff';rr(c,x-82,350,164,232,20);c.fill();rr(c,x-102,352,40,76,18);c.fill();rr(c,x+62,352,40,76,18);c.fill();\n    [[-40,400],[30,430],[-10,480],[48,520],[-52,540],[8,372]].forEach(function(p){star(c,x+p[0],p[1],11,'#ffd36b');});}}\n ],\n [ /* bottoms */\n  {name:'Jeans',draw:function(c,x){\n    c.fillStyle='#3b5fb5';rr(c,x-70,580,64,296,10);c.fill();rr(c,x+6,580,64,296,10);c.fill();\n    c.fillStyle='#2c4a96';c.fillRect(x-70,580,140,26);c.strokeStyle='#8fb0ff';c.lineWidth=3;c.beginPath();c.moveTo(x-38,610);c.lineTo(x-38,860);c.moveTo(x+38,610);c.lineTo(x+38,860);c.stroke();}},\n  {name:'Board shorts',draw:function(c,x){\n    c.fillStyle='#ffd04a';rr(c,x-74,580,70,134,10);c.fill();rr(c,x+4,580,70,134,10);c.fill();c.fillStyle='#ff7a3d';c.fillRect(x-74,580,148,20);\n    [[-50,640],[-24,676],[34,640],[56,684],[-48,690]].forEach(function(p){c.beginPath();c.arc(x+p[0],p[1],7,0,Math.PI*2);c.fill();});}},\n  {name:'Snow pants',draw:function(c,x){\n    c.fillStyle='#6b7a99';rr(c,x-72,580,68,292,18);c.fill();rr(c,x+4,580,68,292,18);c.fill();\n    c.fillStyle='#4d5b7a';c.fillRect(x-72,580,144,22);c.fillRect(x-72,846,68,26);c.fillRect(x+4,846,68,26);}},\n  {name:'Party skirt',draw:function(c,x){\n    c.fillStyle='#ff4fb0';c.beginPath();c.moveTo(x-72,580);c.lineTo(x+72,580);c.lineTo(x+128,770);c.lineTo(x-128,770);c.closePath();c.fill();\n    star(c,x-70,700,10,'#ffd36b');star(c,x+20,690,9,'#ffd36b');star(c,x+80,735,9,'#ffd36b');star(c,x-20,742,8,'#fff');}}\n ],\n [ /* shoes (feet at x-34 and x+34) */\n  {name:'Sneakers',draw:function(c,x){[-34,34].forEach(function(d){\n    c.fillStyle='#f4f7ff';rr(c,x+d-38,878,76,36,15);c.fill();c.fillStyle='#38d6ff';c.fillRect(x+d-38,904,76,12);c.fillStyle='#ff6b81';c.fillRect(x+d-6,886,26,7);});}},\n  {name:'Sandals',draw:function(c,x){[-34,34].forEach(function(d){\n    c.fillStyle='#d9a15c';rr(c,x+d-36,902,72,14,7);c.fill();c.strokeStyle='#8b5a2b';c.lineWidth=6;c.beginPath();c.moveTo(x+d-24,902);c.lineTo(x+d,880);c.lineTo(x+d+24,902);c.stroke();});}},\n  {name:'Winter boots',draw:function(c,x){[-34,34].forEach(function(d){\n    c.fillStyle='#8b5a2b';rr(c,x+d-36,820,72,98,16);c.fill();c.fillStyle='#f4e8d0';rr(c,x+d-40,814,80,26,12);c.fill();c.fillStyle='#5a3a1a';c.fillRect(x+d-36,904,72,14);});}},\n  {name:'Glitter shoes',draw:function(c,x){[-34,34].forEach(function(d){\n    c.fillStyle='#dcdcff';rr(c,x+d-38,882,76,34,15);c.fill();star(c,x+d,898,10,'#ffd36b');star(c,x+d-22,904,5,'#fff');star(c,x+d+24,892,5,'#ff4fb0');});}}\n ],\n [ /* accessories (on the head at x, 300) */\n  {name:'Safety goggles',draw:function(c,x){\n    c.fillStyle='#2f3a5a';c.fillRect(x-50,288,100,14);\n    c.fillStyle='rgba(120,235,255,.55)';c.strokeStyle='#38d6ff';c.lineWidth=5;\n    rr(c,x-42,278,38,32,12);c.fill();c.stroke();rr(c,x+4,278,38,32,12);c.fill();c.stroke();}},\n  {name:'Sunglasses',draw:function(c,x){\n    c.fillStyle='#14142a';rr(c,x-42,282,38,28,12);c.fill();rr(c,x+4,282,38,28,12);c.fill();\n    c.strokeStyle='#14142a';c.lineWidth=5;c.beginPath();c.moveTo(x-6,290);c.lineTo(x+6,290);c.stroke();\n    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x-34,286,10,5);c.fillRect(x+12,286,10,5);}},\n  {name:'Cozy beanie',draw:function(c,x){\n    c.fillStyle='#ff4d4d';c.beginPath();c.arc(x,292,50,Math.PI,Math.PI*2);c.fill();\n    c.fillStyle='#c23030';c.fillRect(x-50,278,100,20);c.fillStyle='#fff';c.beginPath();c.arc(x,238,15,0,Math.PI*2);c.fill();}},\n  {name:'Gold crown',draw:function(c,x){\n    c.fillStyle='#ffcf5a';c.beginPath();c.moveTo(x-42,268);c.lineTo(x-46,222);c.lineTo(x-22,246);c.lineTo(x,214);c.lineTo(x+22,246);c.lineTo(x+46,222);c.lineTo(x+42,268);c.closePath();c.fill();\n    c.fillStyle='#ff4fb0';c.beginPath();c.arc(x,250,6,0,Math.PI*2);c.fill();}}\n ]\n];\nvar ICON_ANCHOR=[470,730,898,280],ICON_SCALE=[0.5,0.5,0.95,1.3];\nfunction icon(c,slot,item,cx,cy){\n  c.save();c.translate(cx,cy);c.scale(ICON_SCALE[slot],ICON_SCALE[slot]);c.translate(0,-ICON_ANCHOR[slot]);\n  if(slot===3){c.fillStyle=SKIN;c.beginPath();c.arc(0,300,42,0,Math.PI*2);c.fill();}\n  item.draw(c,0);c.restore();\n}\nfor(var s=0;s<4;s++)for(var t=0;t<4;t++){ITEMS[s][t].theme=t;}\n\n/* ----- game state helpers ----- */\nfunction pickTheme(g){var t;do{t=Math.floor(Math.random()*THEMES.length);}while(t===g.theme);g.theme=t;}\nfunction fresh(g){g.picks=[null,null,null,null];g.slot=0;g.opts=null;g.sel=1;g.state='idle';g.hits=0;}\nfunction makeOpts(g){\n  var s=g.slot,right=ITEMS[s][g.theme];\n  var others=shuffle(ITEMS[s].filter(function(it){return it.theme!==g.theme;})).slice(0,2);\n  g.opts=shuffle([right].concat(others));g.sel=1;\n}\nvar CARD={x:760,w:370,h:200,ys:[250,470,690]};\nfunction cardAt(px,py){for(var i=0;i<3;i++){if(px>=CARD.x&&px<=CARD.x+CARD.w&&py>=CARD.ys[i]&&py<=CARD.ys[i]+CARD.h)return i;}return -1;}\nvar bound=false;\nfunction bindClicks(){\n  if(bound)return;bound=true;\n  var cv=document.getElementById('court');\n  cv.addEventListener('pointerdown',function(e){\n    var G=API&&API.G;if(!G||!G.g||G.g.state!=='pick'||G.phase!=='act')return;\n    var r=cv.getBoundingClientRect(),k=1180/r.width,i=cardAt((e.clientX-r.left)*k,(e.clientY-r.top)*k);\n    if(i>=0)G.g.sel=i;\n  });\n}\nfunction drawMannequin(c,x){\n  c.fillStyle=SKIN;\n  rr(c,x-14,336,28,26,8);c.fill();\n  rr(c,x-82,350,164,242,28);c.fill();\n  rr(c,x-124,356,36,232,18);c.fill();rr(c,x+88,356,36,232,18);c.fill();\n  rr(c,x-62,580,56,320,22);c.fill();rr(c,x+6,580,56,320,22);c.fill();\n  c.beginPath();c.ellipse(x-34,900,36,16,0,0,Math.PI*2);c.ellipse(x+34,900,36,16,0,0,Math.PI*2);c.fill();\n  c.beginPath();c.arc(x,300,42,0,Math.PI*2);c.fill();\n  c.fillStyle='#6a5a85';c.beginPath();c.arc(x-15,298,4.5,0,Math.PI*2);c.arc(x+15,298,4.5,0,Math.PI*2);c.fill();\n  c.strokeStyle='#6a5a85';c.lineWidth=3.5;c.beginPath();c.arc(x,310,13,0.25,Math.PI-0.25);c.stroke();\n}\n\nAPI=Arcade.create({\n  prefix:'fc',gameId:'fc',title:'Fit Check',\n  how:'Answer to earn a piece. Press \\u2190 \\u2192 to choose, then Space to put it on. Match the client\\u2019s event!',\n  mode:'turn',hud:['Score','Looks'],roundSeconds:240,\n  theme:{'--ball':'#ff5fc8','--cyan':'#ffd36b','--bg':'#12061c','--panel2':'#190a26','--line':'#5a2a7a'},\n  progression:[[60,64,67],[57,60,64],[55,59,62],[53,57,60]],pattern:[0,2,1,2,0,1,2,1],beat:0.34,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#12061c');g.addColorStop(1,'#2a0f3d');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='rgba(255,95,200,.07)';c.beginPath();c.moveTo(CX-60,0);c.lineTo(CX+60,0);c.lineTo(CX+330,980);c.lineTo(CX-330,980);c.closePath();c.fill();\n    c.strokeStyle='rgba(255,211,107,.10)';c.lineWidth=2;for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,1080);c.stroke();}\n    c.fillStyle='#3a1458';c.beginPath();c.ellipse(CX,962,300,48,0,0,Math.PI*2);c.fill();\n    c.strokeStyle='#ff5fc8';c.lineWidth=5;c.beginPath();c.ellipse(CX,962,300,48,0,0,Math.PI*2);c.stroke();\n  },\n  init:function(G,api){G.g={theme:-1,looks:0,walkT:0,showT:0,perfect:false};pickTheme(G.g);fresh(G.g);bindClicks();},\n  heat:function(G){return '';},\n  onCorrect:function(G,api){\n    var g=G.g;makeOpts(g);g.state='pick';\n    return {msg:'Choose a piece for the <b>'+SLOTS[g.slot].toLowerCase()+'<\/b> with \\u2190 \\u2192, then press Space.',button:'Put it on'};\n  },\n  onAction:function(G,api){\n    var g=G.g;if(G.phase!=='act'||g.state!=='pick')return;\n    var it=g.opts[g.sel],match=it.theme===g.theme,pts=match?3:1;\n    g.picks[g.slot]=it;if(match)g.hits++;G.you+=pts;g.state='show';g.showT=0;api.begin();api.hud();\n    api.popup(CX,300,match?'+'+pts+' Perfect match!':'+'+pts+' Hmm\\u2026',match?'#4be39a':'#ffcf5a');\n    if(match){api.SND.nice();api.burst(CX*2,560,14);}else api.SND.soft();\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g||g.state!=='pick'||G.phase!=='act')return;\n    if(k==='ArrowLeft'||k==='ArrowUp'||k==='a'||k==='A'||k==='w'||k==='W')g.sel=(g.sel+2)%3;\n    else if(k==='ArrowRight'||k==='ArrowDown'||k==='d'||k==='D'||k==='s'||k==='S')g.sel=(g.sel+1)%3;\n    else if(k>='1'&&k<='3')g.sel=parseInt(k,10)-1;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    if(g.state==='show'){\n      g.showT+=dt;\n      if(g.showT>=0.8){\n        g.slot++;\n        if(g.slot>=4){\n          g.perfect=(g.hits===4);var bonus=g.perfect?4:0;\n          g.looks++;G.rival=g.looks;if(bonus)G.you+=bonus;api.hud();\n          api.popup(CX,250,g.perfect?'Fit check! +4 bonus':'Look complete!',g.perfect?'#ffd36b':'#ff5fc8');\n          api.burst(CX*2,520,g.perfect?60:26);g.perfect?api.SND.swish():api.SND.nice();if(g.perfect)api.shake(0.2);\n          g.state='walk';g.walkT=0;\n        }else{g.state='idle';api.resolve();}\n      }\n    }else if(g.state==='walk'){\n      g.walkT+=dt;\n      if(g.walkT>=2.0){pickTheme(g);fresh(g);api.resolve();}\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    var th=THEMES[g.theme],t=api.t;\n    // client banner\n    c.fillStyle='rgba(20,8,32,.88)';rr(c,40,166,440,88,18);c.fill();c.strokeStyle='#5a2a7a';c.lineWidth=3;c.stroke();\n    c.textAlign='left';c.fillStyle='#ffd36b';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.fillText('Client wants: '+th.name,62,208);\n    c.fillStyle='#c9b8e6';c.font='800 24px Nunito,sans-serif';c.fillText(th.tip,62,238);\n    // slot checklist\n    for(var i=0;i<4;i++){\n      var y=330+i*74,done=!!g.picks[i],cur=(i===g.slot&&g.state!=='walk');\n      c.fillStyle=done?'#1d4a3a':'rgba(20,8,32,.8)';rr(c,40,y,230,58,16);c.fill();\n      c.strokeStyle=cur?'#ff5fc8':(done?'#4be39a':'#4a2a66');c.lineWidth=cur?5:3;c.stroke();\n      c.textAlign='left';c.fillStyle=done?'#b9ffd9':'#eef3ff';c.font='800 28px Nunito,sans-serif';c.fillText((done?'\\u2713 ':'')+SLOTS[i],58,y+39);\n    }\n    // mannequin and outfit\n    c.save();\n    var sway=g.state==='walk'?Math.sin(g.walkT*6)*34:0;\n    c.translate(sway,44);\n    drawMannequin(c,CX);\n    var order=[1,2,0,3];\n    order.forEach(function(s){var it=g.picks[s];if(it)it.draw(c,CX);});\n    c.restore();\n    if(g.state==='walk'){c.textAlign='center';c.fillStyle='#ffd36b';c.font='800 64px \"Baloo 2\",Nunito,sans-serif';c.fillText(g.perfect?'FIT CHECK!':'Strut!',CX,1012);}\n    // option cards\n    if(g.state==='pick'&&G.phase==='act'&&g.opts){\n      for(var k=0;k<3;k++){\n        var it=g.opts[k],on=(k===g.sel),y2=CARD.ys[k];\n        c.fillStyle=on?'#3a1458':'rgba(20,8,32,.88)';rr(c,CARD.x,y2,CARD.w,CARD.h,22);c.fill();\n        c.strokeStyle=on?'#ff5fc8':'#4a2a66';c.lineWidth=on?7:3;c.stroke();\n        c.fillStyle='#4a2a66';rr(c,CARD.x+14,y2+14,46,46,12);c.fill();\n        c.fillStyle='#ffd36b';c.font='800 30px Nunito,sans-serif';c.textAlign='center';c.fillText(String(k+1),CARD.x+37,y2+47);\n        c.fillStyle='rgba(255,255,255,.06)';rr(c,CARD.x+60,y2+14,170,172,18);c.fill();\n        icon(c,g.slot,it,CARD.x+145,y2+100);\n        c.fillStyle='#eef3ff';c.font='800 32px Nunito,sans-serif';c.textAlign='left';\n        var words=it.name.split(' ');\n        c.fillText(words[0],CARD.x+242,y2+98);if(words[1])c.fillText(words.slice(1).join(' '),CARD.x+242,y2+136);\n      }\n      c.fillStyle='rgba(20,8,32,.88)';rr(c,CARD.x,910,CARD.w,64,16);c.fill();\n      c.fillStyle='#eef3ff';c.textAlign='center';c.font='800 24px Nunito,sans-serif';c.fillText('Arrows choose \\u00b7 Space wears it',CARD.x+CARD.w/2,950);\n    }else if(g.state==='idle'||g.state==='show'){\n      c.fillStyle='rgba(20,8,32,.88)';rr(c,CARD.x,430,CARD.w,150,22);c.fill();c.strokeStyle='#4a2a66';c.lineWidth=3;c.stroke();\n      c.fillStyle='#c9b8e6';c.textAlign='center';c.font='800 30px Nunito,sans-serif';\n      c.fillText('Answer a question',CARD.x+CARD.w/2,490);c.fillText('to earn a piece',CARD.x+CARD.w/2,530);\n    }\n  },\n  resultText:function(G){return 'You styled '+G.g.looks+' look'+(G.g.looks===1?'':'s')+' \\u00b7 Score '+G.you;}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "ns": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Nail Studio \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Nail Studio: paint a client's nails. A correct answer earns one nail.\n   Press the left and right arrow keys to choose a color, then Space to paint.\n   Match the client's look for 3 points a nail (1 point if it doesn't match). A perfect hand earns a bonus. */\n(function(){\n'use strict';\nvar API=null,SKIN='#dcab88';\nvar COLORS=[\n {n:'Ruby',c:'#e8284f'},{n:'Ocean',c:'#2f8c (0,-THUMB.len+30);}\n    var pulse=(active===i)&&(Math.floor((t||0)*3)%2===0);\n    drawNail(c,cols[i]===null||cols[i]===undefined?null:COLORS[cols[i]].c,gems&&gems[i],pulse);\n    c.restore();\n  }\n  c.restore();\n}\nvar PAL={x:760,y:520,w:370,h:58,gap:6};\nfunction palAt(px,py){for(var i=0;i<6;i++){var y=PAL.y+i*(PAL.h+PAL.gap);if(px>=PAL.x&&px<=PAL.x+PAL.w&&py>=y&&py<=y+PAL.h)return i;}return -1;}\nvar bound=false;\nfunction bindClicks(){\n  if(bound)return;bound=true;\n  var cv=document.getElementById('court');\n  cv.addEventListener('pointerdown',function(e){\n    var G=API&&API.G;if(!G||!G.g||G.g.state!=='pick'||G.phase!=='act')return;\n    var r=cv.getBoundingClientRect(),k=1180/r.width,i=palAt((e.clientX-r.left)*k,(e.clientY-r.top)*k);\n    if(i>=0)G.g.sel=i;\n  });\n}\nfunction newClient(g){\n  var name;do{name=CLIENTS[Math.floor(Math.random()*CLIENTS.length)];}while(name===g.client);g.client=name;\n  var pool=[0,1,2,3,4,5].sort(function(){return Math.random()-0.5;}).slice(0,3);\n  g.target=[];for(var i=0;i<5;i++)g.target.push(pool[Math.floor(Math.random()*3)]);\n  g.cols=[null,null,null,null,null];g.gems=[false,false,false,false,false];g.i=0;g.hits=0;g.state='idle';\n}\n\nAPI=Arcade.create({\n  prefix:'ns',gameId:'ns',title:'Nail Studio',\n  how:'Answer to earn a nail. Press \\u2190 \\u2192 to choose a color, then Space to paint. Match the client\\u2019s look!',\n  mode:'turn',hud:['Score','Clients'],roundSeconds:240,\n  theme:{'--ball':'#ff8fd1','--cyan':'#8fe9ff','--bg':'#150a1c','--panel2':'#1d0e27','--line':'#6a2f6e'},\n  progression:[[60,64,67],[56,60,63],[58,62,65],[53,57,60]],pattern:[0,1,2,1,2,1,0,2],beat:0.36,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#150a1c');g.addColorStop(1,'#34123f');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='rgba(255,143,209,.06)';for(var i=0;i<7;i++){c.beginPath();c.arc(90+i*170,300+(i%3)*190,70+(i%2)*30,0,Math.PI*2);c.fill();}\n    c.fillStyle='#4a1f55';c.fillRect(0,960,1180,120);c.fillStyle='#ff8fd1';c.fillRect(0,960,1180,6);\n  },\n  init:function(G,api){G.g={client:'',target:[],cols:[],gems:[],i:0,hits:0,sel:1,state:'idle',showT:0,doneT:0,clients:0,perfect:false};newClient(G.g);bindClicks();},\n  heat:function(G){return G.streak>=3?'Gem nail!':'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.state='pick';\n    return {msg:'Choose a color for the <b>'+FINGERS[g.i]+'<\/b> with \\u2190 \\u2192, then press Space.'+(G.streak>=3?' <b>Gem nail bonus!<\/b>':''),button:'Paint it'};\n  },\n  onAction:function(G,api){\n    var g=G.g;if(G.phase!=='act'||g.state!=='pick')return;\n    var i=g.i,match=(g.sel===g.target[i]),gem=G.streak>=3,pts=(match?3:1)+(gem?1:0);\n    g.cols[i]=g.sel;g.gems[i]=gem;if(match)g.hits++;G.you+=pts;g.state='show';g.showT=0;api.begin();api.hud();\n    var p=nailPos(i,HAND_X,HAND_Y,1);\n    api.popup(p.x,p.y-60,'+'+pts+(match?' Match!':'')+(gem?' Gem!':''),match?'#4be39a':'#ffcf5a');\n    if(match){api.SND.nice();api.burst(p.x*2,p.y*2,14);}else api.SND.soft();\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g||g.state!=='pick'||G.phase!=='act')return;\n    if(k==='ArrowLeft'||k==='ArrowUp'||k==='a'||k==='A'||k==='w'||k==='W')g.sel=(g.sel+5)%6;\n    else if(k==='ArrowRight'||k==='ArrowDown'||k==='d'||k==='D'||k==='s'||k==='S')g.sel=(g.sel+1)%6;\n    else if(k>='1'&&k<='6')g.sel=parseInt(k,10)-1;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    if(g.state==='show'){\n      g.showT+=dt;\n      if(g.showT>=0.7){\n        g.i++;\n        if(g.i>=5){\n          g.perfect=(g.hits===5);g.clients++;G.rival=g.clients;\n          if(g.perfect){G.you+=5;api.popup(HAND_X,500,'Perfect hand! +5','#ffd36b');api.SND.swish();api.shake(0.2);}\n          else{api.popup(HAND_X,500,'Client is happy!','#ff8fd1');api.SND.nice();}\n          api.burst(HAND_X*2,700,g.perfect?60:26);api.hud();g.state='done';g.doneT=0;\n        }else{g.state='idle';api.resolve();}\n      }\n    }else if(g.state==='done'){\n      g.doneT+=dt;\n      if(g.doneT>=2.0){newClient(g);api.resolve();}\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;var t=api.t;\n    // client banner\n    c.fillStyle='rgba(21,10,28,.88)';rr(c,40,172,420,64,18);c.fill();c.strokeStyle='#6a2f6e';c.lineWidth=3;c.stroke();\n    c.textAlign='left';c.fillStyle='#8fe9ff';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.fillText('Client: '+g.client,62,215);\n    c.fillStyle='#e0b8e6';c.font='800 24px Nunito,sans-serif';c.textAlign='right';c.fillText('Nail '+Math.min(5,g.i+1)+' of 5',440,213);\n    // the hand being painted\n    var act=(g.state==='pick'||g.state==='idle')?g.i:-1;\n    drawHand(c,HAND_X,HAND_Y,1,g.cols,g.gems,act,t);\n    if(g.state==='pick'&&g.i<5){\n      var p=nailPos(g.i,HAND_X,HAND_Y,1);\n      c.fillStyle=COLORS[g.sel].c;c.globalAlpha=0.5;c.save();c.translate(p.x,p.y);\n      if(g.i===4)c.rotate(THUMB.a);rr(c,-18,-26,36,54,15);c.fill();c.restore();c.globalAlpha=1;\n    }\n    if(g.state==='done'){c.textAlign='center';c.fillStyle='#ffd36b';c.font='800 64px \"Baloo 2\",Nunito,sans-serif';c.fillText(g.perfect?'PERFECT!':'Nice work!',HAND_X+40,1012);}\n    // client card with the target look\n    c.fillStyle='rgba(21,10,28,.88)';rr(c,PAL.x,180,PAL.w,322,22);c.fill();c.strokeStyle='#6a2f6e';c.lineWidth=3;c.stroke();\n    c.textAlign='left';c.fillStyle='#e0b8e6';c.font='800 28px Nunito,sans-serif';c.fillText('Client wants this look:',PAL.x+22,220);\n    drawHand(c,PAL.x+190,322,0.4,g.target,null,-1,t);\n    for(var q=0;q<5;q++){\n      var sx=PAL.x+52+q*66,sy=468,cur=(q===g.i&&g.state!=='done');\n      c.fillStyle=COLORS[g.target[q]].c;c.beginPath();c.arc(sx,sy,cur?19:16,0,Math.PI*2);c.fill();\n      c.strokeStyle=cur?'#ffffff':'rgba(255,255,255,.4)';c.lineWidth=cur?5:3;c.stroke();\n    }\n    // palette\n    for(var i=0;i<6;i++){\n      var y=PAL.y+i*(PAL.h+PAL.gap),on=(i===g.sel&&g.state==='pick'&&G.phase==='act');\n      c.fillStyle=on?'#4a1f55':'rgba(21,10,28,.88)';rr(c,PAL.x,y,PAL.w,PAL.h,16);c.fill();\n      c.strokeStyle=on?'#ff8fd1':'#4f2457';c.lineWidth=on?6:3;c.stroke();\n      c.fillStyle=COLORS[i].c;c.beginPath();c.arc(PAL.x+40,y+PAL.h/2,20,0,Math.PI*2);c.fill();\n      c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=3;c.stroke();\n      c.fillStyle='#eef3ff';c.font='800 30px Nunito,sans-serif';c.textAlign='left';c.fillText(COLORS[i].n,PAL.x+80,y+40);\n      c.fillStyle='#ffd36b';c.textAlign='right';c.fillText(String(i+1),PAL.x+PAL.w-22,y+40);\n    }\n    if(!(g.state==='pick'&&G.phase==='act')){\n      c.fillStyle='rgba(21,10,28,.92)';rr(c,PAL.x,PAL.y,PAL.w,6*(PAL.h+PAL.gap)-PAL.gap,16);c.fill();\n      c.fillStyle='#e0b8e6';c.textAlign='center';c.font='800 30px Nunito,sans-serif';\n      c.fillText('Answer a question',PAL.x+PAL.w/2,PAL.y+170);c.fillText('to paint a nail',PAL.x+PAL.w/2,PAL.y+210);\n    }\n  },\n  resultText:function(G){return 'You painted '+G.g.clients+' hand'+(G.g.clients===1?'':'s')+' \\u00b7 Score '+G.you;}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n"};</script>
<script>
(function(){
'use strict';
var SETS=SikesQ.SETS,GAMES=SikesCatalog,KEY='sikes_hub_last';
function $(id){return document.getElementById(id);}
function fit(){$('stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
addEventListener('resize',fit);fit();

var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
var st={game:GAMES[0].id,grade:8,set:null,topics:[]};
try{var last=JSON.parse(store.get(KEY)||'null');
  if(last){if(GAMES.some(function(g){return g.id===last.game;}))st.game=last.game;
    var i=SikesQ.findSet(last.set);if(i>=0){st.set=last.set;st.grade=SETS[i].grade;st.topics=(last.topics||[]).slice();}}}catch(e){}
if(!st.set){var first=SETS.filter(function(s){return s.grade===st.grade;})[0];st.set=first.id;}
function curSet(){return SETS[SikesQ.findSet(st.set)];}
function curGame(){return GAMES.filter(function(g){return g.id===st.game;})[0];}

normTopics();

function renderGames(){
  var box=$('games');box.innerHTML='';
  GAMES.forEach(function(g){
    var b=document.createElement('button');b.className='gcard'+(g.id===st.game?' on':'');b.tabIndex=-1;
    var tl=topLine(g.id);b.innerHTML=g.art+'<div class="tx"><div class="nm">'+g.name+'</div><div class="ds">'+g.desc+'</div><div class="top'+(tl.indexOf('Top:')===0?'':' none')+'">'+tl+'</div></div>';
    b.addEventListener('click',function(){b.blur();st.game=g.id;renderGames();renderSummary();});
    box.appendChild(b);
  });
}
function renderSkills(){
  var tabs=$('tabs');tabs.innerHTML='';
  [6,7,8].forEach(function(gr){
    var b=document.createElement('button');b.className='tab'+(gr===st.grade?' on':'');b.tabIndex=-1;b.textContent='Grade '+gr;
    b.addEventListener('click',function(){b.blur();st.grade=gr;
      if(curSet().grade!==gr){st.set=SETS.filter(function(s){return s.grade===gr;})[0].id;st.topics=[];normTopics();}
      renderSkills();renderSummary();});
    tabs.appendChild(b);
  });
  var grid=$('grid');grid.innerHTML='';
  SETS.filter(function(s){return s.grade===st.grade;}).forEach(function(s){
    var b=document.createElement('button');b.className='scard'+(s.id===st.set?' on':'');b.tabIndex=-1;
    b.innerHTML='<div class="sn">'+s.name+'</div><div class="st">TEKS '+s.teks+'</div>';
    b.addEventListener('click',function(){b.blur();st.set=s.id;st.topics=s.topicIds.slice();renderSkills();renderSummary();});
    grid.appendChild(b);
  });
}
function renderSummary(){
  var g=curGame(),s=curSet();
  $('pick-game').textContent=g.name;
  $('pick-skill').innerHTML=s.name+'<small>TEKS '+s.teks+'</small>';
  var chips=$('chips');chips.innerHTML='';
  s.topics.forEach(function(t){
    var b=document.createElement('button');b.className='chip'+(st.topics.indexOf(t.id)>=0?' on':'');b.tabIndex=-1;b.textContent=t.name;
    b.addEventListener('click',function(){b.blur();var k=st.topics.indexOf(t.id);
      if(k>=0){if(st.topics.length>1)st.topics.splice(k,1);}else st.topics.push(t.id);renderSummary();});
    chips.appendChild(b);
  });
  document.documentElement.style.setProperty('--accent',g.colors[1]);
}


/* ----- leaderboard (shown inside this page) ----- */
var LB={updated:null,games:{},skills:{}},lbGame=GAMES[0].id,lbSkill='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function topLine(gid){
  var list=(LB.games&&LB.games[gid])||[];
  return list.length?'Top: '+esc(list[0].name)+' · '+list[0].score+' pts':'No scores yet. Be first!';
}
function renderLB(){
  var tabs=$('lbtabs');tabs.innerHTML='';
  GAMES.forEach(function(g){
    var b=document.createElement('button');b.className='ltab'+(g.id===lbGame?' on':'');b.tabIndex=-1;b.textContent=g.name;
    b.addEventListener('click',function(){b.blur();lbGame=g.id;lbSkill='';renderLB();});tabs.appendChild(b);
  });
  var sk=(LB.skills&&LB.skills[lbGame])||{},sel=$('lbsel');sel.innerHTML='';

  var list=lbSkill?sk[lbSkill]:((LB.games&&LB.games[lbGame])||[]),box=$('lbboard');
  if(!list||!list.length){box.innerHTML='<div class="lempty">No scores posted for this game yet.<br>Play a round and show your teacher your code!</div>';}
  else{
    var out='<div class="lhdr"><div>Rank</div><div>Name</div><div>Score</div><div>Skill</div><div>Accuracy</div></div>';
    list.slice(0,10).forEach(function(x,i){
      out+='<div class="lrow r'+(i+1)+'"><div class="rk">'+(i+1)+'</div><div>'+esc(x.name)+'</div><div class="sc">'+x.score+'</div><div class="sk">'+esc(x.skill)+'</div><div>'+Math.round(100*x.correct/x.answered)+'% ('+x.correct+'/'+x.answered+')</div></div>';
    });
    box.innerHTML=out;
  }
  $('lbfoot').textContent=LB.updated?('Updated '+new Date(LB.updated).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})):'';
}
$('lbsel').addEventListener('change',function(){lbSkill=this.value;renderLB();this.blur();});
function showView(v){
  var lb=v==='lb';
  $('playView').classList.toggle('hidden',lb);$('lbView').classList.toggle('hidden',!lb);
  $('nav-play').classList.toggle('on',!lb);$('nav-lb').classList.toggle('on',lb);
  if(lb){renderLB();loadLB();}
  try{history.replaceState(null,'',lb?'#leaderboard':location.pathname+location.search);}catch(e){}
}
$('nav-play').addEventListener('click',function(){showView('play');});
$('nav-lb').addEventListener('click',function(){showView('lb');});
var lastLive=0;
function loadLB(force){
  function got(j){LB=j||LB;renderGames();if(!$('lbView').classList.contains('hidden'))renderLB();}
  if(!lastLive&&window.__LB_DATA)got(window.__LB_DATA);                         // scores you uploaded by hand (leaderboard.js)
  var url=(window.SIKES_SETTINGS||{}).csvUrl;                                  // live scores from your published Google Sheet
  if(!url||Date.now()-lastLive<30000&&!force)return;
  try{
    fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text();})
      .then(function(t){lastLive=Date.now();got(SikesBoard.fromCSV(t));}).catch(function(){});
  }catch(e){}
}

/* open the chosen game with the chosen skill */
function play(){
  var s=curSet(),g=curGame(),all=st.topics.length===s.topicIds.length;
  store.set(KEY,JSON.stringify({game:st.game,set:st.set,topics:st.topics}));
  var params={set:s.id};if(!all)params.topics=st.topics.join(',');
  if(window.__EMBED_GAMES){launchFramed(g,params);return;}
  var url='games/'+g.file+'?set='+encodeURIComponent(s.id)+(all?'':'&topics='+encodeURIComponent(st.topics.join(',')));
  window.location.href=url;
}
function launchFramed(g,params){   // used only by the single-file preview
  var SH=window.__EMBED_SHARED||{};
  var html=window.__EMBED_GAMES[g.id]
    .replace(/<!--CSS-->/,function(){return '<style>'+SH.css+'</style>';})
    .replace(/<!--JS:([\w.]+)-->/g,function(m,n){return '<script>'+SH.js[n]+'<\/script>';})
    .replace('<head>','<head><script>window.__SIKES_PARAMS='+JSON.stringify(params)+';window.__SIKES_SETTINGS='+JSON.stringify(window.SIKES_SETTINGS||{})+';<\/script>');
  var f=$('frame');f.innerHTML='';var ifr=document.createElement('iframe');ifr.setAttribute('allow','fullscreen; clipboard-write');ifr.srcdoc=html;
  f.appendChild(ifr);f.classList.remove('hidden');setTimeout(function(){try{ifr.contentWindow.focus();}catch(e){}},300);
}
addEventListener('message',function(e){if(e.data&&e.data.sikes==='home'){$('frame').classList.add('hidden');$('frame').innerHTML='';}});
$('play').addEventListener('click',play);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('frame').classList.contains('hidden')&&!$('playView').classList.contains('hidden')){e.preventDefault();play();}});

renderGames();renderSkills();renderSummary();loadLB();
if(location.hash==='#leaderboard')showView('lb');
window.__HUB={st:st,play:play};
})();
</script>
</body>
