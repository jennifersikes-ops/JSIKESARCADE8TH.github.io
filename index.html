 in court pixels\nvar R=13,HOLE_R=22,MAX_STROKES=6;\nvar LAYOUTS=[                                   // local coordinates inside the course (0..980, 0..780)\n {tee:[110,390],hole:[860,390],walls:[],sand:[],water:[]},\n {tee:[110,390],hole:[860,390],walls:[[440,240,60,300]],sand:[],water:[]},\n {tee:[110,150],hole:[860,150],walls:[[440,0,50,520]],sand:[],water:[]},\n {tee:[110,390],hole:[860,390],walls:[],sand:[[380,190,220,400]],water:[]},\n {tee:[110,390],hole:[860,390],walls:[],sand:[],water:[[430,130,120,520]]},\n {tee:[110,390],hole:[860,390],walls:[[390,140,50,220],[560,420,50,220]],sand:[],water:[]},\n {tee:[110,680],hole:[860,100],walls:[[300,340,500,50]],sand:[],water:[]},\n {tee:[110,140],hole:[860,640],walls:[[300,0,40,540],[620,240,40,540]],sand:[],water:[]}\n];\nvar API=null;\n\nfunction pointsFor(strokes){return strokes<=1?6:strokes===2?4:strokes===3?3:strokes===4?2:1;}\nfunction mirror(L,fx,fy){\n  function X(x,w){return fx?COURSE.w-x-(w||0):x;}\n  function Y(y,h){return fy?COURSE.h-y-(h||0):y;}\n  function rects(a){return a.map(function(r){return {x:X(r[0],r[2]),y:Y(r[1],r[3]),w:r[2],h:r[3]};});}\n  return {tee:{x:X(L.tee[0]),y:Y(L.tee[1])},hole:{x:X(L.hole[0]),y:Y(L.hole[1])},walls:rects(L.walls),sand:rects(L.sand),water:rects(L.water)};\n}\nfunction newHole(g){\n  var L=mirror(LAYOUTS[g.layoutIdx=(g.layoutIdx+1+Math.floor(Math.random()*(LAYOUTS.length-1)))%LAYOUTS.length],Math.random()<0.5,Math.random()<0.5);\n  g.hole=L;g.strokes=0;\n  g.ball={x:L.tee.x,y:L.tee.y,vx:0,vy:0};g.rest={x:L.tee.x,y:L.tee.y};\n  g.aim=Math.atan2(L.hole.y-L.tee.y,L.hole.x-L.tee.x);g.state='idle';g.charge=0;g.charging=false;g.sinkT=0;\n}\nfunction inRect(b,r){return b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h;}\nfunction collide(b,r){\n  var cxp=Math.max(r.x,Math.min(b.x,r.x+r.w)),cyp=Math.max(r.y,Math.min(b.y,r.y+r.h)),dx=b.x-cxp,dy=b.y-cyp,d2=dx*dx+dy*dy;\n  if(d2>=R*R)return;\n  var nx,ny;\n  if(d2>1e-6){var d=Math.sqrt(d2);nx=dx/d;ny=dy/d;b.x=cxp+nx*R;b.y=cyp+ny*R;}\n  else{ // centre inside the wall: push out through the nearest side\n    var l=b.x-r.x,rt=r.x+r.w-b.x,t=b.y-r.y,bt=r.y+r.h-b.y,m=Math.min(l,rt,t,bt);\n    if(m===l){nx=-1;ny=0;b.x=r.x-R;}else if(m===rt){nx=1;ny=0;b.x=r.x+r.w+R;}else if(m===t){nx=0;ny=-1;b.y=r.y-R;}else{nx=0;ny=1;b.y=r.y+r.h+R;}\n  }\n  var vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.8*vn*nx;b.vy-=1.8*vn*ny;API.SND.soft();}\n}\nfunction step(g,dt){\n  var b=g.ball,sp,k=1.3;\n  if(g.hole.sand.some(function(r){return inRect(b,r);}))k=4.8;\n  var f=Math.exp(-k*dt);b.vx*=f;b.vy*=f;\n  b.x+=b.vx*dt;b.y+=b.vy*dt;\n  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*0.8;}\n  if(b.x>COURSE.w-R){b.x=COURSE.w-R;b.vx=-Math.abs(b.vx)*0.8;}\n  if(b.y<R){b.y=R;b.vy=Math.abs(b.vy)*0.8;}\n  if(b.y>COURSE.h-R){b.y=COURSE.h-R;b.vy=-Math.abs(b.vy)*0.8;}\n  g.hole.walls.forEach(function(r){collide(b,r);});\n  sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);\n  if(g.hole.water.some(function(r){return inRect(b,r);})){            // splash: back to where you swung from\n    b.x=g.rest.x;b.y=g.rest.y;b.vx=b.vy=0;API.popup(COURSE.x+b.x,COURSE.y+b.y-40,'Splash!','#38d6ff');API.SND.bad();return 'stop';\n  }\n  var dh=Math.hypot(b.x-g.hole.hole.x,b.y-g.hole.hole.y);\n  if(dh<HOLE_R&&sp<760){g.state='sink';g.sinkT=0;g.sinkFrom={x:b.x,y:b.y};return 'sink';}\n  if(sp<14){b.vx=b.vy=0;return 'stop';}\n  return null;\n}\nfunction finishStroke(G,api){\n  var g=G.g;g.rest={x:g.ball.x,y:g.ball.y};g.state='idle';\n  if(g.strokes>=MAX_STROKES){api.popup(COURSE.x+g.ball.x,COURSE.y+g.ball.y-40,'Pick up! +1','#ffcf5a');G.you+=1;G.rival+=1;api.hud();newHole(g);}\n  api.resolve();\n}\n\nAPI=Arcade.create({\n  prefix:'mg',gameId:'mg',title:'Birdie Lab',\n  how:'Answer to earn a stroke. Press \u2190 \u2192 to aim, hold Space to charge, and let go to swing.',\n  mode:'turn',hud:['Score','Holes'],holdAction:true,roundSeconds:240,\n  theme:{'--ball':'#6df0a0','--cyan':'#b78bff','--bg':'#06110f','--panel2':'#0a1a17','--line':'#1f5a4a'},\n  progression:[[52,55,59],[48,52,55],[50,54,57],[47,52,56]],pattern:[0,2,1,2,0,2,1,2],beat:0.38,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#04100e');g.addColorStop(1,'#0a2420');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(109,240,160,.07)';c.lineWidth=2;\n    for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,1080);c.stroke();}\n    for(var y=0;y<1080;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(1180,y);c.stroke();}\n    c.fillStyle='rgba(109,240,160,.10)';c.fillRect(COURSE.x-26,COURSE.y-26,COURSE.w+52,COURSE.h+52);\n    c.fillStyle='#8c6b3c';c.fillRect(COURSE.x-16,COURSE.y-16,COURSE.w+32,COURSE.h+32);\n    c.fillStyle='#17803f';c.fillRect(COURSE.x,COURSE.y,COURSE.w,COURSE.h);\n    c.fillStyle='rgba(255,255,255,.05)';for(var s=0;s<COURSE.w;s+=120)c.fillRect(COURSE.x+s,COURSE.y,60,COURSE.h);\n  },\n  init:function(G,api){G.g={layoutIdx:0,holes:0,keys:{}};newHole(G.g);},\n  heat:function(G){return G.g&&G.g.strokes?'Stroke '+G.g.strokes+' of '+MAX_STROKES:'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.state='aim';\n    return {msg:'Aim with \u2190 \u2192, hold Space to charge, then let go.',button:'Hold to swing'};\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g)return;\n    if(k==='ArrowLeft'||k==='a'||k==='A')g.keys.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')g.keys.r=true;\n    if(k===' '&&G.phase==='act'&&g.state==='aim'){g.charging=true;g.charge=0;}\n  },\n  onKeyUp:function(k,G,api){\n    var g=G.g;if(!g)return;\n    if(k==='ArrowLeft'||k==='a'||k==='A')g.keys.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')g.keys.r=false;\n    if(k===' '&&g.charging){\n      g.charging=false;var p=Math.max(0.08,g.charge),v=150+p*1450;\n      g.ball.vx=Math.cos(g.aim)*v;g.ball.vy=Math.sin(g.aim)*v;g.strokes++;g.state='roll';api.begin();api.SND.nice();\n      g.charge=0;\n    }\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    var turn=(g.keys.r?1:0)-(g.keys.l?1:0);\n    if(turn&&(g.state==='aim'||g.state==='idle'))g.aim+=turn*1.9*dt;\n    if(g.charging)g.charge=Math.min(1,g.charge+dt*0.85);\n    if(g.state==='roll'){\n      var n=Math.ceil(dt/0.008),h=dt/n,res=null;\n      for(var i=0;i<n&&!res;i++)res=step(g,h);\n      if(res==='stop')finishStroke(G,api);\n    }\n    if(g.state==='sink'){\n      g.sinkT+=dt;var t=Math.min(1,g.sinkT/0.45);\n      g.ball.x=g.sinkFrom.x+(g.hole.hole.x-g.sinkFrom.x)*t;g.ball.y=g.sinkFrom.y+(g.hole.hole.y-g.sinkFrom.y)*t;\n      if(g.sinkT>=0.6){\n        var pts=pointsFor(g.strokes);G.you+=pts;G.rival+=1;g.holes++;\n        api.popup(COURSE.x+g.hole.hole.x,COURSE.y+g.hole.hole.y-60,(g.strokes===1?'Hole in one! ':'In! ')+'+'+pts,'#6df0a0');\n        api.burst(COURSE.x+g.hole.hole.x,COURSE.y+g.hole.hole.y,g.strokes<=2?50:24);api.SND.swish();if(g.strokes<=2)api.shake(0.2);\n        api.hud();newHole(g);api.resolve();\n      }\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    var ox=COURSE.x,oy=COURSE.y;\n    g.hole.sand.forEach(function(r){c.fillStyle='#d9c27a';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='rgba(120,90,30,.5)';c.lineWidth=3;c.strokeRect(ox+r.x,oy+r.y,r.w,r.h);});\n    g.hole.water.forEach(function(r){c.fillStyle='#1b6fd0';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='rgba(180,220,255,.6)';c.lineWidth=3;\n      for(var y=r.y+24;y<r.y+r.h;y+=40){c.beginPath();c.moveTo(ox+r.x+10,oy+y);c.quadraticCurveTo(ox+r.x+r.w/2,oy+y-10,ox+r.x+r.w-10,oy+y);c.stroke();}});\n    // tee and hole\n    c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(ox+g.hole.tee.x,oy+g.hole.tee.y,22,0,Math.PI*2);c.fill();\n    c.fillStyle='#050807';c.beginPath();c.arc(ox+g.hole.hole.x,oy+g.hole.hole.y,HOLE_R,0,Math.PI*2);c.fill();\n    c.strokeStyle='#e9f6ee';c.lineWidth=5;c.beginPath();c.moveTo(ox+g.hole.hole.x,oy+g.hole.hole.y);c.lineTo(ox+g.hole.hole.x,oy+g.hole.hole.y-110);c.stroke();\n    c.fillStyle='#ff5d73';c.beginPath();c.moveTo(ox+g.hole.hole.x,oy+g.hole.hole.y-110);c.lineTo(ox+g.hole.hole.x+52,oy+g.hole.hole.y-90);c.lineTo(ox+g.hole.hole.x,oy+g.hole.hole.y-70);c.fill();\n    g.hole.walls.forEach(function(r){c.fillStyle='#b98a52';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='#6df0a0';c.lineWidth=3;c.strokeRect(ox+r.x+1,oy+r.y+1,r.w-2,r.h-2);});\n    // aim guide\n    var b=g.ball;\n    if(g.state==='aim'||g.state==='idle'){\n      var len=130+g.charge*260;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=6;c.setLineDash([16,14]);\n      c.beginPath();c.moveTo(ox+b.x,oy+b.y);c.lineTo(ox+b.x+Math.cos(g.aim)*len,oy+b.y+Math.sin(g.aim)*len);c.stroke();c.setLineDash([]);\n      var ax=ox+b.x+Math.cos(g.aim)*len,ay=oy+b.y+Math.sin(g.aim)*len;\n      c.fillStyle='#fff';c.beginPath();c.moveTo(ax+Math.cos(g.aim)*24,ay+Math.sin(g.aim)*24);\n      c.lineTo(ax+Math.cos(g.aim+2.5)*20,ay+Math.sin(g.aim+2.5)*20);c.lineTo(ax+Math.cos(g.aim-2.5)*20,ay+Math.sin(g.aim-2.5)*20);c.fill();\n    }\n    // ball\n    var sc=g.state==='sink'?Math.max(0.1,1-g.sinkT/0.5):1;\n    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(ox+b.x+3,oy+b.y+6,R*sc,R*0.6*sc,0,0,Math.PI*2);c.fill();\n    c.fillStyle='#ffffff';c.beginPath();c.arc(ox+b.x,oy+b.y,R*sc,0,Math.PI*2);c.fill();\n    c.fillStyle='#d6dde8';c.beginPath();c.arc(ox+b.x-4,oy+b.y-4,R*0.35*sc,0,Math.PI*2);c.fill();\n    // power bar\n    if(G.phase==='act'){\n      var x0=290,y0=1000,w=600,h=34;\n      c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-12,w+24,h+24);\n      c.fillStyle='#16322b';c.fillRect(x0,y0,w,h);\n      var gr=c.createLinearGradient(x0,0,x0+w,0);gr.addColorStop(0,'#6df0a0');gr.addColorStop(0.6,'#ffcf5a');gr.addColorStop(1,'#ff6b81');\n      c.fillStyle=gr;c.fillRect(x0,y0,w*g.charge,h);\n      c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n      c.fillText(g.charging?'Let go to swing':'Hold Space to charge',x0+w/2,y0-22);\n    }\n  },\n  resultText:function(G,score){return 'You sank '+G.g.holes+' hole'+(G.g.holes===1?'':'s')+' \u00b7 Score '+score;}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "cs": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Turbo Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Turbo Lab: 2D car soccer against a CPU rival. The game never stops while you answer.\n   Correct answers fill your boost. Drive with the arrow keys (or A, D, W), hold Space to boost. */\n(function(){\n'use strict';\nvar AL=60,AR=1120,FLOOR=920,CEIL=270,GOAL_H=240,BALL_R=36,GRAV=1500,CAR_G=1900;\nvar API=null;\n\nfunction newCar(x,face,isAI){return {x:x,y:FLOOR,vx:0,vy:0,face:face,boost:isAI?60:50,air:false,jumps:0,ai:!!isAI,boosting:false,tAI:0,dir:0,jump:false};}\nfunction kickoff(g){\n  g.ball={x:(AL+AR)/2,y:FLOOR-320,vx:0,vy:0,spin:0};\n  g.p=newCar(AL+260,1,false);g.c=newCar(AR-260,-1,true);\n  g.p.boost=g.keepBoost;g.hold=1.2;\n}\nfunction carCircles(c){\n  var f=c.face;return [{x:c.x+f*28,y:c.y-24,r:26},{x:c.x-f*26,y:c.y-24,r:26},{x:c.x+f*4,y:c.y-52,r:20}];\n}\nfunction driveCar(c,g,dt){\n  var maxV=c.boosting?980:(c.ai?430:520),acc=c.air?900:2600;\n  if(c.dir){c.vx+=c.dir*acc*dt;c.face=c.dir;}\n  else if(!c.air)c.vx*=Math.exp(-4*dt);\n  if(c.boosting&&c.boost>0){c.vx+=c.face*3800*dt;c.boost=Math.max(0,c.boost-30*dt);}\n  else c.boosting=false;\n  c.vx=Math.max(-maxV,Math.min(maxV,c.vx));\n  if(c.jump){if(!c.air){c.vy=-780;c.air=true;c.jumps=1;}else if(c.jumps<2){c.vy=-580;c.jumps=2;}c.jump=false;}\n  c.vy+=CAR_G*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;\n  if(c.y>=FLOOR){c.y=FLOOR;c.vy=0;c.air=false;c.jumps=0;}\n  if(c.y<CEIL+50){c.y=CEIL+50;c.vy=Math.max(0,c.vy);}\n  c.x=Math.max(AL+50,Math.min(AR-50,c.x));\n}\nfunction thinkAI(c,g,dt){\n  c.tAI-=dt;if(c.tAI>0)return;c.tAI=0.14;\n  var b=g.ball,behind=c.x>b.x+30;               // CPU attacks the LEFT goal, so it wants to be to the right of the ball\n  var target=behind?b.x+16:b.x+190;\n  var dx=target-c.x;\n  c.dir=Math.abs(dx)<26?0:(dx>0?1:-1);\n  c.boosting=behind&&Math.abs(b.x-c.x)>260&&c.boost>25&&c.dir===-1;\n  if(!c.air&&Math.abs(b.x-c.x)<170&&b.y<FLOOR-120&&Math.random()<0.5)c.jump=true;\n  if(!behind&&c.x<AR-60&&Math.random()<0.03)c.jump=false;\n}\nfunction ballStep(g,dt){\n  var b=g.ball;\n  b.vy+=GRAV*dt;b.vx*=Math.exp(-0.12*dt);\n  b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=b.vx*dt/BALL_R;\n  var inGoalY=b.y>FLOOR-GOAL_H;\n  if(b.y>FLOOR-BALL_R){b.y=FLOOR-BALL_R;if(b.vy>0)b.vy=-b.vy*0.72;if(Math.abs(b.vy)<60)b.vy=0;b.vx*=Math.exp(-0.35*dt);}\n  if(b.y<CEIL+BALL_R){b.y=CEIL+BALL_R;b.vy=Math.abs(b.vy)*0.6;}\n  if(!inGoalY||b.y<FLOOR-GOAL_H+BALL_R*0.2){\n    if(b.x<AL+BALL_R&&b.y<FLOOR-GOAL_H){b.x=AL+BALL_R;b.vx=Math.abs(b.vx)*0.75;}\n    if(b.x>AR-BALL_R&&b.y<FLOOR-GOAL_H){b.x=AR-BALL_R;b.vx=-Math.abs(b.vx)*0.75;}\n  }\n  var sp=Math.hypot(b.vx,b.vy);if(sp>1500){b.vx*=1500/sp;b.vy*=1500/sp;}\n  [g.p,g.c].forEach(function(car){\n    carCircles(car).forEach(function(k){\n      var dx=b.x-k.x,dy=b.y-k.y,d=Math.hypot(dx,dy),m=k.r+BALL_R;\n      if(d>=m||d<1e-6)return;\n      var nx=dx/d,ny=dy/d;b.x=k.x+nx*(m+0.5);b.y=k.y+ny*(m+0.5);\n      var rvx=b.vx-car.vx,rvy=b.vy-car.vy,vn=rvx*nx+rvy*ny;\n      if(vn<0){var j=-(1+0.85)*vn,boostK=car.boosting?1.2:1;b.vx+=nx*j*boostK+car.vx*0.25;b.vy+=ny*j*boostK-60;API.SND.soft();}\n    });\n  });\n}\nfunction goalCheck(G,api){\n  var g=G.g,b=g.ball;\n  if(g.hold>0)return;\n  if(b.x>AR+BALL_R*0.6&&b.y>FLOOR-GOAL_H){G.you+=1;g.score='you';}\n  else if(b.x<AL-BALL_R*0.6&&b.y>FLOOR-GOAL_H){G.rival+=1;g.score='cpu';}\n  else return;\n  g.keepBoost=g.p.boost;\n  if(g.score==='you'){api.popup(590,520,'GOAL!','#4be39a');api.burst(AR-80,FLOOR-120,60);api.SND.swish();api.shake(0.25);}\n  else{api.popup(590,520,'They scored','#ff6b81');api.SND.bad();}\n  g.hold=1.6;g.after=true;api.hud();\n}\n\nAPI=Arcade.create({\n  prefix:'cs',gameId:'cs',title:'Turbo Lab',\n  how:'Answer correctly to earn play time and boost. Press \u2190 \u2192 to drive, \u2191 to jump, and hold Space to boost.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['You','CPU'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ff9f43','--cyan':'#4de2ff','--bg':'#070a14','--line':'#2a3f7a'},\n  progression:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],pattern:[0,1,2,1,2,1,0,2],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,FLOOR);g.addColorStop(0,'#070b1b');g.addColorStop(1,'#101a3a');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(77,226,255,.08)';c.lineWidth=2;\n    for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,CEIL);c.lineTo(x,FLOOR);c.stroke();}\n    for(var y=CEIL;y<FLOOR;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(1180,y);c.stroke();}\n    c.fillStyle='#10223f';c.fillRect(0,FLOOR,1180,160);\n    c.fillStyle='#2f5fb0';c.fillRect(0,FLOOR,1180,8);\n    c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=4;c.beginPath();c.moveTo(590,CEIL);c.lineTo(590,FLOOR);c.stroke();\n    c.beginPath();c.arc(590,FLOOR,140,Math.PI,2*Math.PI);c.stroke();\n    // arena frame and goals\n    c.strokeStyle='#4de2ff';c.lineWidth=8;c.strokeRect(AL,CEIL,AR-AL,FLOOR-CEIL);\n    c.fillStyle='rgba(255,159,67,.25)';c.fillRect(0,FLOOR-GOAL_H,AL,GOAL_H);c.fillRect(AR,FLOOR-GOAL_H,1180-AR,GOAL_H);\n    c.strokeStyle='#ff9f43';c.lineWidth=8;c.beginPath();c.moveTo(0,FLOOR-GOAL_H);c.lineTo(AL,FLOOR-GOAL_H);c.moveTo(AR,FLOOR-GOAL_H);c.lineTo(1180,FLOOR-GOAL_H);c.stroke();\n    c.strokeStyle='rgba(255,159,67,.45)';c.lineWidth=2;\n    for(var n=0;n<=AL;n+=15){c.beginPath();c.moveTo(n,FLOOR-GOAL_H);c.lineTo(n,FLOOR);c.moveTo(AR+n,FLOOR-GOAL_H);c.lineTo(AR+n,FLOOR);c.stroke();}\n  },\n  init:function(G){G.g={keepBoost:50,keys:{},score:null,after:false};kickoff(G.g);},\n  heat:function(G){return G.g&&G.g.hold>0&&G.g.after===false?'Kickoff!':'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.p.boost=Math.min(100,g.p.boost+40);g.keepBoost=Math.max(g.keepBoost,g.p.boost);\n    api.popup(g.p.x,g.p.y-130,'+40 boost','#ffcf5a');\n    return {msg:'Boost +40. Hold Space to use it.'};\n  },\n  onWrong:function(G,api){\n    var g=G.g;g.p.boost=Math.max(0,g.p.boost-20);g.keepBoost=g.p.boost;\n    return {msg:'You lost 20 boost. The game keeps going, so get back in it!'};\n  },\n  onKeyDown:function(k,G){\n    var g=G.g,ks=g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n    if(k===' ')ks.b=true;\n    if(k==='ArrowUp'||k==='w'||k==='W')g.p.jump=true;\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n    if(k===' ')ks.b=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var n=Math.ceil(dt/0.008),h=dt/n;\n    g.p.dir=(g.keys.r?1:0)-(g.keys.l?1:0);g.p.boosting=!!g.keys.b&&g.p.boost>0;\n    if(g.hold>0){\n      g.hold-=dt;\n      if(g.hold<=0){if(g.after){g.after=false;g.score=null;kickoff(g);g.hold=1.0;}}\n      return;\n    }\n    g.c.boost=Math.min(100,g.c.boost+9*dt);\n    thinkAI(g.c,g,dt);\n    for(var i=0;i<n;i++){driveCar(g.p,g,h);driveCar(g.c,g,h);ballStep(g,h);}\n    g.c.jump=false;\n    goalCheck(G,api);\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    function car(k,color,glow){\n      c.save();c.translate(k.x,k.y);c.scale(k.face,1);\n      if(k.boosting&&k.boost>0){c.fillStyle='rgba(255,170,60,.9)';c.beginPath();c.moveTo(-50,-24);c.lineTo(-95-Math.random()*25,-20);c.lineTo(-50,-12);c.fill();}\n      c.fillStyle=color;c.beginPath();c.moveTo(-52,-16);c.lineTo(-52,-34);c.lineTo(-26,-38);c.lineTo(-10,-60);c.lineTo(24,-60);c.lineTo(36,-38);c.lineTo(54,-34);c.lineTo(54,-16);c.closePath();c.fill();\n      c.fillStyle='#bfeaff';c.beginPath();c.moveTo(-6,-40);c.lineTo(2,-55);c.lineTo(20,-55);c.lineTo(28,-40);c.closePath();c.fill();\n      c.fillStyle=glow;c.fillRect(-52,-30,104,5);\n      c.fillStyle='#0a0f1e';c.beginPath();c.arc(-30,-14,15,0,Math.PI*2);c.arc(32,-14,15,0,Math.PI*2);c.fill();\n      c.fillStyle='#9db0d6';c.beginPath();c.arc(-30,-14,6,0,Math.PI*2);c.arc(32,-14,6,0,Math.PI*2);c.fill();\n      c.restore();\n    }\n    car(g.c,'#ff5d73','#ffd1d8');car(g.p,'#2cc4f0','#d6f6ff');\n    var b=g.ball;\n    c.save();c.translate(b.x,b.y);c.rotate(b.spin);\n    c.fillStyle='#f4f7ff';c.beginPath();c.arc(0,0,BALL_R,0,Math.PI*2);c.fill();\n    c.fillStyle='#22305e';c.beginPath();\n    for(var i=0;i<5;i++){var a=i*Math.PI*2/5-Math.PI/2;c.lineTo(Math.cos(a)*14,Math.sin(a)*14);}c.fill();\n    c.strokeStyle='#22305e';c.lineWidth=3;c.beginPath();c.arc(0,0,BALL_R-2,0,Math.PI*2);c.stroke();\n    c.restore();\n    // boost meter\n    var x0=290,y0=990,w=600,h=34;\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-40,w+24,h+52);\n    c.fillStyle='#172447';c.fillRect(x0,y0,w,h);\n    var gr=c.createLinearGradient(x0,0,x0+w,0);gr.addColorStop(0,'#ff9f43');gr.addColorStop(1,'#ffe08a');\n    c.fillStyle=gr;c.fillRect(x0,y0,w*g.p.boost/100,h);\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n    c.fillText('Boost '+Math.round(g.p.boost)+'  \u00b7  answer questions to refill',x0+w/2,y0-12);\n    if(g.hold>0&&!g.after){c.fillStyle='rgba(8,12,28,.7)';c.font='800 120px \"Baloo 2\",Nunito,sans-serif';c.fillStyle='#eef3ff';c.fillText(g.hold>0.6?'Ready\u2026':'Go!',590,560);}\n  },\n  finalScore:function(G){return G.you*8+G.correct;},\n  resultText:function(G){return G.you>G.rival?'You win, '+G.you+' to '+G.rival+'!':G.you<G.rival?'CPU wins, '+G.rival+' to '+G.you+'.':'Tie game, '+G.you+' each!';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "bb": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Burger Blaster \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Burger Blaster: hungry customers march toward your burger stand. A correct answer loads a burger.\n   Up and Down set the angle, Left and Right set the power, Space fires. The game never pauses while you answer. */\n(function(){\n'use strict';\nvar GROUND=900,GRAV=1500,BURGER_R=18,CUST_R=36,CANNON={x:170,y:GROUND-70},MAX_AMMO=5,STAND_X=250;\nvar API=null;\nvar MOODS=['#ffb86b','#ff8fb1','#8fd3ff','#b8f08f','#d3a8ff'];\n\nfunction v0(p){return 640+p*860;}\nfunction spawn(g){\n  var big=Math.random()<Math.min(0.35,0.08+g.spawned*0.012);\n  g.cust.push({x:1260,y:GROUND-CUST_R,r:big?46:CUST_R,hp:big?2:1,max:big?2:1,speed:(big?32:44)+Math.random()*26+Math.min(30,g.spawned*1.2),\n    col:MOODS[Math.floor(Math.random()*MOODS.length)],state:'walk',t:0,hit:0,ph:Math.random()*6});\n  g.spawned++;\n}\nfunction fire(G,api){\n  var g=G.g;if(g.ammo<=0||g.cool>0)return;\n  g.ammo--;g.cool=0.25;\n  var v=v0(g.power),a=g.angle;\n  g.burgers.push({x:CANNON.x+Math.cos(a)*90,y:CANNON.y-Math.sin(a)*90,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,bounces:0,hits:0,rot:0,alive:true});\n  api.SND.soft();api.shake(0.05);g.kick=0.2;\n}\nAPI=Arcade.create({\n  prefix:'bb',gameId:'bb',title:'Burger Blaster',\n  how:'Answer correctly to earn play time and burgers. Press \u2191 \u2193 to aim, \u2190 \u2192 for power, and Space to fire.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Fed','Grumpy'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ffb13b','--cyan':'#ff7ab0','--bg':'#140a10','--panel2':'#1a0d16','--line':'#6a2d4d'},\n  progression:[[53,57,60],[48,52,55],[50,53,57],[55,59,62]],pattern:[0,2,1,2,0,1,2,1],beat:0.32,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#1b0c1f');g.addColorStop(1,'#3a1630');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='rgba(255,177,59,.10)';\n    for(var i=0;i<9;i++){c.beginPath();c.arc(70+i*135,250+(i%3)*40,6,0,Math.PI*2);c.fill();}\n    c.strokeStyle='rgba(255,122,176,.10)';c.lineWidth=2;for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,GROUND);c.stroke();}\n    c.fillStyle='#4a2a22';c.fillRect(0,GROUND,1180,180);\n    c.fillStyle='#6d4033';c.fillRect(0,GROUND,1180,10);\n    c.fillStyle='rgba(0,0,0,.18)';for(var s=0;s<1180;s+=90)c.fillRect(s,GROUND+30,50,8);\n    // burger stand\n    c.fillStyle='#7a2f3f';c.fillRect(20,GROUND-250,STAND_X-20,250);\n    c.fillStyle='#ffcf5a';for(var k=0;k<6;k++){c.fillRect(20+k*(STAND_X-20)/6,GROUND-290,(STAND_X-20)/6,46);c.fillStyle=k%2?'#ffcf5a':'#ff5d73';}\n    c.fillStyle='#2a0f1a';c.fillRect(46,GROUND-190,STAND_X-72,120);\n    c.fillStyle='#ffcf5a';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('BURGERS',(20+STAND_X)/2,GROUND-212);\n  },\n  init:function(G){G.g={ammo:2,angle:0.9,power:0.6,cust:[],burgers:[],spawned:0,spawnT:1.5,cool:0,keys:{},kick:0,fed:0,happy:[]};},\n  heat:function(G){return G.g&&G.g.fedStreak>=3?'Combo x'+G.g.fedStreak:'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.ammo=Math.min(MAX_AMMO,g.ammo+1);api.popup(CANNON.x,CANNON.y-170,'+1 burger','#ffcf5a');\n    return {msg:'Burger loaded. Press Space to fire!'};\n  },\n  onWrong:function(G,api){\n    var g=G.g;if(g.ammo>0)g.ammo--;\n    return {msg:'You dropped a burger. The line keeps moving, so keep going!'};\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g,ks=g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=true;\n    if(k==='ArrowDown'||k==='s'||k==='S')ks.d=true;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n    if(k===' ')fire(G,api);\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=false;\n    if(k==='ArrowDown'||k==='s'||k==='S')ks.d=false;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var ks=g.keys;\n    g.angle=Math.max(0.2,Math.min(1.45,g.angle+((ks.u?1:0)-(ks.d?1:0))*0.9*dt));\n    g.power=Math.max(0.25,Math.min(1,g.power+((ks.r?1:0)-(ks.l?1:0))*0.6*dt));\n    if(g.cool>0)g.cool-=dt;if(g.kick>0)g.kick-=dt;\n    // customers arrive faster as the round goes on\n    g.spawnT-=dt;if(g.spawnT<=0){spawn(g);g.spawnT=Math.max(2.4,4.8-g.spawned*0.07)+Math.random()*1.2;}\n    g.cust.forEach(function(c){\n      c.t+=dt;\n      if(c.state==='walk'){c.x-=c.speed*dt;if(c.x<STAND_X+c.r){c.state='grumpy';c.t=0;G.rival++;g.fedStreak=0;api.popup(STAND_X+40,GROUND-130,'Grumpy!','#ff7ab0');api.SND.bad();api.hud();}}\n      else if(c.state==='fed'){c.y-=160*dt;c.x+=40*dt;}\n      else if(c.state==='grumpy'){c.x-=140*dt;}\n      if(c.hit>0)c.hit-=dt;\n    });\n    g.cust=g.cust.filter(function(c){return !((c.state==='fed'&&c.t>1.1)||(c.state==='grumpy'&&c.x<-80));});\n    // burger physics\n    g.burgers.forEach(function(b){\n      var n=Math.ceil(dt/0.01),h=dt/n;\n      for(var i=0;i<n&&b.alive;i++){\n        b.vy+=GRAV*h;b.x+=b.vx*h;b.y+=b.vy*h;b.rot+=b.vx*h*0.01;\n        if(b.y>GROUND-BURGER_R){b.y=GROUND-BURGER_R;b.vy=-b.vy*0.5;b.vx*=0.8;b.bounces++;if(b.bounces>3||Math.abs(b.vy)<40)b.alive=false;}\n        if(b.x>1300||b.x<-100)b.alive=false;\n        for(var j=0;j<g.cust.length;j++){\n          var c=g.cust[j];if(c.state!=='walk'||c.hit>0.12)continue;\n          if(Math.hypot(b.x-c.x,b.y-c.y)<c.r+BURGER_R){\n            c.hp--;c.hit=0.25;b.hits++;\n            var nx=(b.x-c.x),ny=(b.y-c.y),d=Math.hypot(nx,ny)||1;\n            b.vx=nx/d*Math.hypot(b.vx,b.vy)*0.5+80;b.vy=-380;\n            if(c.hp<=0){\n              c.state='fed';c.t=0;g.fed++;g.fedStreak=(g.fedStreak||0)+1;\n              var pts=(c.max===2?4:2)+(b.hits-1)*2;G.you+=pts;\n              api.popup(c.x,c.y-70,'+'+pts+(b.hits>1?' Combo!':''),b.hits>1?'#ff7ab0':'#ffcf5a');\n              api.burst(c.x,c.y-20,b.hits>1?44:20);b.hits>1?api.SND.swish():api.SND.nice();api.hud();\n            }else{api.popup(c.x,c.y-80,'Still hungry!','#ffb86b');api.SND.soft();}\n            break;\n          }\n        }\n      }\n    });\n    g.burgers=g.burgers.filter(function(b){return b.alive;});\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    // customers\n    g.cust.forEach(function(k){\n      var bob=k.state==='walk'?Math.abs(Math.sin(k.t*7+k.ph))*10:0,y=k.y-bob;\n      c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(k.x,GROUND+4,k.r*0.9,9,0,0,Math.PI*2);c.fill();\n      c.fillStyle=k.state==='grumpy'?'#c9667a':k.col;c.beginPath();c.arc(k.x,y,k.r,0,Math.PI*2);c.fill();\n      if(k.hit>0){c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.arc(k.x,y,k.r+4,0,Math.PI*2);c.stroke();}\n      c.fillStyle='#1b0c1f';c.beginPath();c.arc(k.x-k.r*0.32,y-k.r*0.22,k.r*0.11,0,Math.PI*2);c.arc(k.x+k.r*0.32,y-k.r*0.22,k.r*0.11,0,Math.PI*2);c.fill();\n      c.strokeStyle='#1b0c1f';c.lineWidth=4;c.beginPath();\n      if(k.state==='fed'){c.arc(k.x,y+k.r*0.05,k.r*0.4,0.15,Math.PI-0.15);}\n      else if(k.state==='grumpy'){c.arc(k.x,y+k.r*0.55,k.r*0.3,Math.PI+0.3,2*Math.PI-0.3);}\n      else{c.ellipse(k.x,y+k.r*0.3,k.r*0.22,k.r*0.3,0,0,Math.PI*2);}\n      c.stroke();\n      if(k.max===2&&k.state==='walk'){for(var i=0;i<k.hp;i++){c.fillStyle='#ffcf5a';c.beginPath();c.arc(k.x-14+i*28,y-k.r-18,9,0,Math.PI*2);c.fill();}}\n      if(k.state==='fed'){c.fillStyle='#ff7ab0';c.font='800 40px Nunito,sans-serif';c.textAlign='center';c.fillText('\u2665',k.x,y-k.r-12);}\n    });\n    // cannon\n    var a=g.angle;\n    c.fillStyle='#6a2d4d';c.beginPath();c.arc(CANNON.x,CANNON.y+10,50,0,Math.PI*2);c.fill();\n    c.save();c.translate(CANNON.x,CANNON.y);c.rotate(-a);\n    var recoil=g.kick>0?-g.kick*40:0;\n    c.fillStyle='#ffb13b';c.fillRect(recoil,-24,96,48);c.fillStyle='#ff7ab0';c.fillRect(80+recoil,-30,24,60);c.restore();\n    c.fillStyle='#2a0f1a';c.fillRect(CANNON.x-60,CANNON.y+40,120,GROUND-CANNON.y-40);\n    // aim preview\n    var v=v0(g.power),px=CANNON.x+Math.cos(a)*90,py=CANNON.y-Math.sin(a)*90,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;\n    c.fillStyle='rgba(255,255,255,.8)';\n    for(var s=0;s<26;s++){var t=s*0.055,x=px+vx*t,y=py+vy*t+0.5*GRAV*t*t;if(y>GROUND-10)break;c.beginPath();c.arc(x,y,s<3?3:5,0,Math.PI*2);c.fill();}\n    // burgers\n    g.burgers.forEach(function(b){drawBurger(c,b.x,b.y,b.rot,1);});\n    // ammo and aim readout\n    var x0=290,y0=990;\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-48,624,92);\n    for(var m=0;m<MAX_AMMO;m++){if(m<g.ammo)drawBurger(c,x0+30+m*58,y0-12,0,0.9);else{c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=3;c.beginPath();c.arc(x0+30+m*58,y0-12,16,0,Math.PI*2);c.stroke();}}\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='left';\n    c.fillText('Angle '+Math.round(a*180/Math.PI)+'\u00b0   Power '+Math.round(g.power*100),x0+312,y0-4);\n    c.textAlign='center';c.fillStyle='#9db0d6';c.font='800 22px Nunito,sans-serif';\n    c.fillText(g.ammo>0?'Space fires a burger':'Answer a question to load a burger',x0+300,y0+30);\n  },\n  finalScore:function(G){return Math.max(0,G.you-G.rival);},\n  resultText:function(G){return 'You fed '+G.g.fed+' customer'+(G.g.fed===1?'':'s')+' \u00b7 '+G.rival+' left grumpy';}\n});\nfunction drawBurger(c,x,y,rot,s){\n  c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);\n  c.fillStyle='#e0953b';c.beginPath();c.ellipse(0,-8,19,12,0,Math.PI,2*Math.PI);c.fill();\n  c.fillStyle='#6fcf4f';c.fillRect(-19,-8,38,5);\n  c.fillStyle='#6a2d1a';c.fillRect(-18,-3,36,7);\n  c.fillStyle='#e0953b';c.beginPath();c.ellipse(0,5,17,8,0,0,Math.PI);c.fill();\n  c.restore();\n}\n})();\n<\/script>\n<\/body>\n<\/html>\n", "sn": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Snake Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Snake Lab: a snake arena with two CPU rival snakes. The game never stops while you answer.\n   Steer with the arrow keys (or WASD). A correct answer gives you a shield and drops a golden apple. */\n(function(){\n'use strict';\nvar COLS=24,ROWS=19,CELL=40,OX=110,OY=200;\nvar API=null;\nvar DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};\n\nfunction rnd(n){return Math.floor(Math.random()*n);}\nfunction mk(x,y,d,len,ai,col){\n  var body=[];for(var i=0;i<len;i++)body.push({x:x-d.x*i,y:y-d.y*i});\n  return {body:body,dir:d,queue:[],t:ai?0:-0.9,ai:ai,col:col,grow:0,dead:0,spd:ai?0.20:0.14};\n}\nfunction occupied(g,x,y,skipSnake){\n  for(var i=0;i<g.snakes.length;i++){\n    var s=g.snakes[i];if(s.dead>0)continue;\n    var n=s.body.length-((s===skipSnake&&s.grow<=0)?1:0);          // the tail cell is about to move away\n    for(var j=0;j<n;j++)if(s.body[j].x===x&&s.body[j].y===y)return true;\n  }\n  return false;\n}\nfunction freeCell(g){\n  for(var k=0;k<200;k++){var x=rnd(COLS),y=rnd(ROWS);\n    if(occupied(g,x,y,null))continue;\n    if(g.food.some(function(f){return f.x===x&&f.y===y;}))continue;\n    return {x:x,y:y};}\n  return {x:0,y:0};\n}\nfunction addFood(g,gold){var c=freeCell(g);g.food.push({x:c.x,y:c.y,gold:!!gold,ttl:gold?12:0});}\nfunction respawnPlayer(g){\n  var s=g.snakes[0],c=Math.floor(COLS/2),r=Math.floor(ROWS/2);\n  s.body=[];for(var i=0;i<4;i++)s.body.push({x:c-i,y:r});s.dir=DIRS.right;s.queue=[];s.t=-0.9;s.grow=0;\n}\nfunction respawnAI(g,s){\n  for(var k=0;k<100;k++){var x=3+rnd(COLS-6),y=3+rnd(ROWS-6);\n    if(!occupied(g,x,y,null)&&!occupied(g,x-1,y,null)&&!occupied(g,x-2,y,null)){\n      s.body=[{x:x,y:y},{x:x-1,y:y},{x:x-2,y:y}];s.dir=DIRS.right;s.grow=1;s.dead=0;return;}}\n  s.dead=1;\n}\nfunction blocked(g,s,x,y){return x<0||y<0||x>=COLS||y>=ROWS||occupied(g,x,y,s);}\nfunction think(g,s){\n  var h=s.body[0],opts=[s.dir,{x:s.dir.y,y:-s.dir.x},{x:-s.dir.y,y:s.dir.x}];\n  var ok=opts.filter(function(d){return !blocked(g,s,h.x+d.x,h.y+d.y);});\n  if(!ok.length){s.dead=2.5;return;}\n  var best=ok[0],bd=1e9,target=g.food[0]||{x:COLS/2,y:ROWS/2};\n  g.food.forEach(function(f){if(Math.abs(f.x-h.x)+Math.abs(f.y-h.y)<Math.abs(target.x-h.x)+Math.abs(target.y-h.y))target=f;});\n  ok.forEach(function(d){var dist=Math.abs(target.x-(h.x+d.x))+Math.abs(target.y-(h.y+d.y));if(dist<bd){bd=dist;best=d;}});\n  s.dir=Math.random()<0.1?ok[rnd(ok.length)]:best;\n}\nfunction crash(G,api,g,s){\n  var h=s.body[0];\n  if(s.ai){api.burst(OX+h.x*CELL+20,OY+h.y*CELL+20,16);s.dead=3;return;}\n  G.you=Math.max(0,G.you-3);api.hud();api.popup(OX+h.x*CELL+20,OY+h.y*CELL-10,'Crash! \u22123','#ff5fa8');api.SND.bad();api.shake(0.2);\n  respawnPlayer(g);\n}\nfunction stepSnake(G,api,g,s){\n  if(s.ai)think(g,s);\n  else if(s.queue.length)s.dir=s.queue.shift();\n  if(s.dead>0)return;\n  var h=s.body[0],nx=h.x+s.dir.x,ny=h.y+s.dir.y,wall=nx<0||ny<0||nx>=COLS||ny>=ROWS;\n  if(wall||occupied(g,nx,ny,s)){\n    if(!s.ai&&g.shield>0){\n      g.shield--;G.rival=g.shield;api.hud();api.popup(OX+h.x*CELL+20,OY+h.y*CELL-10,'Shield!','#6ee7ff');api.SND.swish();\n      nx=(nx+COLS)%COLS;ny=(ny+ROWS)%ROWS;\n    }else{crash(G,api,g,s);return;}\n  }\n  s.body.unshift({x:nx,y:ny});\n  for(var i=g.food.length-1;i>=0;i--){var f=g.food[i];\n    if(f.x===nx&&f.y===ny){\n      g.food.splice(i,1);\n      if(f.gold){s.grow+=3;if(!s.ai){G.you+=3;api.popup(OX+nx*CELL+20,OY+ny*CELL,'+3 Golden!','#ffcf5a');api.burst(OX+nx*CELL+20,OY+ny*CELL+20,30);api.SND.swish();}}\n      else{s.grow+=1;if(!s.ai){G.you+=1;api.popup(OX+nx*CELL+20,OY+ny*CELL,'+1','#9bff5a');api.SND.soft();}}\n      if(!s.ai)api.hud();\n      if(!f.gold)addFood(g,false);\n    }\n  }\n  if(s.grow>0)s.grow--;else s.body.pop();\n}\nfunction segs(c,s,color,head){\n  for(var i=s.body.length-1;i>=0;i--){\n    var b=s.body[i],x=OX+b.x*CELL,y=OY+b.y*CELL,pad=i===0?2:5;\n    c.fillStyle=i===0?head:color;c.beginPath();c.roundRect?c.roundRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2,10):c.rect(x+pad,y+pad,CELL-pad*2,CELL-pad*2);c.fill();\n  }\n  var h=s.body[0],d=s.dir,cx=OX+h.x*CELL+20,cy=OY+h.y*CELL+20,px=-d.y,py=d.x;\n  c.fillStyle='#0a1a0e';\n  c.beginPath();c.arc(cx+d.x*6+px*8,cy+d.y*6+py*8,4,0,Math.PI*2);c.arc(cx+d.x*6-px*8,cy+d.y*6-py*8,4,0,Math.PI*2);c.fill();\n}\n\nAPI=Arcade.create({\n  prefix:'sn',gameId:'sn',title:'Snake Lab',\n  how:'Answer correctly to earn play time, shields and golden apples. Steer with the arrow keys.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Shields'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#9bff5a','--cyan':'#ff5fa8','--bg':'#07110a','--panel2':'#0a1a10','--line':'#2b6a3c'},\n  progression:[[52,55,59],[48,52,55],[50,54,57],[47,52,55]],pattern:[0,2,1,2,1,2,0,2],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#05100a');g.addColorStop(1,'#0a2014');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='#0e2a18';c.fillRect(OX-12,OY-12,COLS*CELL+24,ROWS*CELL+24);\n    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){c.fillStyle=(x+y)%2?'#10331e':'#0c2a18';c.fillRect(OX+x*CELL,OY+y*CELL,CELL,CELL);}\n    c.strokeStyle='#9bff5a';c.lineWidth=5;c.strokeRect(OX-3,OY-3,COLS*CELL+6,ROWS*CELL+6);\n  },\n  init:function(G){\n    var g=G.g={snakes:[],food:[],shield:0,keys:{}};\n    g.snakes.push(mk(Math.floor(COLS/2),Math.floor(ROWS/2),DIRS.right,4,false,'#9bff5a'));\n    g.snakes.push(mk(4,3,DIRS.right,4,true,'#ff6b81'));\n    g.snakes.push(mk(COLS-5,ROWS-4,DIRS.left,4,true,'#6ee7ff'));\n    g.snakes[0].t=-0.9;\n    for(var i=0;i<3;i++)addFood(g,false);\n  },\n  heat:function(G){return G.g&&G.g.snakes[0].t<0?'Get ready!':(G.g&&G.g.shield?'Shield ready':'');},\n  onCorrect:function(G,api){\n    var g=G.g;g.shield=Math.min(3,g.shield+1);G.rival=g.shield;addFood(g,true);\n    return {msg:'Shield +1, and a golden apple appeared!'};\n  },\n  onWrong:function(G,api){\n    var g=G.g;if(g.shield>0){g.shield--;G.rival=g.shield;}\n    return {msg:'You lost a shield. The snakes keep moving, so keep going!'};\n  },\n  onKeyDown:function(k,G){\n    var g=G.g,s=g.snakes[0],d=null;\n    if(k==='ArrowUp'||k==='w'||k==='W')d=DIRS.up;\n    else if(k==='ArrowDown'||k==='s'||k==='S')d=DIRS.down;\n    else if(k==='ArrowLeft'||k==='a'||k==='A')d=DIRS.left;\n    else if(k==='ArrowRight'||k==='d'||k==='D')d=DIRS.right;\n    if(!d)return;\n    var last=s.queue.length?s.queue[s.queue.length-1]:s.dir;\n    if(d.x===-last.x&&d.y===-last.y)return;       // no U-turns\n    if(d===last)return;\n    if(s.queue.length<2)s.queue.push(d);\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    for(var i=g.food.length-1;i>=0;i--){var f=g.food[i];if(f.gold){f.ttl-=dt;if(f.ttl<=0)g.food.splice(i,1);}}\n    g.snakes.forEach(function(s){\n      if(s.dead>0){s.dead-=dt;if(s.dead<=0&&s.ai)respawnAI(g,s);return;}\n      s.t+=dt;\n      var guard=0;\n      while(s.t>=s.spd&&guard++<4){s.t-=s.spd;stepSnake(G,api,g,s);if(s.dead>0)break;}\n    });\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    g.food.forEach(function(f){\n      var x=OX+f.x*CELL+20,y=OY+f.y*CELL+22;\n      if(f.gold){\n        c.fillStyle='#ffcf5a';c.beginPath();\n        for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?8:18;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.fill();\n        if(f.ttl<3&&Math.floor(api.t*4)%2)return;\n      }else{\n        c.fillStyle='#ff4d6d';c.beginPath();c.arc(x,y,13,0,Math.PI*2);c.fill();\n        c.fillStyle='#7bd96a';c.fillRect(x-1,y-20,3,8);\n      }\n    });\n    g.snakes.forEach(function(s,i){\n      if(s.dead>0)return;\n      segs(c,s,i===0?'#5fcf3a':s.col,i===0?'#b7ff8a':'#ffd0d6');\n    });\n    var h=g.snakes[0].body[0];\n    if(g.shield>0){c.strokeStyle='#6ee7ff';c.lineWidth=4;c.beginPath();c.arc(OX+h.x*CELL+20,OY+h.y*CELL+20,28,0,Math.PI*2);c.stroke();}\n    if(g.snakes[0].t<0){c.fillStyle='#eef3ff';c.font='800 90px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('Get ready\u2026',590,540);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,980,600,56);\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n    c.fillText('Arrow keys steer  \u00b7  Shields '+g.shield+' of 3  \u00b7  Length '+g.snakes[0].body.length,590,1016);\n  },\n  resultText:function(G){return 'You scored '+G.you+' points with a snake '+(G.g.snakes[0].body.length)+' long';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "fi": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Reel Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Reel Lab: night fishing. A correct answer earns one cast.\n   Move the hook with the left and right arrow keys, press Space to drop it, and steer it into a fish.\n   Deeper fish are worth more. Golden fish are worth triple. */\n(function(){\n'use strict';\nvar SURFACE=330,BOTTOM=880,TIP={x:640,y:210},LANES=[420,510,600,690,780];\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\n\nfunction newFish(lane,x){\n  var gold=Math.random()<0.1,size=14+lane*4+Math.random()*4,dir=Math.random()<0.5?-1:1;\n  return {x:x===undefined?rand(60,1120):x,y:LANES[lane]+rand(-14,14),lane:lane,dir:dir,\n    speed:rand(70,170)-lane*14,r:size,val:(lane+1)*(gold?3:1),gold:gold,\n    col:gold?'#ffcf5a':['#7ee8fa','#9cf29a','#ffa86b','#ff7ab0','#b78bff'][lane],hooked:false,ph:rand(0,6)};\n}\nfunction stepFish(g,dt){\n  g.fish.forEach(function(f){\n    if(f.hooked)return;\n    f.x+=f.dir*f.speed*dt;f.ph+=dt*6;\n    if(f.x>1180+80||f.x<-80){var n=newFish(f.lane,f.dir>0?-70:1250);n.dir=f.dir;Object.assign(f,n);}\n  });\n}\nfunction drawFish(c,f){\n  c.save();c.translate(f.x,f.y+Math.sin(f.ph)*4);c.scale(f.dir,1);\n  c.fillStyle=f.col;c.beginPath();c.ellipse(0,0,f.r*1.7,f.r,0,0,Math.PI*2);c.fill();\n  c.beginPath();c.moveTo(-f.r*1.5,0);c.lineTo(-f.r*2.5,-f.r*0.9);c.lineTo(-f.r*2.5,f.r*0.9);c.closePath();c.fill();\n  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(f.r*0.1,f.r*0.25,f.r*1.1,f.r*0.4,0,0,Math.PI*2);c.fill();\n  c.fillStyle='#07101e';c.beginPath();c.arc(f.r*1.0,-f.r*0.25,f.r*0.18,0,Math.PI*2);c.fill();\n  if(f.gold){c.strokeStyle='#fff7c2';c.lineWidth=3;c.beginPath();c.ellipse(0,0,f.r*1.7+5,f.r+5,0,0,Math.PI*2);c.stroke();}\n  c.restore();\n}\n\nAPI=Arcade.create({\n  prefix:'fi',gameId:'fi',title:'Reel Lab',\n  how:'Answer to earn a cast. Press \u2190 \u2192 to move the hook, Space to drop it, and catch a fish. Deep fish and golden fish score more!',\n  mode:'turn',hud:['Score','Fish'],roundSeconds:240,\n  theme:{'--ball':'#4fd8ff','--cyan':'#ffd36b','--bg':'#050b18','--panel2':'#091426','--line':'#1f4f7a'},\n  progression:[[50,53,57],[46,50,53],[48,52,55],[45,50,53]],pattern:[0,1,2,1,2,1,0,2],beat:0.40,\n  drawBg:function(c){\n    var s=c.createLinearGradient(0,0,0,SURFACE);s.addColorStop(0,'#050a1c');s.addColorStop(1,'#143258');c.fillStyle=s;c.fillRect(0,0,1180,SURFACE);\n    c.fillStyle='#f4f0d6';c.beginPath();c.arc(980,120,46,0,Math.PI*2);c.fill();c.fillStyle='#050a1c';c.beginPath();c.arc(1000,108,42,0,Math.PI*2);c.fill();\n    c.fillStyle='rgba(255,255,255,.55)';for(var i=0;i<26;i++){c.fillRect((i*197)%1180,(i*83)%230,3,3);}\n    var w=c.createLinearGradient(0,SURFACE,0,BOTTOM+20);w.addColorStop(0,'#1a5a8a');w.addColorStop(1,'#07203d');c.fillStyle=w;c.fillRect(0,SURFACE,1180,BOTTOM+20-SURFACE);\n    c.fillStyle='rgba(255,255,255,.25)';c.fillRect(0,SURFACE,1180,4);\n    c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=2;for(var y=LANES[0]-45;y<BOTTOM;y+=90){c.beginPath();c.moveTo(0,y);c.lineTo(1180,y);c.stroke();}\n    c.fillStyle='#3b2a20';c.fillRect(0,BOTTOM+20,1180,200);c.fillStyle='#55392a';for(var x=0;x<1180;x+=70)c.fillRect(x,BOTTOM+20,40,10);\n    c.fillStyle='#2f9b6b';for(var k=0;k<14;k++){c.beginPath();c.moveTo(60+k*85,BOTTOM+20);c.quadraticCurveTo(50+k*85,BOTTOM-40,70+k*85,BOTTOM-80);c.lineTo(76+k*85,BOTTOM-76);c.quadraticCurveTo(62+k*85,BOTTOM-30,70+k*85,BOTTOM+20);c.fill();}\n  },\n  init:function(G){\n    var g=G.g={hookX:590,hookY:SURFACE,state:'idle',fish:[],keys:{},caught:0,t:0,reelT:0,got:null};\n    for(var l=0;l<5;l++){g.fish.push(newFish(l));g.fish.push(newFish(l));}\n  },\n  heat:function(G){return G.streak>=3?'Wide hook':G.streak>0?'Streak '+G.streak:'';},\n  onCorrect:function(G){return {msg:G.streak>=3?'Your hook is extra wide. Line it up!':'Line up the hook, then cast!',button:'Cast'};},\n  onAction:function(G,api){\n    var g=G.g;if(G.phase!=='act')return;\n    g.state='drop';g.got=null;api.begin();api.SND.soft();\n  },\n  onKeyDown:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    g.t+=dt;stepFish(g,dt);\n    if(g.state!=='reel'){\n      g.hookX=Math.max(110,Math.min(1070,g.hookX+((g.keys.r?1:0)-(g.keys.l?1:0))*400*dt));\n    }\n    if(g.state==='drop'){\n      g.hookY+=360*dt;\n      var reach=G.streak>=3?36:20;\n      for(var i=0;i<g.fish.length;i++){\n        var f=g.fish[i];\n        if(Math.abs(g.hookX-f.x)<f.r*1.7+reach&&Math.abs(g.hookY-f.y)<f.r+reach){\n          f.hooked=true;g.got=f;g.state='reel';g.reelT=0;\n          G.you+=f.val;G.rival++;g.caught++;api.hud();\n          api.popup(f.x,f.y-50,'+'+f.val+(f.gold?' Golden!':''),f.gold?'#ffcf5a':'#4fd8ff');\n          api.burst(f.x,f.y,f.gold?44:18);f.gold?api.SND.swish():api.SND.nice();if(f.gold)api.shake(0.2);\n          break;\n        }\n      }\n      if(g.state==='drop'&&g.hookY>=BOTTOM){g.state='reel';g.reelT=0;api.popup(g.hookX,BOTTOM-60,'Nothing\u2026','#9db0d6');api.SND.soft();}\n    }else if(g.state==='reel'){\n      g.reelT+=dt;g.hookY-=(g.got?720:1000)*dt;\n      if(g.got){g.got.x+=(g.hookX-g.got.x)*Math.min(1,dt*12);g.got.y=g.hookY+g.got.r;}\n      if(g.hookY<=SURFACE){\n        g.hookY=SURFACE;g.state='idle';\n        if(g.got){var i2=g.fish.indexOf(g.got);if(i2>=0){g.fish[i2]=newFish(g.got.lane,g.got.dir>0?-70:1250);}g.got=null;}\n        api.resolve();\n      }\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    g.fish.forEach(function(f){drawFish(c,f);});\n    // boat\n    c.fillStyle='#8b5a2b';c.beginPath();c.moveTo(430,290);c.lineTo(780,290);c.lineTo(720,340);c.lineTo(490,340);c.closePath();c.fill();\n    c.fillStyle='#ffcf5a';c.fillRect(430,282,350,10);\n    c.fillStyle='#f2c7a0';c.beginPath();c.arc(560,240,22,0,Math.PI*2);c.fill();c.fillStyle='#e0563a';c.fillRect(538,262,46,30);c.fillStyle='#1a1330';c.beginPath();c.arc(560,230,24,Math.PI,2*Math.PI);c.fill();\n    c.strokeStyle='#d9b87a';c.lineWidth=7;c.beginPath();c.moveTo(580,268);c.lineTo(TIP.x,TIP.y);c.stroke();\n    // line and hook\n    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.moveTo(TIP.x,TIP.y);c.lineTo(g.hookX,g.hookY);c.stroke();\n    var wide=G.streak>=3&&g.state!=='reel';\n    c.strokeStyle='#eef3ff';c.lineWidth=5;c.beginPath();c.arc(g.hookX,g.hookY+12,10,0,Math.PI*1.2);c.stroke();\n    if(wide){c.strokeStyle='rgba(255,207,107,.7)';c.lineWidth=3;c.beginPath();c.arc(g.hookX,g.hookY+8,34,0,Math.PI*2);c.stroke();}\n    if(g.got)drawFish(c,g.got);\n    // depth value hints\n    c.fillStyle='rgba(238,243,255,.55)';c.font='800 22px Nunito,sans-serif';c.textAlign='left';\n    for(var i=0;i<5;i++)c.fillText((i+1)+' pt'+(i?'s':''),16,LANES[i]+7);\n    // helper bar\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,950,600,70);\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n    c.fillText(G.phase==='act'?'\u2190 \u2192 move the hook, Space to cast':G.phase==='flight'?'Steer with \u2190 \u2192':'Answer a question to earn a cast',590,992);\n  },\n  resultText:function(G){return 'You caught '+G.rival+' fish \u00b7 '+G.you+' points';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "bk": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Brick Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Brick Lab: brick breaker. The ball never stops while you answer.\n   Move the paddle with the left and right arrow keys (or A and D). Each correct answer gives a power-up:\n   a wide paddle, two extra balls, or a fireball that smashes through bricks. */\n(function(){\n'use strict';\nvar L=70,R=1110,TOP=160,PADY=960,BR=13,COLS=10,ROWS=6,BW=96,BH=34,GAP=6;\nvar ROWCOL=['#ff6b81','#ff9f43','#ffd36b','#6df0a0','#38d6ff','#b78bff'];\nvar API=null;\nfunction rand(a,b){return a+Math.random()*(b-a);}\n\nfunction wave(g){\n  g.bricks=[];\n  var holes=Math.random()<0.5;\n  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){\n    if(holes&&r>=2&&r<=3&&(c===4||c===5))continue;\n    g.bricks.push({x:L+10+c*(BW+GAP),y:TOP+40+r*(BH+GAP),w:BW,h:BH,hp:r<2?2:1,val:r<2?3:1,col:ROWCOL[r]});\n  }\n}\nfunction launch(g,x,y,speed){\n  var a=rand(-0.5,0.5);return {x:x,y:y,vx:Math.sin(a)*speed,vy:-Math.cos(a)*speed,fire:false,trail:[]};\n}\nfunction padW(g){return g.pw.narrow>0?110:g.pw.wide>0?270:170;}\nfunction hitBrick(G,api,g,b,b2){\n  b.hp-=(b2&&b2.fire)?9:1;\n  if(b.hp<=0){\n    var i=g.bricks.indexOf(b);if(i>=0)g.bricks.splice(i,1);\n    G.you+=b.val;api.hud();api.burst(b.x+b.w/2,b.y+b.h/2,6);\n    if(!g.bricks.length){\n      g.waves++;G.rival=g.waves;G.you+=10;api.hud();api.popup(590,520,'Wave cleared! +10','#6df0a0');api.SND.swish();api.burst(590,520,50);\n      wave(g);g.balls.forEach(function(x){x.y=Math.max(x.y,TOP+420);});\n    }\n  }else{api.SND.soft();}\n}\nfunction stepBall(G,api,g,b,dt){\n  b.x+=b.vx*dt;b.y+=b.vy*dt;\n  if(b.x<L+BR){b.x=L+BR;b.vx=Math.abs(b.vx);}\n  if(b.x>R-BR){b.x=R-BR;b.vx=-Math.abs(b.vx);}\n  if(b.y<TOP+BR){b.y=TOP+BR;b.vy=Math.abs(b.vy);}\n  // paddle\n  var pw=padW(g),px=g.pad-pw/2;\n  if(b.vy>0&&b.y+BR>=PADY&&b.y-BR<=PADY+22&&b.x>=px-BR&&b.x<=px+pw+BR){\n    var rel=Math.max(-1,Math.min(1,(b.x-g.pad)/(pw/2))),sp=Math.min(780,Math.hypot(b.vx,b.vy)+8),ang=rel*1.05;\n    b.vx=Math.sin(ang)*sp;b.vy=-Math.cos(ang)*sp;b.y=PADY-BR;api.SND.soft();\n  }\n  // bricks\n  for(var i=0;i<g.bricks.length;i++){\n    var k=g.bricks[i],cx=Math.max(k.x,Math.min(b.x,k.x+k.w)),cy=Math.max(k.y,Math.min(b.y,k.y+k.h)),dx=b.x-cx,dy=b.y-cy;\n    if(dx*dx+dy*dy<BR*BR){\n      if(!b.fire){\n        var ox=(b.x-(k.x+k.w/2))/(k.w/2+BR),oy=(b.y-(k.y+k.h/2))/(k.h/2+BR);\n        if(Math.abs(ox)>Math.abs(oy)){b.vx=ox>0?Math.abs(b.vx):-Math.abs(b.vx);b.x+=ox>0?2:-2;}else{b.vy=oy>0?Math.abs(b.vy):-Math.abs(b.vy);b.y+=oy>0?2:-2;}\n        hitBrick(G,api,g,k,b);break;\n      }\n      hitBrick(G,api,g,k,b);i--;\n    }\n  }\n  // keep the ball from going flat\n  if(Math.abs(b.vy)<140){b.vy=(b.vy<0?-1:1)*140;}\n}\nAPI=Arcade.create({\n  prefix:'bk',gameId:'bk',title:'Brick Lab',\n  how:'Answer correctly to earn play time and power-ups. Move the paddle with \u2190 \u2192.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Waves'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ff6bd6','--cyan':'#6df0ff','--bg':'#0a0716','--panel2':'#100a22','--line':'#44307a'},\n  progression:[[57,61,64],[53,57,60],[55,59,62],[52,57,60]],pattern:[0,2,1,2,0,1,2,1],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#0a0716');g.addColorStop(1,'#1a0f3a');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(182,139,255,.08)';c.lineWidth=2;\n    for(var x=L;x<=R;x+=40){c.beginPath();c.moveTo(x,TOP);c.lineTo(x,1040);c.stroke();}\n    for(var y=TOP;y<1040;y+=40){c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();}\n    c.strokeStyle='#6df0ff';c.lineWidth=6;c.beginPath();c.moveTo(L,1040);c.lineTo(L,TOP);c.lineTo(R,TOP);c.lineTo(R,1040);c.stroke();\n  },\n  init:function(G){\n    var g=G.g={pad:590,balls:[],bricks:[],keys:{},pw:{wide:0,narrow:0,fire:0},waves:0,launchT:1.0,spd:520};\n    wave(g);\n  },\n  heat:function(G){var g=G.g;if(!g)return '';return g.pw.fire>0?'Fireball!':g.pw.wide>0?'Wide paddle':g.balls.length>1?g.balls.length+' balls':'';},\n  onCorrect:function(G,api){\n    var g=G.g,roll=Math.floor(Math.random()*3);\n    if(roll===0){g.pw.wide=14;g.pw.narrow=0;api.popup(g.pad,PADY-70,'Wide paddle!','#6df0ff');return {msg:'Your paddle is extra wide for a while.'};}\n    if(roll===1){\n      var src=g.balls.length?g.balls[0]:{x:g.pad,y:PADY-60,vx:0,vy:-1};\n      for(var i=0;i<2;i++){var b=launch(g,src.x,src.y,Math.max(480,Math.hypot(src.vx,src.vy)));g.balls.push(b);}\n      api.popup(g.pad,PADY-70,'Extra balls!','#ffd36b');return {msg:'Two extra balls are in play!'};\n    }\n    g.pw.fire=8;g.balls.forEach(function(b){b.fire=true;});api.popup(g.pad,PADY-70,'Fireball!','#ff9f43');\n    return {msg:'Fireballs smash through bricks for a few seconds.'};\n  },\n  onWrong:function(G,api){var g=G.g;g.pw.narrow=8;g.pw.wide=0;return {msg:'Your paddle shrinks for a few seconds. The ball keeps going!'};},\n  onKeyDown:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var pw=padW(g);\n    g.pad=Math.max(L+pw/2,Math.min(R-pw/2,g.pad+((g.keys.r?1:0)-(g.keys.l?1:0))*820*dt));\n    ['wide','narrow','fire'].forEach(function(k){if(g.pw[k]>0){g.pw[k]-=dt;if(g.pw[k]<=0&&k==='fire')g.balls.forEach(function(b){b.fire=false;});}});\n    if(!g.balls.length){\n      g.launchT-=dt;\n      if(g.launchT<=0){var b=launch(g,g.pad,PADY-40,g.spd);b.fire=g.pw.fire>0;g.balls.push(b);}\n    }\n    var n=Math.ceil(dt/0.004),h=dt/n;\n    for(var s=0;s<n;s++){for(var i=g.balls.length-1;i>=0;i--){stepBall(G,api,g,g.balls[i],h);}}\n    for(var j=g.balls.length-1;j>=0;j--){\n      if(g.balls[j].y>1040){g.balls.splice(j,1);\n        if(!g.balls.length){G.you=Math.max(0,G.you-2);api.hud();api.popup(g.pad,PADY-80,'Ball lost \u22122','#ff6b81');api.SND.bad();g.launchT=1.0;}}\n    }\n    g.balls.forEach(function(b){b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();});\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    g.bricks.forEach(function(b){\n      c.fillStyle=b.col;c.fillRect(b.x,b.y,b.w,b.h);\n      c.fillStyle='rgba(255,255,255,.28)';c.fillRect(b.x,b.y,b.w,6);\n      if(b.hp>1){c.strokeStyle='#ffffff';c.lineWidth=3;c.strokeRect(b.x+3,b.y+3,b.w-6,b.h-6);}\n    });\n    var pw=padW(g),px=g.pad-pw/2;\n    c.fillStyle=g.pw.narrow>0?'#ff6b81':g.pw.wide>0?'#6df0ff':'#ff6bd6';c.fillRect(px,PADY,pw,22);\n    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(px,PADY,pw,6);\n    g.balls.forEach(function(b){\n      b.trail.forEach(function(t,i){c.globalAlpha=i/16;c.fillStyle=b.fire?'#ff9f43':'#ffffff';c.beginPath();c.arc(t.x,t.y,BR*0.8,0,Math.PI*2);c.fill();});\n      c.globalAlpha=1;c.fillStyle=b.fire?'#ff9f43':'#ffffff';c.beginPath();c.arc(b.x,b.y,BR,0,Math.PI*2);c.fill();\n      if(b.fire){c.strokeStyle='#ff5d2e';c.lineWidth=4;c.beginPath();c.arc(b.x,b.y,BR+4,0,Math.PI*2);c.stroke();}\n    });\n    if(!g.balls.length){c.fillStyle='#eef3ff';c.font='800 70px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('Get ready\u2026',590,720);}\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(290,1002,600,48);\n    c.fillStyle='#eef3ff';c.font='800 24px Nunito,sans-serif';c.textAlign='center';\n    var tx=[];if(g.pw.wide>0)tx.push('Wide '+Math.ceil(g.pw.wide)+'s');if(g.pw.fire>0)tx.push('Fire '+Math.ceil(g.pw.fire)+'s');if(g.pw.narrow>0)tx.push('Small '+Math.ceil(g.pw.narrow)+'s');\n    c.fillText(tx.length?tx.join('  \u00b7  '):'\u2190 \u2192 move the paddle  \u00b7  answers give power-ups',590,1034);\n  },\n  resultText:function(G){return 'You cleared '+G.rival+' wave'+(G.rival===1?'':'s')+' \u00b7 '+G.you+' points';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "fc": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Fit Check \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Fit Check: style an outfit for a client. A correct answer earns one piece.\n   Press the left and right arrow keys to choose a piece, then Space to put it on.\n   Pieces that match the client's event score 3, other pieces score 1, and a full matching look earns a bonus. */\n(function(){\n'use strict';\nvar CX=450,SLOTS=['Top','Bottoms','Shoes','Accessory'];\nvar SKIN='#cdbbe0',API=null;\nvar THEMES=[\n {name:'Science Fair',tip:'Lab-ready and safe'},\n {name:'Beach Day',tip:'Sunny and breezy'},\n {name:'Snow Day',tip:'Warm and cozy'},\n {name:'Party Night',tip:'Sparkly and bold'}\n];\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfunction shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}\nfunction rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\nfunction star(c,x,y,r,col){c.fillStyle=col;c.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,k=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*k,y+Math.sin(a)*k);}c.closePath();c.fill();}\n\n/* ----- the clothes: ITEMS[slot][theme] ----- */\nvar ITEMS=[\n [ /* tops */\n  {name:'Lab coat',draw:function(c,x){\n    c.fillStyle='#f4f7ff';rr(c,x-92,348,184,300,18);c.fill();rr(c,x-134,352,50,240,22);c.fill();rr(c,x+84,352,50,240,22);c.fill();\n    c.fillStyle='#dfe7fb';c.beginPath();c.moveTo(x-40,348);c.lineTo(x,430);c.lineTo(x+40,348);c.lineTo(x+12,348);c.lineTo(x,380);c.lineTo(x-12,348);c.closePath();c.fill();\n    c.strokeStyle='#b9c6e8';c.lineWidth=4;c.beginPath();c.moveTo(x,430);c.lineTo(x,640);c.stroke();c.strokeRect(x+34,505,42,46);\n    c.fillStyle='#38d6ff';c.fillRect(x+48,494,6,18);c.fillStyle='#ff6b81';c.fillRect(x+60,494,6,18);}},\n  {name:'Beach tank',draw:function(c,x){\n    c.fillStyle='#ff7a8a';rr(c,x-68,366,136,210,16);c.fill();c.fillRect(x-68,350,32,30);c.fillRect(x+36,350,32,30);\n    c.fillStyle=SKIN;c.beginPath();c.arc(x,366,34,0,Math.PI);c.fill();\n    c.fillStyle='rgba(255,255,255,.75)';c.fillRect(x-68,440,136,12);c.fillRect(x-68,490,136,12);}},\n  {name:'Puffer jacket',draw:function(c,x){\n    c.fillStyle='#4aa8ff';rr(c,x-98,346,196,258,30);c.fill();rr(c,x-140,350,54,250,27);c.fill();rr(c,x+86,350,54,250,27);c.fill();\n    c.strokeStyle='#2f7fd1';c.lineWidth=5;for(var y=420;y<=570;y+=70){c.beginPath();c.moveTo(x-96,y);c.lineTo(x+96,y);c.stroke();}\n    c.beginPath();c.moveTo(x,372);c.lineTo(x,602);c.stroke();c.fillStyle='#2f7fd1';rr(c,x-38,334,76,30,13);c.fill();}},\n  {name:'Sparkle top',draw:function(c,x){\n    c.fillStyle='#a24bff';rr(c,x-82,350,164,232,20);c.fill();rr(c,x-102,352,40,76,18);c.fill();rr(c,x+62,352,40,76,18);c.fill();\n    [[-40,400],[30,430],[-10,480],[48,520],[-52,540],[8,372]].forEach(function(p){star(c,x+p[0],p[1],11,'#ffd36b');});}}\n ],\n [ /* bottoms */\n  {name:'Jeans',draw:function(c,x){\n    c.fillStyle='#3b5fb5';rr(c,x-70,580,64,296,10);c.fill();rr(c,x+6,580,64,296,10);c.fill();\n    c.fillStyle='#2c4a96';c.fillRect(x-70,580,140,26);c.strokeStyle='#8fb0ff';c.lineWidth=3;c.beginPath();c.moveTo(x-38,610);c.lineTo(x-38,860);c.moveTo(x+38,610);c.lineTo(x+38,860);c.stroke();}},\n  {name:'Board shorts',draw:function(c,x){\n    c.fillStyle='#ffd04a';rr(c,x-74,580,70,134,10);c.fill();rr(c,x+ e='#38d6ff';c.lineWidth=5;\n    rr(c,x-42,278,38,32,12);c.fill();c.stroke();rr(c,x+4,278,38,32,12);c.fill();c.stroke();}},\n  {name:'Sunglasses',draw:function(c,x){\n    c.fillStyle='#14142a';rr(c,x-42,282,38,28,12);c.fill();rr(c,x+4,282,38,28,12);c.fill();\n    c.strokeStyle='#14142a';c.lineWidth=5;c.beginPath();c.moveTo(x-6,290);c.lineTo(x+6,290);c.stroke();\n    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x-34,286,10,5);c.fillRect(x+12,286,10,5);}},\n  {name:'Cozy beanie',draw:function(c,x){\n    c.fillStyle='#ff4d4d';c.beginPath();c.arc(x,292,50,Math.PI,Math.PI*2);c.fill();\n    c.fillStyle='#c23030';c.fillRect(x-50,278,100,20);c.fillStyle='#fff';c.beginPath();c.arc(x,238,15,0,Math.PI*2);c.fill();}},\n  {name:'Gold crown',draw:function(c,x){\n    c.fillStyle='#ffcf5a';c.beginPath();c.moveTo(x-42,268);c.lineTo(x-46,222);c.lineTo(x-22,246);c.lineTo(x,214);c.lineTo(x+22,246);c.lineTo(x+46,222);c.lineTo(x+42,268);c.closePath();c.fill();\n    c.fillStyle='#ff4fb0';c.beginPath();c.arc(x,250,6,0,Math.PI*2);c.fill();}}\n ]\n];\nvar ICON_ANCHOR=[470,730,898,280],ICON_SCALE=[0.5,0.5,0.95,1.3];\nfunction icon(c,slot,item,cx,cy){\n  c.save();c.translate(cx,cy);c.scale(ICON_SCALE[slot],ICON_SCALE[slot]);c.translate(0,-ICON_ANCHOR[slot]);\n  if(slot===3){c.fillStyle=SKIN;c.beginPath();c.arc(0,300,42,0,Math.PI*2);c.fill();}\n  item.draw(c,0);c.restore();\n}\nfor(var s=0;s<4;s++)for(var t=0;t<4;t++){ITEMS[s][t].theme=t;}\n\n/* ----- game state helpers ----- */\nfunction pickTheme(g){var t;do{t=Math.floor(Math.random()*THEMES.length);}while(t===g.theme);g.theme=t;}\nfunction fresh(g){g.picks=[null,null,null,null];g.slot=0;g.opts=null;g.sel=1;g.state='idle';g.hits=0;}\nfunction makeOpts(g){\n  var s=g.slot,right=ITEMS[s][g.theme];\n  var others=shuffle(ITEMS[s].filter(function(it){return it.theme!==g.theme;})).slice(0,2);\n  g.opts=shuffle([right].concat(others));g.sel=1;\n}\nvar CARD={x:760,w:370,h:200,ys:[250,470,690]};\nfunction cardAt(px,py){for(var i=0;i<3;i++){if(px>=CAR rrow keys to choose a color, then Space to paint.\n   Match the client's look for 3 points a nail (1 point if it doesn't match). A perfect hand earns a bonus. */\n(function(){\n'use strict';\nvar API=null,SKIN='#dcab88';\nvar COLORS=[\n {n:'Ruby',c:'#e8284f'},{n:'Ocean',c:'#2f8cff'},{n:'Mint',c:'#43e0a5'},\n {n:'Sunny',c:'#ffd23f'},{n:'Violet',c:'#9b5cff'},{n:'Rose',c:'#ff8fc7'}\n];\nvar FINGERS=['pinky','ring finger','middle finger','pointer','thumb'];\nvar CLIENTS=['Maya','Jordan','Sam','Riley','Aaliyah','Mateo','Zoe','Dev','Priya','Elijah'];\n// finger layout, in hand coordinates (origin = middle of the top of the palm)\nvar FL=[{x:-112,len:150},{x:-56,len:195},{x:0,len:215},{x:56,len:195}];\nvar HAND_X=410,HAND_Y=660,THUMB={x:150,y:110,a:0.7,len:150};\nfunction rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\nfunction rand(a,b){return a+Math.random()*(b-a);}\nfunction nailPos(i,ox,oy,s){\n  if(i<4)return {x:ox+FL[i].x*s,y:oy+(-FL[i].len+30)*s};\n  var a=THUMB.a,l=THUMB.len-30;\n  return {x:ox+(THUMB.x+Math.sin(a)*l)*s,y:oy+(THUMB.y-Math.cos(a)*l)*s};\n}\nfunction drawNail(c,col,gem,glow){\n  c.fillStyle=col||'#f7dcd0';rr(c,-18,-26,36,54,15);c.fill();\n  c.fillStyle='rgba(255,255,255,.4)';rr(c,-11,-20,8,32,4);c.fill();\n  if(gem){c.fillStyle='#e9fbff';c.beginPath();c.moveTo(0,-6);c.lineTo(8,3);c.lineTo(0,13);c.lineTo(-8,3);c.closePath();c.fill();c.strokeStyle='#7fd8ff';c.lineWidth=2;c.stroke();}\n  if(glow){c.strokeStyle='#ffffff';c.lineWidth=5;rr(c,-22,-30,44,62,19);c.stroke();}\n}\nfunction drawHand(c,ox,oy,s,cols,gems,active,t){\n  c.save();c.translate(ox,oy);c.scale(s,s);\n  c.fillStyle=SKIN;rr(c,-90,200,180,100,30);c.fill();rr(c,-150,0,300,262,64);c.fill();\n  FL.forEach(function(f){rr(c,f.x-24,-f.len,48,f.len+30,24);c.fill();});\n  c.save();c.translate(THUMB.x,THUMB.y);c.rotate(THUMB.a);rr(c,-26,-THUMB.len,52,THUMB.len+10,26);c.fill();c.restore();\n  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=3;c.beginPath();c.moveTo(-90,120);c.quadraticCurveTo(0,170,90,110);c.stroke();\n  for(var i=0;i<5;i++){\n    c.save();\n    if(i<4){c.translate(FL[i].x,-FL[i].len+30);}\n    else{c.translate(THUMB.x,THUMB.y);c.rotate(THUMB.a);c.translate(0,-THUMB.len+30);}\n    var pulse=(active===i)&&(Math.floor((t||0)*3)%2===0);\n    drawNail(c,cols[i]===null||cols[i]===undefined?null:COLORS[cols[i]].c,gems&&gems[i],pulse);\n    c.restore();\n  }\n  c.restore();\n}\nvar PAL={x:760,y:520,w:370,h:58,gap:6};\nfunction palAt(px,py){for(var i=0;i<6;i++){var y=PAL.y+i*(PAL.h+PAL.gap);if(px>=PAL.x&&px<=PAL.x+PAL.w&&py>=y&&py<=y+PAL.h)return i;}return -1;}\nvar bound=false;\nfunction bindClicks(){\n  if(bound)return;bound=true;\n  var cv=document.getElementById('court');\n  cv.addEventListener('pointerdown',function(e){\n    var G=API&&API.G;if(!G||!G.g||G.g.state!=='pick'||G.phase!=='act')return;\n    var r=cv.getBoundingClientRect(),k=1180/r.width,i=palAt((e.clientX-r.left)*k,(e.clientY-r.top)*k);\n    if(i>=0)G.g.sel=i;\n  });\n}\nfunction newClient(g){\n  var name;do{name=CLIENTS[Math.floor(Math.random()*CLIENTS.length)];}while(name===g.client);g.client=name;\n  var pool=[0,1,2,3,4,5].sort(function(){return Math.random()-0.5;}).slice(0,3);\n  g.target=[];for(var i=0;i<5;i++)g.target.push(pool[Math.floor(Math.random()*3)]);\n  g.cols=[null,null,null,null,null];g.gems=[false,false,false,false,false];g.i=0;g.hits=0;g.state='idle';\n}\n\nAPI=Arcade.create({\n  prefix:'ns',gameId:'ns',title:'Nail Studio',\n  how:'Answer to earn a nail. Press \\u2190 \\u2192 to choose a color, then Space to paint. Match the client\\u2019s look!',\n  mode:'turn',hud:['Score','Clients'],roundSeconds:240,\n  theme:{'--ball':'#ff8fd1','--cyan':'#8fe9ff','--bg':'#150a1c','--panel2':'#1d0e27','--line':'#6a2f6e'},\n  progression:[[60,64,67],[56,60,63],[58,62,65],[53,57,60]],pattern:[0,1,2,1,2,1,0,2],beat:0.36,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#150a1c');g.addColorStop(1,'#34123f');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='rgba(255,143,209,.06)';for(var i=0;i<7;i++){c.beginPath();c.arc(90+i*170,300+(i%3)*190,70+(i%2)*30,0,Math.PI*2);c.fill();}\n    c.fillStyle='#4a1f55';c.fillRect(0,960,1180,120);c.fillStyle='#ff8fd1';c.fillRect(0,960,1180,6);\n  },\n  init:function(G,api){G.g={client:'',target:[],cols:[],gems:[],i:0,hits:0,sel:1,state:'idle',showT:0,doneT:0,clients:0,perfect:false};newClient(G.g);bindClicks();},\n  heat:function(G){return G.streak>=3?'Gem nail!':'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.state='pick';\n    return {msg:'Choose a color for the <b>'+FINGERS[g.i]+'<\/b> with \\u2190 \\u2192, then press Space.'+(G.streak>=3?' <b>Gem nail bonus!<\/b>':''),button:'Paint it'};\n  },\n  onAction:function(G,api){\n    var g=G.g;if(G.phase!=='act'||g.state!=='pick')return;\n    var i=g.i,match=(g.sel===g.target[i]),gem=G.streak>=3,pts=(match?3:1)+(gem?1:0);\n    g.cols[i]=g.sel;g.gems[i]=gem;if(match)g.hits++;G.you+=pts;g.state='show';g.showT=0;api.begin();api.hud();\n    var p=nailPos(i,HAND_X,HAND_Y,1);\n    api.popup(p.x,p.y-60,'+'+pts+(match?' Match!':'')+(gem?' Gem!':''),match?'#4be39a':'#ffcf5a');\n    if(match){api.SND.nice();api.burst(p.x*2,p.y*2,14);}else api.SND.soft();\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g||g.state!=='pick'||G.phase!=='act')return;\n    if(k==='ArrowLeft'||k==='ArrowUp'||k==='a'||k==='A'||k==='w'||k==='W')g.sel=(g.sel+5)%6;\n    else if(k==='ArrowRight'||k==='ArrowDown'||k==='d'||k==='D'||k==='s'||k==='S')g.sel=(g.sel+1)%6;\n    else if(k>='1'&&k<='6')g.sel=parseInt(k,10)-1;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    if(g.state==='show'){\n      g.showT+=dt;\n      if(g.showT>=0.7){\n        g.i++;\n        if(g.i>=5){\n          g.perfect=(g.hits===5);g.clients++;G.rival=g.clients;\n          if(g.perfect){G.you+=5;api.popup(HAND_X,500,'Perfect hand! +5','#ffd36b');api.SND.swish();api.shake(0.2);}\n          else{api.popup(HAND_X,500,'Client is happy!','#ff8fd1');api.SND.nice();}\n          api.burst(HAND_X*2,700,g.perfect?60:26);api.hud();g.state='done';g.doneT=0;\n        }else{g.state='idle';api.resolve();}\n      }\n    }else if(g.state==='done'){\n      g.doneT+=dt;\n      if(g.doneT>=2.0){newClient(g);api.resolve();}\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;var t=api.t;\n    // client banner\n    c.fillStyle='rgba(21,10,28,.88)';rr(c,40,172,420,64,18);c.fill();c.strokeStyle='#6a2f6e';c.lineWidth=3;c.stroke();\n    c.textAlign='left';c.fillStyle='#8fe9ff';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.fillText('Client: '+g.client,62,215);\n    c.fillStyle='#e0b8e6';c.font='800 24px Nunito,sans-serif';c.textAlign='right';c.fillText('Nail '+Math.min(5,g.i+1)+' of 5',440,213);\n    // the hand being painted\n    var act=(g.state==='pick'||g.state==='idle')?g.i:-1;\n    drawHand(c,HAND_X,HAND_Y,1,g.cols,g.gems,act,t);\n    if(g.state==='pick'&&g.i<5){\n      var p=nailPos(g.i,HAND_X,HAND_Y,1);\n      c.fillStyle=COLORS[g.sel].c;c.globalAlpha=0.5;c.save();c.translate(p.x,p.y);\n      if(g.i===4)c.rotate(THUMB.a);rr(c,-18,-26,36,54,15);c.fill();c.restore();c.globalAlpha=1;\n    }\n    if(g.state==='done'){c.textAlign='center';c.fillStyle='#ffd36b';c.font='800 64px \"Baloo 2\",Nunito,sans-serif';c.fillText(g.perfect?'PERFECT!':'Nice work!',HAND_X+40,1012);}\n    // client card with the target look\n    c.fillStyle='rgba(21,10,28,.88)';rr(c,PAL.x,180,PAL.w,322,22);c.fill();c.strokeStyle='#6a2f6e';c.lineWidth=3;c.stroke();\n    c.textAlign='left';c.fillStyle='#e0b8e6';c.font='800 28px Nunito,sans-serif';c.fillText('Client wants this look:',PAL.x+22,220);\n    drawHand(c,PAL.x+190,322,0.4,g.target,null,-1,t);\n    for(var q=0;q<5;q++){\n      var sx=PAL.x+52+q*66,sy=468,cur=(q===g.i&&g.state!=='done');\n      c.fillStyle=COLORS[g.target[q]].c;c.beginPath();c.arc(sx,sy,cur?19:16,0,Math.PI*2);c.fill
