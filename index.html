<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sikes Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--panel:#0f1730;--line:#26396f;--ink:#eef3ff;--dim:#9db0d6;--accent:#ff8a3d;--cyan:#38d6ff;--mint:#4be39a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03050b;color:var(--ink);overflow:hidden;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;font-weight:600}
button{font-family:inherit;color:inherit}
.hidden{display:none !important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(1200px 700px at 20% -10%,#14204a 0%,var(--bg) 60%)}

/* header */
#top{position:absolute;left:64px;top:30px;right:64px;display:flex;align-items:baseline;justify-content:space-between}
#top h1{font-family:'Baloo 2','Nunito',sans-serif;font-size:92px;font-weight:800;line-height:1;color:var(--accent)}
#top .by{font-size:32px;color:var(--dim);display:flex;align-items:center;gap:22px}
.nav{background:#101a3a;border:3px solid #26396f;border-radius:22px;padding:4px 28px 6px;font-size:34px;font-weight:800;cursor:pointer;color:var(--dim)}
.nav.on{border-color:var(--cyan);color:var(--ink);background:#14305a}
.step{position:absolute;left:64px;font-size:34px;font-weight:800;color:var(--cyan)}
.step span{display:inline-block;width:46px;height:46px;border-radius:50%;background:#1b2a5a;text-align:center;line-height:46px;margin-right:14px;font-size:28px}

/* games */
#games{position:absolute;left:64px;top:184px;width:1792px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.gcard{background:#101a3a;border:4px solid #26396f;border-radius:22px;padding:10px 14px;cursor:pointer;text-align:left;height:150px;
  overflow:hidden;transition:border-color .15s,background .15s;display:flex;flex-direction:row;align-items:center;gap:14px}
.gcard svg{width:180px;flex:0 0 180px;height:auto;display:block;border-radius:12px}
.gcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gcard .nm{font-family:'Baloo 2','Nunito',sans-serif;font-size:32px;font-weight:800;line-height:1.05}
.gcard .ds{font-size:20px;color:var(--dim);line-height:1.2}
.gcard .top{font-size:19px;font-weight:800;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .top.none{color:#6f82b3}
.gcard:hover{border-color:#4a63ad}
.gcard.on{border-color:var(--accent);background:#2a2036}
.gcard.on .nm{color:var(--accent)}

/* skills */
#skills{position:absolute;left:64px;top:588px;width:1180px}
#tabs{display:flex;gap:14px;margin:0 0 16px 0}
.tab{background:#101a3a;border:3px solid #26396f;border-radius:22px;padding:6px 30px;font-size:32px;font-weight:800;cursor:pointer;color:var(--dim)}
.tab.on{border-color:var(--cyan);color:var(--ink);background:#14305a}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.scard{background:#101a3a;border:3px solid #26396f;border-radius:20px;padding:12px 20px;cursor:pointer;text-align:left;
  height:124px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s,background .15s}
.scard .sn{font-size:32px;font-weight:800;line-height:1.1}
.scard .st{font-size:25px;color:var(--cyan);font-weight:800}
.scard:hover{border-color:#4a63ad}
.scard.on{border-color:var(--mint);background:#123a35}

/* summary and play */
#summary{position:absolute;left:1290px;top:588px;width:566px;height:440px;background:linear-gradient(#111b3b,#0b1228);
  border:3px solid var(--line);border-radius:28px;padding:24px 28px;display:flex;flex-direction:column;gap:10px}
#summary .lbl{font-size:26px;color:var(--dim);font-weight:800}
#pick-game{font-family:'Baloo 2','Nunito',sans-serif;font-size:48px;font-weight:800;line-height:1;color:var(--accent)}
#pick-skill{font-size:34px;font-weight:800;line-height:1.15}
#pick-skill small{display:block;font-size:26px;color:var(--cyan);margin-top:2px}
#chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:#16224a;border:3px solid #2b3d7a;border-radius:26px;padding:4px 18px;font-size:24px;font-weight:800;cursor:pointer;color:var(--dim)}
.chip.on{border-color:var(--mint);color:var(--ink);background:#143a35}
#play{margin-top:auto;border:0;border-radius:26px;background:var(--accent);color:#1d1004;font-family:'Baloo 2','Nunito',sans-serif;
  font-size:76px;font-weight:800;line-height:1;padding:8px 0 14px;cursor:pointer}
#play:hover{background:#ff9d5e}
#hint{font-size:22px;color:var(--dim);text-align:center}

/* leaderboard view */
#lbtabs{position:absolute;left:64px;top:150px;display:flex;gap:16px;align-items:center}
.ltab{background:#101a3a;border:4px solid #26396f;border-radius:24px;padding:8px 30px;font-family:'Baloo 2','Nunito',sans-serif;font-size:42px;font-weight:800;color:var(--dim);cursor:pointer}
.ltab.on{border-color:var(--accent);color:var(--ink);background:#2a2036}
#lbskill{position:absolute;left:64px;top:262px;display:flex;align-items:center;gap:16px;font-size:30px;color:var(--dim);font-weight:800}
#lbsel{height:64px;min-width:760px;border-radius:18px;border:3px solid #2b3d7a;background:#16224a;color:var(--ink);font-family:inherit;font-size:30px;font-weight:800;padding:0 18px}
#lbboard{position:absolute;left:64px;top:350px;width:1792px}
.lhdr,.lrow{display:grid;grid-template-columns:100px 430px 160px 730px 260px;align-items:center;padding:0 28px}
.lhdr{height:44px;font-size:26px;color:var(--dim);font-weight:800}
.lrow{height:62px;margin-bottom:7px;background:#101a3a;border:3px solid #1f2f66;border-radius:18px;font-size:32px;font-weight:800}
.lrow .rk{font-family:'Baloo 2','Nunito',sans-serif;font-size:42px;color:var(--dim)}
.lrow.r1{border-color:var(--gold, #ffcf5a)}.lrow.r1 .rk{color:#ffcf5a}.lrow.r2 .rk{color:#d6e2ff}.lrow.r3 .rk{color:#e8a56a}
.lrow .sc{color:var(--cyan)}.lrow .sk{font-size:26px;color:var(--dim);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lempty{margin-top:50px;font-size:42px;color:var(--dim);text-align:center}
#lbfoot{position:absolute;left:64px;bottom:22px;font-size:24px;color:var(--dim)}
/* nine games: five per row */
#games{grid-template-columns:repeat(5,1fr);gap:14px 14px}
.gcard{padding:8px 10px;gap:10px;height:150px}
.gcard svg{width:118px;flex:0 0 118px}
.gcard .nm{font-size:27px}
.gcard .ds{font-size:17px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gcard .top{font-size:16px}
/* leaderboard tabs for nine games */
#lbtabs{flex-wrap:wrap;gap:10px;right:64px}
.ltab{font-size:28px;padding:4px 14px;border-width:3px;border-radius:20px}
#lbskill{top:276px}
#lbboard{top:352px}
.lrow{height:58px;margin-bottom:6px}
/* preview mode only: game opens in a frame */
#frame{position:absolute;inset:0;background:#000;z-index:30}
#frame iframe{width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="stage">
  <div id="top"><h1>Sikes Arcade</h1><div class="by"><span>Made by Ms. Sikes</span><button class="nav on" id="nav-play" tabindex="-1">Play</button><button class="nav" id="nav-lb" tabindex="-1">Leaderboard</button></div></div>

  <div id="playView">
  <div class="step" style="top:142px"><span>1</span>Choose a game</div>
  <div id="games"></div>

  <div class="step" style="top:530px"><span>2</span>Choose a skill</div>
  <div id="skills"><div id="tabs"></div><div id="grid"></div></div>

  <div id="summary">
    <div class="lbl">Your game</div><div id="pick-game"></div>
    <div class="lbl">Your skill</div><div id="pick-skill"></div>
    <div id="chips"></div>
    <button id="play">Play</button>
    <div id="hint">Press Enter to play</div>
  </div>
  </div>
  <div id="lbView" class="hidden">
    <div id="lbtabs"></div>
    <div id="lbskill"><span>Skill</span><select id="lbsel"></select></div>
    <div id="lbboard"></div>
    <div id="lbfoot"></div>
  </div>
  <div id="frame" class="hidden"></div>
</div>

<script src="settings.js"></script>
<script src="leaderboard.js"></script>
<script>
/* =====================================================================
   SikesQ: the shared question bank for Sikes Arcade (games/questions.js)
   Every game loads this one file. SETS are append-only: score codes store
   each set's position in the list, so never reorder or delete a set.
   ===================================================================== */
var SikesQ=(function(){
'use strict';
var MINUS='\u2212';
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){return String(Math.round(Math.abs(n)*100)/100);}
function num(n){return (n<0?MINUS:'')+fmt(n);}
function plain(h){return String(h).replace(/<[^>]*>/g,'');}
function art(n){return (n===8||n===11||n===18)?'An':'A';}
function subs(f){return f.replace(/(\d+)/g,'<sub>$1</sub>');}

/* ---------- chemistry data + an independent formula parser ---------- */
var ELEM={H:'hydrogen',O:'oxygen',C:'carbon',N:'nitrogen',S:'sulfur',Ca:'calcium',Al:'aluminum',
          Mg:'magnesium',Na:'sodium',Fe:'iron',Cl:'chlorine'};
var FORMULAS=[
 {f:'H2O',c:{H:2,O:1}},{f:'CO2',c:{C:1,O:2}},{f:'NH3',c:{N:1,H:3}},{f:'CH4',c:{C:1,H:4}},
 {f:'H2SO4',c:{H:2,S:1,O:4}},{f:'HNO3',c:{H:1,N:1,O:3}},{f:'H2O2',c:{H:2,O:2}},
 {f:'Ca(OH)2',c:{Ca:1,O:2,H:2}},{f:'Al(OH)3',c:{Al:1,O:3,H:3}},
 {f:'Mg(NO3)2',c:{Mg:1,N:2,O:6}},{f:'Ca(NO3)2',c:{Ca:1,N:2,O:6}},
 {f:'Al2(SO4)3',c:{Al:2,S:3,O:12}},{f:'(NH4)2SO4',c:{N:2,H:8,S:1,O:4}},
 {f:'C6H12O6',c:{C:6,H:12,O:6}},{f:'NaHCO3',c:{Na:1,H:1,C:1,O:3}},{f:'Na2CO3',c:{Na:2,C:1,O:3}},
 {f:'CaCO3',c:{Ca:1,C:1,O:3}},{f:'Fe2O3',c:{Fe:2,O:3}},{f:'NaCl',c:{Na:1,Cl:1}}
];
FORMULAS.forEach(function(x){x.h=subs(x.f);});
function parseF(s,ignoreGroupMult){
  var i=0;
  function number(){var st=i;while(i<s.length&&/[0-9]/.test(s[i]))i++;return st===i?1:parseInt(s.slice(st,i),10);}
  function group(){
    var out={};
    while(i<s.length){
      var ch=s[i];
      if(ch==='('){i++;var inner=group();var n=number();if(ignoreGroupMult)n=1;
        for(var k in inner)out[k]=(out[k]||0)+inner[k]*n;}
      else if(ch===')'){i++;return out;}
      else if(/[A-Z]/.test(ch)){var sym=ch;i++;if(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++;}
        var m=number();out[sym]=(out[sym]||0)+m;}
      else i++;
    }
    return out;
  }
  return group();
}
function sumVals(o){var t=0;for(var k in o)t+=o[k];return t;}
function digitSum(f){var t=0,m=f.match(/\d+/g)||[];m.forEach(function(d){t+=parseInt(d,10);});return t;}

/* ---------- build one 4-choice question from a spec ---------- */
function build(spec){
  if(!spec)return null;
  if(!spec.check(spec.correct.val))return null;               // the right answer must pass the check
  var seen={};seen[spec.correct.html]=true;var pool=[];
  spec.wrongs.forEach(function(w){
    if(seen[w.html])return; seen[w.html]=true;
    if(spec.check(w.val))return;                               // a wrong choice may never pass
    pool.push(w);
  });
  if(pool.length<3)return null;
  pool=shuffle(pool).slice(0,3);
  var all=[{html:spec.correct.html,ok:true,why:''}].concat(pool.map(function(w){return {html:w.html,ok:false,why:w.why};}));
  all=shuffle(all);all.forEach(function(c,i){c.key=String(i+1);});
  return {topic:spec.topic,prompt:spec.prompt,choices:all,explain:spec.explain||'',visual:spec.visual||null};
}

/* ---------- generic generators for concept questions ----------
   labelGen: the 4 (or 5) choices are always the same labels; item = [question, answerLabel, explanation]
   bankGen:  each item carries its own wrong answers; item = [question, right, explanation, [[wrong, why], ...]] */
function labelGen(topic,items,labels,whyFn,lead){
  return function(){
    var it=pick(items),a=it[1];
    var wr=labels.filter(function(l){return l!==a;}).map(function(l){return {val:l,html:l,why:whyFn(l)};});
    return {topic:topic,prompt:(lead||'')+it[0],correct:{val:a,html:a},wrongs:wr,
      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'</b>.')};
  };
}
function bankGen(topic,items){
  return function(){
    var it=pick(items),a=it[1];
    var wr=it[3].map(function(w){return {val:w[0],html:w[0],why:w[1]};});
    return {topic:topic,prompt:it[0],correct:{val:a,html:a},wrongs:wr,
      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'</b>.')};
  };
}

/* ---------- small SVG helpers (380 x 380, dark theme) ---------- */
function svgOpen(){return '<svg viewBox="0 0 380 380" width="380" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial,sans-serif" font-size="17" font-weight="700">';}
function graphSVG(o){
  var W=380,H=380,L=64,R=14,T=14,B=62,pw=W-L-R,ph=H-T-B;
  function X(t){return L+t/o.xmax*pw;}
  function Y(d){return T+ph-d/o.ymax*ph;}
  var s=svgOpen(),i;
  for(i=0;i<=o.xmax;i+=o.xstep){s+='<line x1="'+X(i)+'" y1="'+T+'" x2="'+X(i)+'" y2="'+(T+ph)+'" stroke="#2b3d7a" stroke-width="1"/>';
    if(i%o.xlab===0)s+='<text x="'+X(i)+'" y="'+(T+ph+22)+'" fill="#eef3ff" text-anchor="middle">'+i+'</text>';}
  for(i=0;i<=o.ymax;i+=o.ystep){s+='<line x1="'+L+'" y1="'+Y(i)+'" x2="'+(L+pw)+'" y2="'+Y(i)+'" stroke="#2b3d7a" stroke-width="1"/>';
    if(i%o.ylab===0)s+='<text x="'+(L-8)+'" y="'+(Y(i)+6)+'" fill="#eef3ff" text-anchor="end">'+i+'</text>';}
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#9db0d6" stroke-width="3"/>';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="#9db0d6" stroke-width="3"/>';
  s+='<text x="'+(L+pw/2)+'" y="'+(H-8)+'" fill="#9db0d6" text-anchor="middle">Time (s)</text>';
  s+='<text transform="translate(16,'+(T+ph/2)+') rotate(-90)" fill="#9db0d6" text-anchor="middle">Distance (m)</text>';
  (o.marks||[]).forEach(function(m){
    s+='<line x1="'+X(m.t)+'" y1="'+(T+ph)+'" x2="'+X(m.t)+'" y2="'+Y(m.d)+'" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 5"/>';
    s+='<line x1="'+L+'" y1="'+Y(m.d)+'" x2="'+X(m.t)+'" y2="'+Y(m.d)+'" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 5"/>';
  });
  o.lines.forEach(function(ln){
    var p=ln.pts.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);}).join(' ');
    s+='<polyline points="'+p+'" fill="none" stroke="'+ln.color+'" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
    if(ln.dots)ln.pts.forEach(function(q,k){if(k===0||k===ln.pts.length-1)s+='<circle cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="7" fill="'+ln.color+'"/>';});
    if(ln.label){var e=ln.pts[ln.pts.length-1];s+='<text x="'+(X(e[0])-8)+'" y="'+(Y(e[1])-10)+'" fill="'+ln.color+'" text-anchor="end" font-size="20">'+ln.label+'</text>';}
  });
  return s+'</svg>';
}

/* =====================================================================
   SET 0  Newton's Second Law (8.7A)
   ===================================================================== */
var OBJ=['cart','wagon','sled','skateboard','crate','lab trolley','toy car','shopping cart'];
function gAccel(){
  var m=pick([2,3,4,5,6,8,10,12,15,20]),a=rnd(2,9),F=m*a,o=pick(OBJ),wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' m/s²',why:why});}
  W(F*m,'You multiplied. Acceleration is force <b>÷</b> mass.');
  W(m/F,'That’s upside down. Divide the force by the mass.');
  W(F-m,'Subtracting doesn’t work here. Use a = F ÷ m.');
  W(F+m,'Adding doesn’t work here. Use a = F ÷ m.');
  return {topic:'accel',prompt:art(m)+' <b>'+m+' kg</b> '+o+' is pushed with a net force of <b>'+F+' N</b>. What is its acceleration?',
    correct:{val:a,html:a+' m/s²'},wrongs:wr,check:function(v){return Math.abs(v*m-F)<1e-9;},
    explain:'a = F ÷ m = '+F+' ÷ '+m+' = <b>'+a+' m/s²</b>'};
}
function gForce(){
  var m=rnd(2,12),a=rnd(2,9),F=m*a,o=pick(OBJ),wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' N',why:why});}
  W(m+a,'You added. Force is mass <b>×</b> acceleration.');
  W(m/a,'That’s mass ÷ acceleration. Multiply them instead.');
  W(a/m,'That’s upside down. Multiply mass by acceleration.');
  W(m-a,'Subtracting doesn’t work here. Use F = m × a.');
  return {topic:'force',prompt:art(m)+' <b>'+m+' kg</b> '+o+' speeds up at <b>'+a+' m/s²</b>. What net force acts on it?',
    correct:{val:F,html:F+' N'},wrongs:wr,check:function(v){return Math.abs(v/m-a)<1e-9;},
    explain:'F = m × a = '+m+' × '+a+' = <b>'+F+' N</b>'};
}
function gMass(){
  var m=pick([2,3,4,5,6,8,10,12,15]),a=rnd(2,9),F=m*a,wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' kg',why:why});}
  W(F*a,'You multiplied. Mass is force <b>÷</b> acceleration.');
  W(a/F,'That’s upside down. Divide the force by the acceleration.');
  W(F-a,'Subtracting doesn’t work here. Use m = F ÷ a.');
  W(F+a,'Adding doesn’t work here. Use m = F ÷ a.');
  return {topic:'mass',prompt:'A net force of <b>'+F+' N</b> gives an object an acceleration of <b>'+a+' m/s²</b>. What is its mass?',
    correct:{val:m,html:m+' kg'},wrongs:wr,check:function(v){return Math.abs(v*a-F)<1e-9;},
    explain:'m = F ÷ a = '+F+' ÷ '+a+' = <b>'+m+' kg</b>'};
}
function gNet(){
  var m=pick([2,3,4,5,6,8,10]),a=rnd(2,8),net=m*a,F2=rnd(5,30),F1=F2+net,wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' m/s²',why:why});}
  W((F1+F2)/m,'Those pushes point opposite ways, so subtract to find the net force first.');
  W(F1/m,'You ignored the push from the other student. Use the net force.');
  W(net,'That’s the net force. Now divide it by the mass.');
  W(net*m,'You multiplied. Divide the net force by the mass.');
  W(F2/m,'You used only the smaller push. Use the net force.');
  return {topic:'net',prompt:'Two students push '+art(m).toLowerCase()+' <b>'+m+' kg</b> crate. One pushes right with <b>'+F1+' N</b>. The other pushes left with <b>'+F2+' N</b>. What is the crate’s acceleration?',
    correct:{val:a,html:a+' m/s²'},wrongs:wr,check:function(v){return Math.abs(v*m-(F1-F2))<1e-9;},
    explain:'Net force = '+F1+' − '+F2+' = '+net+' N (to the right)<br>a = '+net+' ÷ '+m+' = <b>'+a+' m/s²</b>'};
}

/* =====================================================================
   SET 1  Count the Atoms (7.6B)
   ===================================================================== */
function gOne(){
  var f=pick(FORMULAS),els=Object.keys(f.c),el=pick(els),cnt=f.c[el],wr=[];
  var other=pick(els.filter(function(e){return e!==el;}));
  var vis=parseF(f.f,true)[el];
  function W(v,why){wr.push({val:v,html:String(v),why:why});}
  W(sumVals(f.c),'That’s <b>all</b> the atoms. The question asks only about '+ELEM[el]+'.');
  W(els.length,'That counts kinds of elements, not atoms of '+ELEM[el]+'.');
  W(vis,'Remember: the number outside the parentheses multiplies everything inside.');

function slopeLabel(pts){
  var sl=[],i;for(i=0;i<pts.length-1;i++)sl.push(pts[i+1][1]-pts[i][1]);
  var mn=Math.min.apply(null,sl),mx=Math.max.apply(null,sl);
  if(Math.abs(mx)<1e-9&&Math.abs(mn)<1e-9)return 'At rest';
  if(mx-mn<1e-6)return 'Steady speed';
  return sl[sl.length-1]>sl[0]?'Speeding up':'Slowing down';
}

function term(t,blank){return (blank?'<b>?</b>':(t[0]>1?t[0]:''))+subs(t[1]);}
function eqHtml(e,bi){

  var l=side(e.L),r=side(e.R);return l+' → '+r;
}
function sideCount(side,el,coeffOverride){
  var t=0;side.forEach(function(x,i){var c=coeffOverride&&coeffOverride[i]!==undefined?coeffOverride[i]:x[0];t+=c*(parseF(x[1])[el]||0);});return t;
}

function gMassCons(){

  function W(v,why){wr.push({val:v,html:v+' g',why:why});}
  if(form===0){
    prompt='In a closed container, <b>'+a+' g</b> of reactant A reacts completely with <b>'+b+' g</b> of reactant B. What is the total mass of the products?';
    right=tot;W(Math.abs(a-b),'You subtracted. Mass is conserved, so add the reactants.');W(a,'That’s only one reactant.');W(b,'That’s only one reactant.');W(tot+10,'Mass can’t increase in a closed system.');W(Math.max(1,tot-10),'Mass can’t decrease in a closed system.');
    why=a+' + '+b+' = <b>'+tot+' g</b>';
    return {topic:'mass',prompt:prompt,correct:{val:right,html:right+' g'},wrongs:wr,check:function(v){return v===a+b;},explain:'Mass is conserved: '+why};
  }
  if(form===1){
    prompt='A reaction in a sealed flask makes <b>'+tot+' g</b> of products. One reactant had a mass of <b>'+a+' g</b>. What was the mass of the other reactant?';
    right=b;W(tot,'That’s the total product mass.');W(a,'That’s the mass of the first reactant you were given.');W(tot+a,'You added. Subtract the known reactant from the total.');W(b+5,'Close. Subtract carefully.');W(Math.max(1,b-5),'Close. Subtract carefully.');
    return {topic:'mass',prompt:prompt,correct:{val:right,html:right+' g'},wrongs:wr,check:function(v){return v+a===tot;},explain:'Reactants = products, so '+tot+' − '+a+' = <b>'+b+' g</b>.'};
  }
  var p1=rnd(2,tot-2),p2=tot-p1;
  prompt='<b>'+tot+' g</b> of reactants react in a closed system and make two products. Product 1 has a mass of <b>'+p1+' g</b>. What is the mass of product 2?';
  right=p2;W(tot,'That’s the total reactant mass.');W(p1,'That’s the mass of product 1.');W(tot+p1,'You added. Subtract product 1 from the total.');W(p2+4,'Close. Subtract carefully.');W(Math.max(1,p2-4),'Close. Subtract carefully.');

}
function gBalance(){
  var e=pick(EQS),n=e.L.length+e.R.length,bi=rnd(0,n-1),all=e.L.concat(e.R),correct=all[bi][0],wr=[];
  var others=all.map(function(t){return t[0];});
  var cand=[correct+1,correct+2,Math.max(1,correct-1),correct*2,1,3,4,others[(bi+1)%n]+correct];
  cand.forEach(function(v){wr.push({val:v,html:String(v),why:'Count the atoms of each element on both sides. That number doesn’t balance the equation.'});});
  var nL=e.L.length;
  function balanced(v){
    var co=all.map(function(t,i){return i===bi?v:t[0];});
    return eqElements(e).every(function(el){
      var l=0,r=0;e.L.forEach(function(t,i){l+=co[i]*(parseF(t[1])[el]||0);});
      e.R.forEach(function(t,i){r+=co[nL+i]*(parseF(t[1])[el]||0);});return l===r;});
  }
  return {topic:'balance',prompt:'What number goes in the blank to balance this equation?<br>'+eqHtml(e,bi),
    correct:{val:correct,html:String(correct)},wrongs:wr,check:balanced,
    explain:'Atoms are not created or destroyed, so each element must have the same count on both sides. The balanced equation is: '+eqHtml(e,-1)};
}

  var all=0;arr.forEach(function(t){all+=t[0]*sumVals(parseF(t[1]));});W(all,'That’s all atoms of every element. Count only '+el+'.');

/* forGame('lh') -> null if the link names no set (unless options say which set) */
function forGame(prefix,opt){
  opt=opt||{};
  var setId=opt.set||param('set');if(!setId)return null;
  var idx=findSet(setId);if(idx<0)return null;
  var set=SETS[idx];
  var want=opt.topics||(param('topics')?param('topics').split(','):[]);
  var tops=want.filter(function(t){return set.topicIds.indexOf(t)>=0;});
  if(!tops.length)tops=set.topicIds.slice();
  var mask=0;set.topicIds.forEach(function(t,i){if(tops.indexOf(t)>=0)mask|=(1<<i);});
  var bag=[],recent=[];
  var api={prefix:prefix,set:set,setIndex:idx,topics:tops,topicMask:mask,
    next:function(){
      var q,sig,tries=0;
      do{
        if(!bag.length)bag=shuffle(tops);
        q=make(set,bag.pop());tries++;
        sig=q.prompt+'|'+q.choices.filter(function(c){return c.ok;})[0].html;
      }while(recent.indexOf(sig)>=0&&tries<40);
      recent.push(sig);if(recent.length>10)recent.shift();
      return q;},
    short:function(maxLen){var q;
      for(var i=0;i<200;i++){q=api.next();
        if(q.choices.every(function(c){return plain(c.html).length<=maxLen;}))return q;}
      return q;}};
  return api;
}

  });
  SETS.forEach(function(s){s.topics.forEach(function(t){

<script>
var SikesCode=(function(){
'use strict';
var ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';          // 32 characters, no I O 0 1
var SALT='sikes-arcade-v1';
var GAMES={lh:1,mg:2,cs:3,bb:4,sn:5,fi:6,bk:7,fc:8,ns:9};                                         // game number by id (append only)
var FIELDS=[['ver',4],['game',6],['set',5],['topics',6],['run',5],['day',11],['score',12],['correct',7],['answered',7]];
var EPOCH=Date.UTC(2026,0,1);
function normName(n){return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function seal(payload,name){
  var s=payload.toString(36)+'|'+normName(name)+'|'+SALT,h=0x811c9dc5;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}
  h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;
  return h&0x1FFFF;
}
function encode(f,name){
  var v=0n;
  FIELDS.forEach(function(x){var bits=x[1],val=Math.max(0,Math.min((1<<bits)-1,Math.floor(f[x[0]]||0)));v=(v<<BigInt(bits))|BigInt(val);});
  var full=(v<<17n)|BigInt(seal(v,name)),s='';
  for(var i=0;i<16;i++){s=ALPHA[Number(full&31n)]+s;full>>=5n;}
  return s;
}
function decode(code,name){
  var c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==16)return {ok:false};
  var full=0n;
  for(var i=0;i<16;i++){var k=ALPHA.indexOf(c[i]);if(k<0)return {ok:false};full=(full<<5n)|BigInt(k);}
  var sealBits=Number(full&0x1FFFFn),v=full>>17n,out={ok:false},rest=v;
  for(var j=FIELDS.length-1;j>=0;j--){var b=FIELDS[j][1];out[FIELDS[j][0]]=Number(rest&((1n<<BigInt(b))-1n));rest>>=BigInt(b);}
  out.ok=(seal(v,name)===sealBits);
  out.date=new Date(EPOCH+out.day*86400000);
  return out;
}
function fmtCode(c){return c.replace(/(.{4})(?=.)/g,'$1-');}
/* S = {name, score, correct, answered, setIndex, topicMask, runSec} */
function make(gameId,S){
  var day=Math.floor((Date.now()-EPOCH)/86400000);
  return fmtCode(encode({ver:1,game:GAMES[gameId]||0,set:S.setIndex,topics:S.topicMask,
    run:Math.round((S.runSec||240)/15),day:day,score:S.score,correct:S.correct,answered:S.answered},S.name));
}
function show(prefix,gameId,S){
  var code=make(gameId,S),el=document.getElementById(prefix+'-code');
  if(el)el.textContent=code;
  return code;
}
return {make:make,show:show,decode:decode,encode:encode,normName:normName,GAMES:GAMES};
})();

<script>
/* =====================================================================
   SikesBoard: reads score rows (from your published Google Sheet) and builds the leaderboard (games/board.js)
   Needs questions.js and scorecode.js to be loaded first.
   Every row is checked: the code must have been earned under the name written next to it.
   ===================================================================== */
var SikesBoard=(function(){
'use strict';
var ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',NUM2ID={};
Object.keys(SikesCode.GAMES).forEach(function(k){NUM2ID[SikesCode.GAMES[k]]=k;});

/* a small CSV reader that handles quotes and line breaks inside quotes */
function parseCSV(text){
  var rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function cleanCode(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function looksLikeCode(s){var c=cleanCode(s);if(c.length!==16)return false;for(var i=0;i<16;i++)if(ALPHA.indexOf(c[i])<0)return false;return true;}
function isStamp(s){return /^\s*\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}/.test(s)||/\d{1,2}:\d{2}/.test(s);}
function fmtDate(d){return d.toISOString().slice(0,10);}

/* turn rows of fields into checked entries: [{name, code, info}] (bad rows are skipped) */
function entries(rows){
  var out=[],seen={};
  rows.forEach(function(r){
    var f=r.map(function(x){return String(x).trim();}).filter(function(x){return x.length;});
    var codes=f.filter(looksLikeCode),names=f.filter(function(x){return !looksLikeCode(x)&&!isStamp(x)&&/[A-Za-z]/.test(x);});
    if(!codes.length||!names.length)return;
    var code=cleanCode(codes[0]),res=null,name='';
    for(var i=0;i<names.length&&!res;i++){var d=SikesCode.decode(code,names[i]);if(d.ok){res=d;name=names[i];}}
    if(!res)return;
    var gid=NUM2ID[res.game],set=SikesQ.SETS[res.set];
    if(!gid||!set||res.answered<1||res.correct>res.answered||res.ver!==1)return;
    if(seen[code])return;seen[code]=true;
    out.push({name:name,code:code,info:{game:gid,set:set,score:res.score,correct:res.correct,answered:res.answered,date:res.date}});
  });
  return out;
}

/* best score per student for each game, and for each skill inside each game; top 10 of each */
function build(list){
  var best={},bestSkill={},games={},skills={};
  function better(a,b){return !b||a.score>b.score||(a.score===b.score&&a.correct/a.answered>b.correct/b.answered);}
  list.forEach(function(e){
    var i=e.info,nm=e.name.trim(),norm=SikesCode.normName(nm);
    var rec={game:i.game,name:nm,score:i.score,correct:i.correct,answered:i.answered,set:i.set.id,skill:i.set.name+' ('+i.set.teks+')',date:fmtDate(i.date)};
    var k1=i.game+'|'+norm,k2=i.game+'|'+i.set.id+'|'+norm;
    if(better(rec,best[k1]))best[k1]=rec;
    if(better(rec,bestSkill[k2]))bestSkill[k2]=rec;
  });
  function trim(a){return a.sort(function(x,y){return y.score-x.score||(y.correct/y.answered)-(x.correct/x.answered);}).slice(0,10).map(function(b){
    return {name:b.name,score:b.score,correct:b.correct,answered:b.answered,set:b.set,skill:b.skill,date:b.date};});}
  Object.keys(best).forEach(function(k){var b=best[k];(games[b.game]=games[b.game]||[]).push(b);});
  Object.keys(bestSkill).forEach(function(k){var b=bestSkill[k];((skills[b.game]=skills[b.game]||{})[b.set]=skills[b.game][b.set]||[]).push(b);});
  Object.keys(games).forEach(function(g){games[g]=trim(games[g]);});
  Object.keys(skills).forEach(function(g){Object.keys(skills[g]).forEach(function(s){skills[g][s]=trim(skills[g][s]);});});
  return {updated:new Date().toISOString(),games:games,skills:skills};
}
function fromCSV(text){return build(entries(parseCSV(text)));}
return {parseCSV:parseCSV,entries:entries,build:build,fromCSV:fromCSV};
})();
if(typeof module!=='undefined')module.exports=SikesBoard;

</script>

;justify-content:center;font-size:34px;color:var(--cyan)}\n#p-feedback{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}\n.fb{background:#121d42;border:3px solid #2b3d7a;border-radius:22px;padding:22px 28px;\n  display:flex;flex-direction:column;gap:12px;font-size:34px;line-height:1.3}\n.fb.good{border-color:var(--mint)} .fb.bad{border-color:var(--rose)}\n.fb-title{font-family:'Baloo 2','Nunito',sans-serif;font-size:56px;font-weight:800;line-height:1}\n.fb.good .fb-title{color:var(--mint)} .fb.bad .fb-title{color:var(--rose)}\n.fb b{color:var(--gold);font-weight:800}\n.fb .explain{background:#0b1228;border-radius:16px;padding:14px 20px;font-size:34px}\n.act{align-self:flex-start;margin-top:6px;border:0;border-radius:18px;background:var(--ball);color:#1d1004;\n  font-size:44px;font-weight:800;padding:16px 38px;cursor:pointer}\n.act:hover{background:#ff9d5e}\n.act kbd{font-family:inherit;font-size:28px;background:rgba(0,0,0,.18);border-radius:10px;padding:2px 12px;margin-left:12px}\n\n/* ---------- Overlays ---------- */\n.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\n  background:rgba(3,5,12,.94);z-index:20}\n.card{width:1180px;background:linear-gradient(#111b3b,#0b1228);border:3px solid var(--line);\n  border-radius:34px;padding:44px 64px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}\n.eyebrow{font-size:34px;color:var(--cyan);font-weight:800;letter-spacing:.04em}\n.card h1{font-family:'Baloo 2','Nunito',sans-serif;font-size:150px;line-height:.95;font-weight:800;color:var(--ball)}\n.credit{font-size:32px;color:var(--dim)}\n.card label,.lbl2{font-size:30px;color:var(--dim);font-weight:800;margin-top:10px}\n#name{width:760px;height:84px;border-radius:20px;border:3px solid #2b3d7a;background:#0b1228;color:var(--ink);\n  font-size:42px;font-weight:800;padding:0 26px;text-align:center;font-family:inherit}\n#name:focus{outline:none;border-color:var(--cyan)}\n#name-err{height:34px;font-size:2 Nunito',sans-serif;font-size:84px;font-weight:800}\n#ov-new p{font-size:36px;color:var(--dim)}\n#ov-test pre{font-size:24px;line-height:1.35;max-width:1500px;white-space:pre-wrap;color:var(--ink)}\n.fb.live{padding:18px 26px}\n#helpbar span.keyhint{color:var(--cyan)}\n\n#e-send{font-size:32px;font-weight:800;color:var(--mint);min-height:42px}\n.act:disabled{opacity:.45;cursor:default;background:#8a5a30}\n", "js": {"questions.js": "/* =====================================================================\n   SikesQ: the shared question bank for Sikes Arcade (games/questions.js)\n   Every game loads this one file. SETS are append-only: score codes store\n   each set's position in the list, so never reorder or delete a set.\n   ===================================================================== */\nvar SikesQ=(function(){\n'use strict';\nvar MINUS='\\u2212';\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)];}\nfunction shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}\nfunction fmt(n){return String(Math.round(Math.abs(n)*100)/100);}\nfunction num(n){return (n<0?MINUS:'')+fmt(n);}\nfunction plain(h){return String(h).replace(/<[^>]*>/g,'');}\nfunction art(n){return (n===8||n===11||n===18)?'An':'A';}\nfunction subs(f){return f.replace(/(\\d+)/g,'<sub>$1<\/sub>');}\n\n/* ---------- chemistry data + an independent formula parser ---------- */\nvar ELEM={H:'hydrogen',O:'oxygen',C:'carbon',N:'nitrogen',S:'sulfur',Ca:'calcium',Al:'aluminum',\n          Mg:'magnesium',Na:'sodium',Fe:'iron',Cl:'chlorine'};\nvar FORMULAS=[\n {f:'H2O',c:{H:2,O:1}},{f:'CO2',c:{C:1,O:2}},{f:'NH3',c:{N:1,H:3}},{f:'CH4',c:{C:1,H:4}},\n {f:'H2SO4',c:{H:2,S:1,O:4}},{f:'HNO3',c:{H:1,N:1,O:3}},{f:'H2O2',c:{H:2,O:2}},\n {f:'Ca(OH)2',c:{Ca:1,O:2,H:2}},{f:'Al(OH)3',c:{Al:1,O:3,H:3}},\n {f:'Mg(NO3)2',c:{Mg:1,N:2,O:6}},{f:'Ca(NO3)2',c:{Ca:1,N:2,O:6}},\n {f:'Al2(SO4)3',c:{Al:2,S:3,O:12}},{f:'(NH4)2SO4',c:{N:2,H:8,S:1,O:4}},\n {f:'C6H12O6',c:{C:6,H:12,O:6}},{f:'NaHCO3',c:{Na:1,H:1,C:1,O:3}},{f:'Na2CO3',c:{Na:2,C:1,O:3}},\n {f:'CaCO3',c:{Ca:1,C:1,O:3}},{f:'Fe2O3',c:{Fe:2,O:3}},{f:'NaCl',c:{Na:1,Cl:1}}\n];\nFORMULAS.forEach(function(x){x.h=subs(x.f);});\nfunction parseF(s,ignoreGroupMult){\n  var i=0;\n  function number(){var st=i;while(i<s.length&&/[0-9]/.test(s[i]))i++;return st===i?1:parseInt(s.slice(st,i),10);}\n  function group(){\n    var out={};\n    while(i<s.length){\n      var ch=s[i];\n      if(ch==='('){i++;var inner=group();var n=number();if(ignoreGroupMult)n=1;\n        for(var k in inner)out[k]=(out[k]||0)+inner[k]*n;}\n      else if(ch===')'){i++;return out;}\n      else if(/[A-Z]/.test(ch)){var sym=ch;i++;if(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++;}\n        var m=number();out[sym]=(out[sym]||0)+m;}\n      else i++;\n    }\n    return out;\n  }\n  return group();\n}\nfunction sumVals(o){var t=0;for(var k in o)t+=o[k];return t;}\nfunction digitSum(f){var t=0,m=f.match(/\\d+/g)||[];m.forEach(function(d){t+=parseInt(d,10);});return t;}\n\n/* ---------- build one 4-choice question from a spec ---------- */\nfunction build(spec){\n  if(!spec)return null;\n  if(!spec.check(spec.correct.val))return null;               // the right answer must pass the check\n  var seen={};seen[spec.correct.html]=true;var pool=[];\n  spec.wrongs.forEach(function(w){\n    if(seen[w.html])return; seen[w.html]=true;\n    if(spec.check(w.val))return;                               // a wrong choice may never pass\n    pool.push(w);\n  });\n  if(pool.length<3)return null;\n  pool=shuffle(pool).slice(0,3);\n  var all=[{html:spec.correct.html,ok:true,why:''}].concat(pool.map(function(w){return {html:w.html,ok:false,why:w.why};}));\n  all=shuffle(all);all.forEach(function(c,i){c.key=String(i+1);});\n  return {topic:spec.topic,prompt:spec.prompt,choices:all,explain:spec.explain||'',visual:spec.visual||null};\n}\n\n/* ---------- generic generators for concept questions ----------\n   labelGen: the 4 (or 5) choices are always the same labels; item = [question, answerLabel, explanation]\n   bankGen:  each item carries its own wrong answers; item = [question, right, explanation, [[wrong, why], ...]] */\nfunction labelGen(topic,items,labels,whyFn,lead){\n  return function(){\n    var it=pick(items),a=it[1];\n    var wr=labels.filter(function(l){return l!==a;}).map(function(l){return {val:l,html:l,why:whyFn(l)};});\n    return {topic:topic,prompt:(lead||'')+it[0],correct:{val:a,html:a},wrongs:wr,\n      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'<\/b>.')};\n  };\n}\nfunction bankGen(topic,items){\n  return function(){\n    var it=pick(items),a=it[1];\n    var wr=it[3].map(function(w){return {val:w[0],html:w[0],why:w[1]};});\n    return {topic:topic,prompt:it[0],correct:{val:a,html:a},wrongs:wr,\n      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'<\/b>.')};\n  };\n}\n\n/* ---------- small SVG helpers (380 x 380, dark theme) ---------- */\nfunction svgOpen(){return '<svg viewBox=\"0 0 380 380\" width=\"380\" height=\"380\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Nunito,Arial,sans-serif\" font-size=\"17\" font-weight=\"700\">';}\nfunction graphSVG(o){\n  var W=380,H=380,L=64,R=14,T=14,B=62,pw=W-L-R,ph=H-T-B;\n  function X(t){return L+t/o.xmax*pw;}\n  function Y(d){return T+ph-d/o.ymax*ph;}\n  var s=svgOpen(),i;\n  for(i=0;i<=o.xmax;i+=o.xstep){s+='<line x1=\"'+X(i)+'\" y1=\"'+T+'\" x2=\"'+X(i)+'\" y2=\"'+(T+ph)+'\" stroke=\"#2b3d7a\" stroke-width=\"1\"/>';\n    if(i%o.xlab===0)s+='<text x=\"'+X(i)+'\" y=\"'+(T+ph+22)+'\" fill=\"#eef3ff\" text-anchor=\"middle\">'+i+'<\/text>';}\n  for(i=0;i<=o.ymax;i+=o.ystep){s+='<line x1=\"'+L+'\" y1=\"'+Y(i)+'\" x2=\"'+(L+pw)+'\" y2=\"'+Y(i)+'\" stroke=\"#2b3d7a\" stroke-width=\"1\"/>';\n    if(i%o.ylab===0)s+='<text x=\"'+(L-8)+'\" y=\"'+(Y(i)+6)+'\" fill=\"#eef3ff\" text-anchor=\"end\">'+i+'<\/tex [],water:[]},\n {tee:[110,150],hole:[860,150],walls:[[440,0,50,520]],sand:[],water:[]},\n {tee:[110,390],hole:[860,390],walls:[],sand:[[380,190,220,400]],water:[]},\n {tee:[110,390],hole:[860,390],walls:[],sand:[],water:[[430,130,120,520]]},\n {tee:[110,390],hole:[860,390],walls:[[390,140,50,220],[560,420,50,220]],sand:[],water:[]},\n {tee:[110,680],hole:[860,100],walls:[[300,340,500,50]],sand:[],water:[]},\n {tee:[110,140],hole:[860,640],walls:[[300,0,40,540],[620,240,40,540]],sand:[],water:[]}\n];\nvar API=null;\n\nfunction pointsFor(strokes){return strokes<=1?6:strokes===2?4:strokes===3?3:strokes===4?2:1;}\nfunction mirror(L,fx,fy){\n  function X(x,w){return fx?COURSE.w-x-(w||0):x;}\n  function Y(y,h){return fy?COURSE.h-y-(h||0):y;}\n  function rects(a){return a.map(function(r){return {x:X(r[0],r[2]),y:Y(r[1],r[3]),w:r[2],h:r[3]};});}\n  return {tee:{x:X(L.tee[0]),y:Y(L.tee[1])},hole:{x:X(L.hole[0]),y:Y(L.hole[1])},walls:rects(L.walls),sand:rects(L.sand),water:rects(L.water)};\n}\nfunction newHole(g){\n  var L=mirror(LAYOUTS[g.layoutIdx=(g.layoutIdx+1+Math.floor(Math.random()*(LAYOUTS.length-1)))%LAYOUTS.length],Math.random()<0.5,Math.random()<0.5);\n  g.hole=L;g.strokes=0;\n  g.ball={x:L.tee.x,y:L.tee.y,vx:0,vy:0};g.rest={x:L.tee.x,y:L.tee.y};\n  g.aim=Math.atan2(L.hole.y-L.tee.y,L.hole.x-L.tee.x);g.state='idle';g.charge=0;g.charging=false;g.sinkT=0;\n}\nfunction inRect(b,r){return b.x>r.x&&b.x<r.x+r.w&&b.y>r.y&&b.y<r.y+r.h;}\nfunction collide(b,r){\n  var cxp=Math.max(r.x,Math.min(b.x,r.x+r.w)),cyp=Math.max(r.y,Math.min(b.y,r.y+r.h)),dx=b.x-cxp,dy=b.y-cyp,d2=dx*dx+dy*dy;\n  if(d2>=R*R)return;\n  var nx,ny;\n  if(d2>1e-6){var d=Math.sqrt(d2);nx=dx/d;ny=dy/d;b.x=cxp+nx*R;b.y=cyp+ny*R;}\n  else{ // centre inside the wall: push out through the nearest side\n    var l=b.x-r.x,rt=r.x+r.w-b.x,t=b.y-r.y,bt=r.y+r.h-b.y,m=Math.min(l,rt,t,bt);\n    if(m===l){nx=-1;ny=0;b.x=r.x-R;}else if(m===rt){nx=1;ny=0;b.x=r.x+r.w+R;}else if(m===t){nx=0;ny=-1;b.y=r.y-R;}else{nx=0;ny=1;b.y=r.y+r.h+R;}\n  }\n  var vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.8*vn*nx;b.vy-=1.8*vn*ny;API.SND.soft();}\n}\nfunction step(g,dt){\n  var b=g.ball,sp,k=1.3;\n  if(g.hole.sand.some(function(r){return inRect(b,r);}))k=4.8;\n  var f=Math.exp(-k*dt);b.vx*=f;b.vy*=f;\n  b.x+=b.vx*dt;b.y+=b.vy*dt;\n  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*0.8;}\n  if(b.x>COURSE.w-R){b.x=COURSE.w-R;b.vx=-Math.abs(b.vx)*0.8;}\n  if(b.y<R){b.y=R;b.vy=Math.abs(b.vy)*0.8;}\n  if(b.y>COURSE.h-R){b.y=COURSE.h-R;b.vy=-Math.abs(b.vy)*0.8;}\n  g.hole.walls.forEach(function(r){collide(b,r);});\n  sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);\n  if(g.hole.water.some(function(r){return inRect(b,r);})){            // splash: back to where you swung from\n    b.x=g.rest.x;b.y=g.rest.y;b.vx=b.vy=0;API.popup(COURSE.x+b.x,COURSE.y+b.y-40,'Splash!','#38d6ff');API.SND.bad();return 'stop';\n  }\n  var dh=Math.hypot(b.x-g.hole.hole.x,b.y-g.hole.hole.y);\n  if(dh<HOLE_R&&sp<760){g.state='sink';g.sinkT=0;g.sinkFrom={x:b.x,y:b.y};return 'sink';}\n  if(sp<14){b.vx=b.vy=0;return 'stop';}\n  return null;\n}\nfunction finishStroke(G,api){\n  var g=G.g;g.rest={x:g.ball.x,y:g.ball.y};g.state='idle';\n  if(g.strokes>=MAX_STROKES){api.popup(COURSE.x+g.ball.x,COURSE.y+g.ball.y-40,'Pick up! +1','#ffcf5a');G.you+=1;G.rival+=1;api.hud();newHole(g);}\n  api.resolve();\n}\n\nAPI=Arcade.create({\n  prefix:'mg',gameId:'mg',title:'Birdie Lab',\n  how:'Answer to earn a stroke. Press \u2190 \u2192 to aim, hold Space to charge, and let go to swing.',\n  mode:'turn',hud:['Score','Holes'],holdAction:true,roundSeconds:240,\n  theme:{'--ball':'#6df0a0','--cyan':'#b78bff','--bg':'#06110f','--panel2':'#0a1a17','--line':'#1f5a4a'},\n  progression:[[52,55,59],[48,52,55],[50,54,57],[47,52,56]],pattern:[0,2,1,2,0,2,1,2],beat:0.38,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#04100e');g.addColorStop(1,'#0a2420');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(109,240,160,.07)';c.lineWidth=2;\n    for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,1080);c.stroke();}\n    for(var y=0;y<1080;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(1180,y);c.stroke();}\n    c.fillStyle='rgba(109,240,160,.10)';c.fillRect(COURSE.x-26,COURSE.y-26,COURSE.w+52,COURSE.h+52);\n    c.fillStyle='#8c6b3c';c.fillRect(COURSE.x-16,COURSE.y-16,COURSE.w+32,COURSE.h+32);\n    c.fillStyle='#17803f';c.fillRect(COURSE.x,COURSE.y,COURSE.w,COURSE.h);\n    c.fillStyle='rgba(255,255,255,.05)';for(var s=0;s<COURSE.w;s+=120)c.fillRect(COURSE.x+s,COURSE.y,60,COURSE.h);\n  },\n  init:function(G,api){G.g={layoutIdx:0,holes:0,keys:{}};newHole(G.g);},\n  heat:function(G){return G.g&&G.g.strokes?'Stroke '+G.g.strokes+' of '+MAX_STROKES:'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.state='aim';\n    return {msg:'Aim with \u2190 \u2192, hold Space to charge, then let go.',button:'Hold to swing'};\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g;if(!g)return;\n    if(k==='ArrowLeft'||k==='a'||k==='A')g.keys.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')g.keys.r=true;\n    if(k===' '&&G.phase==='act'&&g.state==='aim'){g.charging=true;g.charge=0;}\n  },\n  onKeyUp:function(k,G,api){\n    var g=G.g;if(!g)return;\n    if(k==='ArrowLeft'||k==='a'||k==='A')g.keys.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')g.keys.r=false;\n    if(k===' '&&g.charging){\n      g.charging=false;var p=Math.max(0.08,g.charge),v=150+p*1450;\n      g.ball.vx=Math.cos(g.aim)*v;g.ball.vy=Math.sin(g.aim)*v;g.strokes++;g.state='roll';api.begin();api.SND.nice();\n      g.charge=0;\n    }\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g)return;\n    var turn=(g.keys.r?1:0)-(g.keys.l?1:0);\n    if(turn&&(g.state==='aim'||g.state==='idle'))g.aim+=turn*1.9*dt;\n    if(g.charging)g.charge=Math.min(1,g.charge+dt*0.85);\n    if(g.state==='roll'){\n      var n=Math.ceil(dt/0.008),h=dt/n,res=null;\n      for(var i=0;i<n&&!res;i++)res=step(g,h);\n      if(res==='stop')finishStroke(G,api);\n    }\n    if(g.state==='sink'){\n      g.sinkT+=dt;var t=Math.min(1,g.sinkT/0.45);\n      g.ball.x=g.sinkFrom.x+(g.hole.hole.x-g.sinkFrom.x)*t;g.ball.y=g.sinkFrom.y+(g.hole.hole.y-g.sinkFrom.y)*t;\n      if(g.sinkT>=0.6){\n        var pts=pointsFor(g.strokes);G.you+=pts;G.rival+=1;g.holes++;\n        api.popup(COURSE.x+g.hole.hole.x,COURSE.y+g.hole.hole.y-60,(g.strokes===1?'Hole in one! ':'In! ')+'+'+pts,'#6df0a0');\n        api.burst(COURSE.x+g.hole.hole.x,COURSE.y+g.hole.hole.y,g.strokes<=2?50:24);api.SND.swish();if(g.strokes<=2)api.shake(0.2);\n        api.hud();newHole(g);api.resolve();\n      }\n    }\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    var ox=COURSE.x,oy=COURSE.y;\n    g.hole.sand.forEach(function(r){c.fillStyle='#d9c27a';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='rgba(120,90,30,.5)';c.lineWidth=3;c.strokeRect(ox+r.x,oy+r.y,r.w,r.h);});\n    g.hole.water.forEach(function(r){c.fillStyle='#1b6fd0';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='rgba(180,220,255,.6)';c.lineWidth=3;\n      for(var y=r.y+24;y<r.y+r.h;y+=40){c.beginPath();c.moveTo(ox+r.x+10,oy+y);c.quadraticCurveTo(ox+r.x+r.w/2,oy+y-10,ox+r.x+r.w-10,oy+y);c.stroke();}});\n    // tee and hole\n    c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(ox+g.hole.tee.x,oy+g.hole.tee.y,22,0,Math.PI*2);c.fill();\n    c.fillStyle='#050807';c.beginPath();c.arc(ox+g.hole.hole.x,oy+g.hole.hole.y,HOLE_R,0,Math.PI*2);c.fill();\n    c.strokeStyle='#e9f6ee';c.lineWidth=5;c.beginPath();c.moveTo(ox+g.hole.hole.x,oy+g.hole.hole.y);c.lineTo(ox+g.hole.hole.x,oy+g.hole.hole.y-110);c.stroke();\n    c.fillStyle='#ff5d73';c.beginPath();c.moveTo(ox+g.hole.hole.x,oy+g.hole.hole.y-110);c.lineTo(ox+g.hole.hole.x+52,oy+g.hole.hole.y-90);c.lineTo(ox+g.hole.hole.x,oy+g.hole.hole.y-70);c.fill();\n    g.hole.walls.forEach(function(r){c.fillStyle='#b98a52';c.fillRect(ox+r.x,oy+r.y,r.w,r.h);c.strokeStyle='#6df0a0';c.lineWidth=3;c.strokeRect(ox+r.x+1,oy+r.y+1,r.w-2,r.h-2);});\n    // aim guide\n    var b=g.ball;\n    if(g.state==='aim'||g.state==='idle'){\n      var len=130+g.charge*260;c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=6;c.setLineDash([16,14]);\n      c.beginPath();c.moveTo(ox+b.x,oy+b.y);c.lineTo(ox+b.x+Math.cos(g.aim)*len,oy+b.y+Math.sin(g.aim)*len);c.stroke();c.setLineDash([]);\n      var ax=ox+b.x+Math.cos(g.aim)*len,ay=oy+b.y+Math.sin(g.aim)*len;\n      c.fillStyle='#fff';c.beginPath();c.moveTo(ax+Math.cos(g.aim)*24,ay+Math.sin(g.aim)*24);\n      c.lineTo(ax+Math.cos(g.aim+2.5)*20,ay+Math.sin(g.aim+2.5)*20);c.lineTo(ax+Math.cos(g.aim-2.5)*20,ay+Math.sin(g.aim-2.5)*20);c.fill();\n    }\n    // ball\n    var sc=g.state==='sink'?Math.max(0.1,1-g.sinkT/0.5):1;\n    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(ox+b.x+3,oy+b.y+6,R*sc,R*0.6*sc,0,0,Math.PI*2);c.fill();\n    c.fillStyle='#ffffff';c.beginPath();c.arc(ox+b.x,oy+b.y,R*sc,0,Math.PI*2);c.fill();\n    c.fillStyle='#d6dde8';c.beginPath();c.arc(ox+b.x-4,oy+b.y-4,R*0.35*sc,0,Math.PI*2);c.fill();\n    // power bar\n    if(G.phase==='act'){\n      var x0=290,y0=1000,w=600,h=34;\n      c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-12,w+24,h+24);\n      c.fillStyle='#16322b';c.fillRect(x0,y0,w,h);\n      var gr=c.createLinearGradient(x0,0,x0+w,0);gr.addColorStop(0,'#6df0a0');gr.addColorStop(0.6,'#ffcf5a');gr.addColorStop(1,'#ff6b81');\n      c.fillStyle=gr;c.fillRect(x0,y0,w*g.charge,h);\n      c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n      c.fillText(g.charging?'Let go to swing':'Hold Space to charge',x0+w/2,y0-22);\n    }\n  },\n  resultText:function(G,score){return 'You sank '+G.g.holes+' hole'+(G.g.holes===1?'':'s')+' \u00b7 Score '+score;}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "cs": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Turbo Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Turbo Lab: 2D car soccer against a CPU rival. The game never stops while you answer.\n   Correct answers fill your boost. Drive with the arrow keys (or A, D, W), hold Space to boost. */\n(function(){\n'use strict';\nvar AL=60,AR=1120,FLOOR=920,CEIL=270,GOAL_H=240,BALL_R=36,GRAV=1500,CAR_G=1900;\nvar API=null;\n\nfunction newCar(x,face,isAI){return {x:x,y:FLOOR,vx:0,vy:0,face:face,boost:isAI?60:50,air:false,jumps:0,ai:!!isAI,boosting:false,tAI:0,dir:0,jump:false};}\nfunction kickoff(g){\n  g.ball={x:(AL+AR)/2,y:FLOOR-320,vx:0,vy:0,spin:0};\n  g.p=newCar(AL+260,1,false);g.c=newCar(AR-260,-1,true);\n  g.p.boost=g.keepBoost;g.hold=1.2;\n}\nfunction carCircles(c){\n  var f=c.face;return [{x:c.x+f*28,y:c.y-24,r:26},{x:c.x-f*26,y:c.y-24,r:26},{x:c.x+f*4,y:c.y-52,r:20}];\n}\nfunction driveCar(c,g,dt){\n  var maxV=c.boosting?980:(c.ai?430:520),acc=c.air?900:2600;\n  if(c.dir){c.vx+=c.dir*acc*dt;c.face=c.dir;}\n  else if(!c.air)c.vx*=Math.exp(-4*dt);\n  if(c.boosting&&c.boost>0){c.vx+=c.face*3800*dt;c.boost=Math.max(0,c.boost-30*dt);}\n  else c.boosting=false;\n  c.vx=Math.max(-maxV,Math.min(maxV,c.vx));\n  if(c.jump){if(!c.air){c.vy=-780;c.air=true;c.jumps=1;}else if(c.jumps<2){c.vy=-580;c.jumps=2;}c.jump=false;}\n  c.vy+=CAR_G*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;\n  if(c.y>=FLOOR){c.y=FLOOR;c.vy=0;c.air=false;c.jumps=0;}\n  if(c.y<CEIL+50){c.y=CEIL+50;c.vy=Math.max(0,c.vy);}\n  c.x=Math.max(AL+50,Math.min(AR-50,c.x));\n}\nfunction thinkAI(c,g,dt){\n  c.tAI-=dt;if(c.tAI>0)return;c.tAI=0.14;\n  var b=g.ball,behind=c.x>b.x+30;               // CPU attacks the LEFT goal, so it wants to be to the right of the ball\n  var target=behind?b.x+16:b.x+190;\n  var dx=target-c.x;\n  c.dir=Math.abs(dx)<26?0:(dx>0?1:-1);\n  c.boosting=behind&&Math.abs(b.x-c.x)>260&&c.boost>25&&c.dir===-1;\n  if(!c.air&&Math.abs(b.x-c.x)<170&&b.y<FLOOR-120&&Math.random()<0.5)c.jump=true;\n  if(!behind&&c.x<AR-60&&Math.random()<0.03)c.jump=false;\n}\nfunction ballStep(g,dt){\n  var b=g.ball;\n  b.vy+=GRAV*dt;b.vx*=Math.exp(-0.12*dt);\n  b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=b.vx*dt/BALL_R;\n  var inGoalY=b.y>FLOOR-GOAL_H;\n  if(b.y>FLOOR-BALL_R){b.y=FLOOR-BALL_R;if(b.vy>0)b.vy=-b.vy*0.72;if(Math.abs(b.vy)<60)b.vy=0;b.vx*=Math.exp(-0.35*dt);}\n  if(b.y<CEIL+BALL_R){b.y=CEIL+BALL_R;b.vy=Math.abs(b.vy)*0.6;}\n  if(!inGoalY||b.y<FLOOR-GOAL_H+BALL_R*0.2){\n    if(b.x<AL+BALL_R&&b.y<FLOOR-GOAL_H){b.x=AL+BALL_R;b.vx=Math.abs(b.vx)*0.75;}\n    if(b.x>AR-BALL_R&&b.y<FLOOR-GOAL_H){b.x=AR-BALL_R;b.vx=-Math.abs(b.vx)*0.75;}\n  }\n  var sp=Math.hypot(b.vx,b.vy);if(sp>1500){b.vx*=1500/sp;b.vy*=1500/sp;}\n  [g.p,g.c].forEach(function(car){\n    carCircles(car).forEach(function(k){\n      var dx=b.x-k.x,dy=b.y-k.y,d=Math.hypot(dx,dy),m=k.r+BALL_R;\n      if(d>=m||d<1e-6)return;\n      var nx=dx/d,ny=dy/d;b.x=k.x+nx*(m+0.5);b.y=k.y+ny*(m+0.5);\n      var rvx=b.vx-car.vx,rvy=b.vy-car.vy,vn=rvx*nx+rvy*ny;\n      if(vn<0){var j=-(1+0.85)*vn,boostK=car.boosting?1.2:1;b.vx+=nx*j*boostK+car.vx*0.25;b.vy+=ny*j*boostK-60;API.SND.soft();}\n    });\n  });\n}\nfunction goalCheck(G,api){\n  var g=G.g,b=g.ball;\n  if(g.hold>0)return;\n  if(b.x>AR+BALL_R*0.6&&b.y>FLOOR-GOAL_H){G.you+=1;g.score='you';}\n  else if(b.x<AL-BALL_R*0.6&&b.y>FLOOR-GOAL_H){G.rival+=1;g.score='cpu';}\n  else return;\n  g.keepBoost=g.p.boost;\n  if(g.score==='you'){api.popup(590,520,'GOAL!','#4be39a');api.burst(AR-80,FLOOR-120,60);api.SND.swish();api.shake(0.25);}\n  else{api.popup(590,520,'They scored','#ff6b81');api.SND.bad();}\n  g.hold=1.6;g.after=true;api.hud();\n}\n\nAPI=Arcade.create({\n  prefix:'cs',gameId:'cs',title:'Turbo Lab',\n  how:'Answer correctly to earn play time and boost. Press \u2190 \u2192 to drive, \u2191 to jump, and hold Space to boost.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['You','CPU'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ff9f43','--cyan':'#4de2ff','--bg':'#070a14','--line':'#2a3f7a'},\n  progression:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],pattern:[0,1,2,1,2,1,0,2],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,FLOOR);g.addColorStop(0,'#070b1b');g.addColorStop(1,'#101a3a');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.strokeStyle='rgba(77,226,255,.08)';c.lineWidth=2;\n    for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,CEIL);c.lineTo(x,FLOOR);c.stroke();}\n    for(var y=CEIL;y<FLOOR;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(1180,y);c.stroke();}\n    c.fillStyle='#10223f';c.fillRect(0,FLOOR,1180,160);\n    c.fillStyle='#2f5fb0';c.fillRect(0,FLOOR,1180,8);\n    c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=4;c.beginPath();c.moveTo(590,CEIL);c.lineTo(590,FLOOR);c.stroke();\n    c.beginPath();c.arc(590,FLOOR,140,Math.PI,2*Math.PI);c.stroke();\n    // arena frame and goals\n    c.strokeStyle='#4de2ff';c.lineWidth=8;c.strokeRect(AL,CEIL,AR-AL,FLOOR-CEIL);\n    c.fillStyle='rgba(255,159,67,.25)';c.fillRect(0,FLOOR-GOAL_H,AL,GOAL_H);c.fillRect(AR,FLOOR-GOAL_H,1180-AR,GOAL_H);\n    c.strokeStyle='#ff9f43';c.lineWidth=8;c.beginPath();c.moveTo(0,FLOOR-GOAL_H);c.lineTo(AL,FLOOR-GOAL_H);c.moveTo(AR,FLOOR-GOAL_H);c.lineTo(1180,FLOOR-GOAL_H);c.stroke();\n    c.strokeStyle='rgba(255,159,67,.45)';c.lineWidth=2;\n    for(var n=0;n<=AL;n+=15){c.beginPath();c.moveTo(n,FLOOR-GOAL_H);c.lineTo(n,FLOOR);c.moveTo(AR+n,FLOOR-GOAL_H);c.lineTo(AR+n,FLOOR);c.stroke();}\n  },\n  init:function(G){G.g={keepBoost:50,keys:{},score:null,after:false};kickoff(G.g);},\n  heat:function(G){return G.g&&G.g.hold>0&&G.g.after===false?'Kickoff!':'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.p.boost=Math.min(100,g.p.boost+40);g.keepBoost=Math.max(g.keepBoost,g.p.boost);\n    api.popup(g.p.x,g.p.y-130,'+40 boost','#ffcf5a');\n    return {msg:'Boost +40. Hold Space to use it.'};\n  },\n  onWrong:function(G,api){\n    var g=G.g;g.p.boost=Math.max(0,g.p.boost-20);g.keepBoost=g.p.boost;\n    return {msg:'You lost 20 boost. The game keeps going, so get back in it!'};\n  },\n  onKeyDown:function(k,G){\n    var g=G.g,ks=g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n    if(k===' ')ks.b=true;\n    if(k==='ArrowUp'||k==='w'||k==='W')g.p.jump=true;\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n    if(k===' ')ks.b=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var n=Math.ceil(dt/0.008),h=dt/n;\n    g.p.dir=(g.keys.r?1:0)-(g.keys.l?1:0);g.p.boosting=!!g.keys.b&&g.p.boost>0;\n    if(g.hold>0){\n      g.hold-=dt;\n      if(g.hold<=0){if(g.after){g.after=false;g.score=null;kickoff(g);g.hold=1.0;}}\n      return;\n    }\n    g.c.boost=Math.min(100,g.c.boost+9*dt);\n    thinkAI(g.c,g,dt);\n    for(var i=0;i<n;i++){driveCar(g.p,g,h);driveCar(g.c,g,h);ballStep(g,h);}\n    g.c.jump=false;\n    goalCheck(G,api);\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    function car(k,color,glow){\n      c.save();c.translate(k.x,k.y);c.scale(k.face,1);\n      if(k.boosting&&k.boost>0){c.fillStyle='rgba(255,170,60,.9)';c.beginPath();c.moveTo(-50,-24);c.lineTo(-95-Math.random()*25,-20);c.lineTo(-50,-12);c.fill();}\n      c.fillStyle=color;c.beginPath();c.moveTo(-52,-16);c.lineTo(-52,-34);c.lineTo(-26,-38);c.lineTo(-10,-60);c.lineTo(24,-60);c.lineTo(36,-38);c.lineTo(54,-34);c.lineTo(54,-16);c.closePath();c.fill();\n      c.fillStyle='#bfeaff';c.beginPath();c.moveTo(-6,-40);c.lineTo(2,-55);c.lineTo(20,-55);c.lineTo(28,-40);c.closePath();c.fill();\n      c.fillStyle=glow;c.fillRect(-52,-30,104,5);\n      c.fillStyle='#0a0f1e';c.beginPath();c.arc(-30,-14,15,0,Math.PI*2);c.arc(32,-14,15,0,Math.PI*2);c.fill();\n      c.fillStyle='#9db0d6';c.beginPath();c.arc(-30,-14,6,0,Math.PI*2);c.arc(32,-14,6,0,Math.PI*2);c.fill();\n      c.restore();\n    }\n    car(g.c,'#ff5d73','#ffd1d8');car(g.p,'#2cc4f0','#d6f6ff');\n    var b=g.ball;\n    c.save();c.translate(b.x,b.y);c.rotate(b.spin);\n    c.fillStyle='#f4f7ff';c.beginPath();c.arc(0,0,BALL_R,0,Math.PI*2);c.fill();\n    c.fillStyle='#22305e';c.beginPath();\n    for(var i=0;i<5;i++){var a=i*Math.PI*2/5-Math.PI/2;c.lineTo(Math.cos(a)*14,Math.sin(a)*14);}c.fill();\n    c.strokeStyle='#22305e';c.lineWidth=3;c.beginPath();c.arc(0,0,BALL_R-2,0,Math.PI*2);c.stroke();\n    c.restore();\n    // boost meter\n    var x0=290,y0=990,w=600,h=34;\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-40,w+24,h+52);\n    c.fillStyle='#172447';c.fillRect(x0,y0,w,h);\n    var gr=c.createLinearGradient(x0,0,x0+w,0);gr.addColorStop(0,'#ff9f43');gr.addColorStop(1,'#ffe08a');\n    c.fillStyle=gr;c.fillRect(x0,y0,w*g.p.boost/100,h);\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='center';\n    c.fillText('Boost '+Math.round(g.p.boost)+'  \u00b7  answer questions to refill',x0+w/2,y0-12);\n    if(g.hold>0&&!g.after){c.fillStyle='rgba(8,12,28,.7)';c.font='800 120px \"Baloo 2\",Nunito,sans-serif';c.fillStyle='#eef3ff';c.fillText(g.hold>0.6?'Ready\u2026':'Go!',590,560);}\n  },\n  finalScore:function(G){return G.you*8+G.correct;},\n  resultText:function(G){return G.you>G.rival?'You win, '+G.you+' to '+G.rival+'!':G.you<G.rival?'CPU wins, '+G.rival+' to '+G.you+'.':'Tie game, '+G.you+' each!';}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n", "bb": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Burger Blaster \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Burger Blaster: hungry customers march toward your burger stand. A correct answer loads a burger.\n   Up and Down set the angle, Left and Right set the power, Space fires. The game never pauses while you answer. */\n(function(){\n'use strict';\nvar GROUND=900,GRAV=1500,BURGER_R=18,CUST_R=36,CANNON={x:170,y:GROUND-70},MAX_AMMO=5,STAND_X=250;\nvar API=null;\nvar MOODS=['#ffb86b','#ff8fb1','#8fd3ff','#b8f08f','#d3a8ff'];\n\nfunction v0(p){return 640+p*860;}\nfunction spawn(g){\n  var big=Math.random()<Math.min(0.35,0.08+g.spawned*0.012);\n  g.cust.push({x:1260,y:GROUND-CUST_R,r:big?46:CUST_R,hp:big?2:1,max:big?2:1,speed:(big?32:44)+Math.random()*26+Math.min(30,g.spawned*1.2),\n    col:MOODS[Math.floor(Math.random()*MOODS.length)],state:'walk',t:0,hit:0,ph:Math.random()*6});\n  g.spawned++;\n}\nfunction fire(G,api){\n  var g=G.g;if(g.ammo<=0||g.cool>0)return;\n  g.ammo--;g.cool=0.25;\n  var v=v0(g.power),a=g.angle;\n  g.burgers.push({x:CANNON.x+Math.cos(a)*90,y:CANNON.y-Math.sin(a)*90,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,bounces:0,hits:0,rot:0,alive:true});\n  api.SND.soft();api.shake(0.05);g.kick=0.2;\n}\nAPI=Arcade.create({\n  prefix:'bb',gameId:'bb',title:'Burger Blaster',\n  how:'Answer correctly to earn play time and burgers. Press \u2191 \u2193 to aim, \u2190 \u2192 for power, and Space to fire.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Fed','Grumpy'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#ffb13b','--cyan':'#ff7ab0','--bg':'#140a10','--panel2':'#1a0d16','--line':'#6a2d4d'},\n  progression:[[53,57,60],[48,52,55],[50,53,57],[55,59,62]],pattern:[0,2,1,2,0,1,2,1],beat:0.32,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#1b0c1f');g.addColorStop(1,'#3a1630');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='rgba(255,177,59,.10)';\n    for(var i=0;i<9;i++){c.beginPath();c.arc(70+i*135,250+(i%3)*40,6,0,Math.PI*2);c.fill();}\n    c.strokeStyle='rgba(255,122,176,.10)';c.lineWidth=2;for(var x=0;x<1180;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,GROUND);c.stroke();}\n    c.fillStyle='#4a2a22';c.fillRect(0,GROUND,1180,180);\n    c.fillStyle='#6d4033';c.fillRect(0,GROUND,1180,10);\n    c.fillStyle='rgba(0,0,0,.18)';for(var s=0;s<1180;s+=90)c.fillRect(s,GROUND+30,50,8);\n    // burger stand\n    c.fillStyle='#7a2f3f';c.fillRect(20,GROUND-250,STAND_X-20,250);\n    c.fillStyle='#ffcf5a';for(var k=0;k<6;k++){c.fillRect(20+k*(STAND_X-20)/6,GROUND-290,(STAND_X-20)/6,46);c.fillStyle=k%2?'#ffcf5a':'#ff5d73';}\n    c.fillStyle='#2a0f1a';c.fillRect(46,GROUND-190,STAND_X-72,120);\n    c.fillStyle='#ffcf5a';c.font='800 34px \"Baloo 2\",Nunito,sans-serif';c.textAlign='center';c.fillText('BURGERS',(20+STAND_X)/2,GROUND-212);\n  },\n  init:function(G){G.g={ammo:2,angle:0.9,power:0.6,cust:[],burgers:[],spawned:0,spawnT:1.5,cool:0,keys:{},kick:0,fed:0,happy:[]};},\n  heat:function(G){return G.g&&G.g.fedStreak>=3?'Combo x'+G.g.fedStreak:'';},\n  onCorrect:function(G,api){\n    var g=G.g;g.ammo=Math.min(MAX_AMMO,g.ammo+1);api.popup(CANNON.x,CANNON.y-170,'+1 burger','#ffcf5a');\n    return {msg:'Burger loaded. Press Space to fire!'};\n  },\n  onWrong:function(G,api){\n    var g=G.g;if(g.ammo>0)g.ammo--;\n    return {msg:'You dropped a burger. The line keeps moving, so keep going!'};\n  },\n  onKeyDown:function(k,G,api){\n    var g=G.g,ks=g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=true;\n    if(k==='ArrowDown'||k==='s'||k==='S')ks.d=true;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=true;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=true;\n    if(k===' ')fire(G,api);\n  },\n  onKeyUp:function(k,G){\n    var ks=G.g.keys;\n    if(k==='ArrowUp'||k==='w'||k==='W')ks.u=false;\n    if(k==='ArrowDown'||k==='s'||k==='S')ks.d=false;\n    if(k==='ArrowLeft'||k==='a'||k==='A')ks.l=false;\n    if(k==='ArrowRight'||k==='d'||k==='D')ks.r=false;\n  },\n  update:function(dt,G,api,running){\n    var g=G.g;if(!g||!running)return;\n    var ks=g.keys;\n    g.angle=Math.max(0.2,Math.min(1.45,g.angle+((ks.u?1:0)-(ks.d?1:0))*0.9*dt));\n    g.power=Math.max(0.25,Math.min(1,g.power+((ks.r?1:0)-(ks.l?1:0))*0.6*dt));\n    if(g.cool>0)g.cool-=dt;if(g.kick>0)g.kick-=dt;\n    // customers arrive faster as the round goes on\n    g.spawnT-=dt;if(g.spawnT<=0){spawn(g);g.spawnT=Math.max(2.4,4.8-g.spawned*0.07)+Math.random()*1.2;}\n    g.cust.forEach(function(c){\n      c.t+=dt;\n      if(c.state==='walk'){c.x-=c.speed*dt;if(c.x<STAND_X+c.r){c.state='grumpy';c.t=0;G.rival++;g.fedStreak=0;api.popup(STAND_X+40,GROUND-130,'Grumpy!','#ff7ab0');api.SND.bad();api.hud();}}\n      else if(c.state==='fed'){c.y-=160*dt;c.x+=40*dt;}\n      else if(c.state==='grumpy'){c.x-=140*dt;}\n      if(c.hit>0)c.hit-=dt;\n    });\n    g.cust=g.cust.filter(function(c){return !((c.state==='fed'&&c.t>1.1)||(c.state==='grumpy'&&c.x<-80));});\n    // burger physics\n    g.burgers.forEach(function(b){\n      var n=Math.ceil(dt/0.01),h=dt/n;\n      for(var i=0;i<n&&b.alive;i++){\n        b.vy+=GRAV*h;b.x+=b.vx*h;b.y+=b.vy*h;b.rot+=b.vx*h*0.01;\n        if(b.y>GROUND-BURGER_R){b.y=GROUND-BURGER_R;b.vy=-b.vy*0.5;b.vx*=0.8;b.bounces++;if(b.bounces>3||Math.abs(b.vy)<40)b.alive=false;}\n        if(b.x>1300||b.x<-100)b.alive=false;\n        for(var j=0;j<g.cust.length;j++){\n          var c=g.cust[j];if(c.state!=='walk'||c.hit>0.12)continue;\n          if(Math.hypot(b.x-c.x,b.y-c.y)<c.r+BURGER_R){\n            c.hp--;c.hit=0.25;b.hits++;\n            var nx=(b.x-c.x),ny=(b.y-c.y),d=Math.hypot(nx,ny)||1;\n            b.vx=nx/d*Math.hypot(b.vx,b.vy)*0.5+80;b.vy=-380;\n            if(c.hp<=0){\n              c.state='fed';c.t=0;g.fed++;g.fedStreak=(g.fedStreak||0)+1;\n              var pts=(c.max===2?4:2)+(b.hits-1)*2;G.you+=pts;\n              api.popup(c.x,c.y-70,'+'+pts+(b.hits>1?' Combo!':''),b.hits>1?'#ff7ab0':'#ffcf5a');\n              api.burst(c.x,c.y-20,b.hits>1?44:20);b.hits>1?api.SND.swish():api.SND.nice();api.hud();\n            }else{api.popup(c.x,c.y-80,'Still hungry!','#ffb86b');api.SND.soft();}\n            break;\n          }\n        }\n      }\n    });\n    g.burgers=g.burgers.filter(function(b){return b.alive;});\n  },\n  render:function(c,dt,G,api){\n    var g=G.g;if(!g)return;\n    // customers\n    g.cust.forEach(function(k){\n      var bob=k.state==='walk'?Math.abs(Math.sin(k.t*7+k.ph))*10:0,y=k.y-bob;\n      c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(k.x,GROUND+4,k.r*0.9,9,0,0,Math.PI*2);c.fill();\n      c.fillStyle=k.state==='grumpy'?'#c9667a':k.col;c.beginPath();c.arc(k.x,y,k.r,0,Math.PI*2);c.fill();\n      if(k.hit>0){c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.arc(k.x,y,k.r+4,0,Math.PI*2);c.stroke();}\n      c.fillStyle='#1b0c1f';c.beginPath();c.arc(k.x-k.r*0.32,y-k.r*0.22,k.r*0.11,0,Math.PI*2);c.arc(k.x+k.r*0.32,y-k.r*0.22,k.r*0.11,0,Math.PI*2);c.fill();\n      c.strokeStyle='#1b0c1f';c.lineWidth=4;c.beginPath();\n      if(k.state==='fed'){c.arc(k.x,y+k.r*0.05,k.r*0.4,0.15,Math.PI-0.15);}\n      else if(k.state==='grumpy'){c.arc(k.x,y+k.r*0.55,k.r*0.3,Math.PI+0.3,2*Math.PI-0.3);}\n      else{c.ellipse(k.x,y+k.r*0.3,k.r*0.22,k.r*0.3,0,0,Math.PI*2);}\n      c.stroke();\n      if(k.max===2&&k.state==='walk'){for(var i=0;i<k.hp;i++){c.fillStyle='#ffcf5a';c.beginPath();c.arc(k.x-14+i*28,y-k.r-18,9,0,Math.PI*2);c.fill();}}\n      if(k.state==='fed'){c.fillStyle='#ff7ab0';c.font='800 40px Nunito,sans-serif';c.textAlign='center';c.fillText('\u2665',k.x,y-k.r-12);}\n    });\n    // cannon\n    var a=g.angle;\n    c.fillStyle='#6a2d4d';c.beginPath();c.arc(CANNON.x,CANNON.y+10,50,0,Math.PI*2);c.fill();\n    c.save();c.translate(CANNON.x,CANNON.y);c.rotate(-a);\n    var recoil=g.kick>0?-g.kick*40:0;\n    c.fillStyle='#ffb13b';c.fillRect(recoil,-24,96,48);c.fillStyle='#ff7ab0';c.fillRect(80+recoil,-30,24,60);c.restore();\n    c.fillStyle='#2a0f1a';c.fillRect(CANNON.x-60,CANNON.y+40,120,GROUND-CANNON.y-40);\n    // aim preview\n    var v=v0(g.power),px=CANNON.x+Math.cos(a)*90,py=CANNON.y-Math.sin(a)*90,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;\n    c.fillStyle='rgba(255,255,255,.8)';\n    for(var s=0;s<26;s++){var t=s*0.055,x=px+vx*t,y=py+vy*t+0.5*GRAV*t*t;if(y>GROUND-10)break;c.beginPath();c.arc(x,y,s<3?3:5,0,Math.PI*2);c.fill();}\n    // burgers\n    g.burgers.forEach(function(b){drawBurger(c,b.x,b.y,b.rot,1);});\n    // ammo and aim readout\n    var x0=290,y0=990;\n    c.fillStyle='rgba(8,12,28,.9)';c.fillRect(x0-12,y0-48,624,92);\n    for(var m=0;m<MAX_AMMO;m++){if(m<g.ammo)drawBurger(c,x0+30+m*58,y0-12,0,0.9);else{c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=3;c.beginPath();c.arc(x0+30+m*58,y0-12,16,0,Math.PI*2);c.stroke();}}\n    c.fillStyle='#eef3ff';c.font='800 26px Nunito,sans-serif';c.textAlign='left';\n    c.fillText('Angle '+Math.round(a*180/Math.PI)+'\u00b0   Power '+Math.round(g.power*100),x0+312,y0-4);\n    c.textAlign='center';c.fillStyle='#9db0d6';c.font='800 22px Nunito,sans-serif';\n    c.fillText(g.ammo>0?'Space fires a burger':'Answer a question to load a burger',x0+300,y0+30);\n  },\n  finalScore:function(G){return Math.max(0,G.you-G.rival);},\n  resultText:function(G){return 'You fed '+G.g.fed+' customer'+(G.g.fed===1?'':'s')+' \u00b7 '+G.rival+' left grumpy';}\n});\nfunction drawBurger(c,x,y,rot,s){\n  c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);\n  c.fillStyle='#e0953b';c.beginPath();c.ellipse(0,-8,19,12,0,Math.PI,2*Math.PI);c.fill();\n  c.fillStyle='#6fcf4f';c.fillRect(-19,-8,38,5);\n  c.fillStyle='#6a2d1a';c.fillRect(-18,-3,36,7);\n  c.fillStyle='#e0953b';c.beginPath();c.ellipse(0,5,17,8,0,0,Math.PI);c.fill();\n  c.restore();\n}\n})();\n<\/script>\n<\/body>\n<\/html>\n", "sn": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex\">\n<title>Snake Lab \u2013 Sikes Arcade<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n<!--CSS-->\n<\/head>\n<body>\n<div id=\"stage\"><\/div>\n<!--JS:questions.js-->\n<!--JS:scorecode.js-->\n<!--JS:arcade.js-->\n<script>\n/* Snake Lab: a snake arena with two CPU rival snakes. The game never stops while you answer.\n   Steer with the arrow keys (or WASD). A correct answer gives you a shield and drops a golden apple. */\n(function(){\n'use strict';\nvar COLS=24,ROWS=19,CELL=40,OX=110,OY=200;\nvar API=null;\nvar DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};\n\nfunction rnd(n){return Math.floor(Math.random()*n);}\nfunction mk(x,y,d,len,ai,col){\n  var body=[];for(var i=0;i<len;i++)body.push({x:x-d.x*i,y:y-d.y*i});\n  return {body:body,dir:d,queue:[],t:ai?0:-0.9,ai:ai,col:col,grow:0,dead:0,spd:ai?0.20:0.14};\n}\nfunction occupied(g,x,y,skipSnake){\n  for(var i=0;i<g.snakes.length;i++){\n    var s=g.snakes[i];if(s.dead>0)continue;\n    var n=s.body.length-((s===skipSnake&&s.grow<=0)?1:0);          // the tail cell is about to move away\n    for(var j=0;j<n;j++)if(s.body[j].x===x&&s.body[j].y===y)return true;\n  }\n  return false;\n}\nfunction freeCell(g){\n  for(var k=0;k<200;k++){var x=rnd(COLS),y=rnd(ROWS);\n    if(occupied(g,x,y,null))continue;\n    if(g.food.some(function(f){return f.x===x&&f.y===y;}))continue;\n    return {x:x,y:y};}\n  return {x:0,y:0};\n}\nfunction addFood(g,gold){var c=freeCell(g);g.food.push({x:c.x,y:c.y,gold:!!gold,ttl:gold?12:0});}\nfunction respawnPlayer(g){\n  var s=g.snakes[0],c=Math.floor(COLS/2),r=Math.floor(ROWS/2);\n  s.body=[];for(var i=0;i<4;i++)s.body.push({x:c-i,y:r});s.dir=DIRS.right;s.queue=[];s.t=-0.9;s.grow=0;\n}\nfunction respawnAI(g,s){\n  for(var k=0;k<100;k++){var x=3+rnd(COLS-6),y=3+rnd(ROWS-6);\n    if(!occupied(g,x,y,null)&&!occupied(g,x-1,y,null)&&!occupied(g,x-2,y,null)){\n      s.body=[{x:x,y:y},{x:x-1,y:y},{x:x-2,y:y}];s.dir=DIRS.right;s.grow=1;s.dead=0;return;}}\n  s.dead=1;\n}\nfunction blocked(g,s,x,y){return x<0||y<0||x>=COLS||y>=ROWS||occupied(g,x,y,s);}\nfunction think(g,s){\n  var h=s.body[0],opts=[s.dir,{x:s.dir.y,y:-s.dir.x},{x:-s.dir.y,y:s.dir.x}];\n  var ok=opts.filter(function(d){return !blocked(g,s,h.x+d.x,h.y+d.y);});\n  if(!ok.length){s.dead=2.5;return;}\n  var best=ok[0],bd=1e9,target=g.food[0]||{x:COLS/2,y:ROWS/2};\n  g.food.forEach(function(f){if(Math.abs(f.x-h.x)+Math.abs(f.y-h.y)<Math.abs(target.x-h.x)+Math.abs(target.y-h.y))target=f;});\n  ok.forEach(function(d){var dist=Math.abs(target.x-(h.x+d.x))+Math.abs(target.y-(h.y+d.y));if(dist<bd){bd=dist;best=d;}});\n  s.dir=Math.random()<0.1?ok[rnd(ok.length)]:best;\n}\nfunction crash(G,api,g,s){\n  var h=s.body[0];\n  if(s.ai){api.burst(OX+h.x*CELL+20,OY+h.y*CELL+20,16);s.dead=3;return;}\n  G.you=Math.max(0,G.you-3);api.hud();api.popup(OX+h.x*CELL+20,OY+h.y*CELL-10,'Crash! \u22123','#ff5fa8');api.SND.bad();api.shake(0.2);\n  respawnPlayer(g);\n}\nfunction stepSnake(G,api,g,s){\n  if(s.ai)think(g,s);\n  else if(s.queue.length)s.dir=s.queue.shift();\n  if(s.dead>0)return;\n  var h=s.body[0],nx=h.x+s.dir.x,ny=h.y+s.dir.y,wall=nx<0||ny<0||nx>=COLS||ny>=ROWS;\n  if(wall||occupied(g,nx,ny,s)){\n    if(!s.ai&&g.shield>0){\n      g.shield--;G.rival=g.shield;api.hud();api.popup(OX+h.x*CELL+20,OY+h.y*CELL-10,'Shield!','#6ee7ff');api.SND.swish();\n      nx=(nx+COLS)%COLS;ny=(ny+ROWS)%ROWS;\n    }else{crash(G,api,g,s);return;}\n  }\n  s.body.unshift({x:nx,y:ny});\n  for(var i=g.food.length-1;i>=0;i--){var f=g.food[i];\n    if(f.x===nx&&f.y===ny){\n      g.food.splice(i,1);\n      if(f.gold){s.grow+=3;if(!s.ai){G.you+=3;api.popup(OX+nx*CELL+20,OY+ny*CELL,'+3 Golden!','#ffcf5a');api.burst(OX+nx*CELL+20,OY+ny*CELL+20,30);api.SND.swish();}}\n      else{s.grow+=1;if(!s.ai){G.you+=1;api.popup(OX+nx*CELL+20,OY+ny*CELL,'+1','#9bff5a');api.SND.soft();}}\n      if(!s.ai)api.hud();\n      if(!f.gold)addFood(g,false);\n    }\n  }\n  if(s.grow>0)s.grow--;else s.body.pop();\n}\nfunction segs(c,s,color,head){\n  for(var i=s.body.length-1;i>=0;i--){\n    var b=s.body[i],x=OX+b.x*CELL,y=OY+b.y*CELL,pad=i===0?2:5;\n    c.fillStyle=i===0?head:color;c.beginPath();c.roundRect?c.roundRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2,10):c.rect(x+pad,y+pad,CELL-pad*2,CELL-pad*2);c.fill();\n  }\n  var h=s.body[0],d=s.dir,cx=OX+h.x*CELL+20,cy=OY+h.y*CELL+20,px=-d.y,py=d.x;\n  c.fillStyle='#0a1a0e';\n  c.beginPath();c.arc(cx+d.x*6+px*8,cy+d.y*6+py*8,4,0,Math.PI*2);c.arc(cx+d.x*6-px*8,cy+d.y*6-py*8,4,0,Math.PI*2);c.fill();\n}\n\nAPI=Arcade.create({\n  prefix:'sn',gameId:'sn',title:'Snake Lab',\n  how:'Answer correctly to earn play time, shields and golden apples. Steer with the arrow keys.',\n  mode:'live',gated:true,earnSeconds:12,playCap:30,hud:['Score','Shields'],roundSeconds:240,wrongPenalty:0,\n  theme:{'--ball':'#9bff5a','--cyan':'#ff5fa8','--bg':'#07110a','--panel2':'#0a1a10','--line':'#2b6a3c'},\n  progression:[[52,55,59],[48,52,55],[50,54,57],[47,52,55]],pattern:[0,2,1,2,1,2,0,2],beat:0.30,\n  drawBg:function(c){\n    var g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#05100a');g.addColorStop(1,'#0a2014');c.fillStyle=g;c.fillRect(0,0,1180,1080);\n    c.fillStyle='#0e2a18';c.fillRect(OX-12,OY-12,COLS*CELL+24,ROWS*CELL+24);\n    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){c.fillStyle=(x+y)%2?'#10331e':'#0c2a18';c.fillRect(OX+x*CELL,OY+y*CELL,CELL,CELL);}\n    c.strokeStyle='#9bff5a';c.lineWidth=5;c.strokeRect(OX-3,OY-3,COLS*CELL+6,ROWS*CELL+6);\n  },\n  init:function(G){\n    var g=G.g={snakes:[],food:[],shield:0,keys:{}};\n    g.snakes
