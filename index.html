<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sikes Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--panel:#0f1730;--line:#26396f;--ink:#eef3ff;--dim:#9db0d6;--accent:#ff8a3d;--cyan:#38d6ff;--mint:#4be39a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03050b;color:var(--ink);overflow:hidden;font-family:'Nunito','Trebuchet MS',Arial,sans-serif;font-weight:600}
button{font-family:inherit;color:inherit}
.hidden{display:none !important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(1200px 700px at 20% -10%,#14204a 0%,var(--bg) 60%)}

/* header */
#top{position:absolute;left:64px;top:30px;right:64px;display:flex;align-items:baseline;justify-content:space-between}
#top h1{font-family:'Baloo 2','Nunito',sans-serif;font-size:92px;font-weight:800;line-height:1;color:var(--accent)}
#top .by{font-size:32px;color:var(--dim);display:flex;align-items:center;gap:22px}
.nav{background:#101a3a;border:3px solid #26396f;border-radius:22px;padding:4px 28px 6px;font-size:34px;font-weight:800;cursor:pointer;color:var(--dim)}
.nav.on{border-color:var(--cyan);color:var(--ink);background:#14305a}
.step{position:absolute;left:64px;font-size:34px;font-weight:800;color:var(--cyan)}
.step span{display:inline-block;width:46px;height:46px;border-radius:50%;background:#1b2a5a;text-align:center;line-height:46px;margin-right:14px;font-size:28px}

/* games */
#games{position:absolute;left:64px;top:184px;width:1792px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.gcard{background:#101a3a;border:4px solid #26396f;border-radius:22px;padding:10px 14px;cursor:pointer;text-align:left;height:150px;
  overflow:hidden;transition:border-color .15s,background .15s;display:flex;flex-direction:row;align-items:center;gap:14px}
.gcard svg{width:180px;flex:0 0 180px;height:auto;display:block;border-radius:12px}
.gcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gcard .nm{font-family:'Baloo 2','Nunito',sans-serif;font-size:32px;font-weight:800;line-height:1.05}
.gcard .ds{font-size:20px;color:var(--dim);line-height:1.2}
.gcard .top{font-size:19px;font-weight:800;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .top.none{color:#6f82b3}
.gcard:hover{border-color:#4a63ad}
.gcard.on{border-color:var(--accent);background:#2a2036}
.gcard.on .nm{color:var(--accent)}

/* skills */
#skills{position:absolute;left:64px;top:588px;width:1180px}
#tabs{display:flex;gap:14px;margin:0 0 16px 0}
.tab{background:#101a3a;border:3px solid #26396f;border-radius:22px;padding:6px 30px;font-size:32px;font-weight:800;cursor:pointer;color:var(--dim)}
.tab.on{border-color:var(--cyan);color:var(--ink);background:#14305a}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.scard{background:#101a3a;border:3px solid #26396f;border-radius:20px;padding:10px 16px;cursor:pointer;text-align:left;
  height:124px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s,background .15s}
.scard .sn{font-size:26px;font-weight:800;line-height:1.1}
.scard .st{font-size:23px;color:var(--cyan);font-weight:800}
.scard:hover{border-color:#4a63ad}
.scard.on{border-color:var(--mint);background:#123a35}

/* summary and play */
#summary{position:absolute;left:1290px;top:588px;width:566px;height:440px;background:linear-gradient(#111b3b,#0b1228);
  border:3px solid var(--line);border-radius:28px;padding:24px 28px;display:flex;flex-direction:column;gap:10px}
#summary .lbl{font-size:26px;color:var(--dim);font-weight:800}
#pick-game{font-family:'Baloo 2','Nunito',sans-serif;font-size:48px;font-weight:800;line-height:1;color:var(--accent)}
#pick-skill{font-size:34px;font-weight:800;line-height:1.15}
#pick-skill small{display:block;font-size:26px;color:var(--cyan);margin-top:2px}
#chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:#16224a;border:3px solid #2b3d7a;border-radius:26px;padding:4px 18px;font-size:24px;font-weight:800;cursor:pointer;color:var(--dim)}
.chip.on{border-color:var(--mint);color:var(--ink);background:#143a35}
#play{margin-top:auto;border:0;border-radius:26px;background:var(--accent);color:#1d1004;font-family:'Baloo 2','Nunito',sans-serif;
  font-size:76px;font-weight:800;line-height:1;padding:8px 0 14px;cursor:pointer}
#play:hover{background:#ff9d5e}
#hint{font-size:22px;color:var(--dim);text-align:center}

/* leaderboard view */
#lbtabs{position:absolute;left:64px;top:150px;display:flex;gap:16px;align-items:center}
.ltab{background:#101a3a;border:4px solid #26396f;border-radius:24px;padding:8px 30px;font-family:'Baloo 2','Nunito',sans-serif;font-size:42px;font-weight:800;color:var(--dim);cursor:pointer}
.ltab.on{border-color:var(--accent);color:var(--ink);background:#2a2036}
#lbskill{position:absolute;left:64px;top:262px;display:flex;align-items:center;gap:16px;font-size:30px;color:var(--dim);font-weight:800}
#lbsel{height:64px;min-width:760px;border-radius:18px;border:3px solid #2b3d7a;background:#16224a;color:var(--ink);font-family:inherit;font-size:30px;font-weight:800;padding:0 18px}
#lbboard{position:absolute;left:64px;top:350px;width:1792px}
.lhdr,.lrow{display:grid;grid-template-columns:100px 430px 160px 730px 260px;align-items:center;padding:0 28px}
.lhdr{height:44px;font-size:26px;color:var(--dim);font-weight:800}
.lrow{height:62px;margin-bottom:7px;background:#101a3a;border:3px solid #1f2f66;border-radius:18px;font-size:32px;font-weight:800}
.lrow .rk{font-family:'Baloo 2','Nunito',sans-serif;font-size:42px;color:var(--dim)}
.lrow.r1{border-color:var(--gold, #ffcf5a)}.lrow.r1 .rk{color:#ffcf5a}.lrow.r2 .rk{color:#d6e2ff}.lrow.r3 .rk{color:#e8a56a}
.lrow .sc{color:var(--cyan)}.lrow .sk{font-size:26px;color:var(--dim);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lempty{margin-top:50px;font-size:42px;color:var(--dim);text-align:center}
#lbfoot{position:absolute;left:64px;bottom:22px;font-size:24px;color:var(--dim)}
/* preview mode only: game opens in a frame */
#frame{position:absolute;inset:0;background:#000;z-index:30}
#frame iframe{width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="stage">
  <div id="top"><h1>Sikes Arcade</h1><div class="by"><span>Made by Ms. Sikes</span><button class="nav on" id="nav-play" tabindex="-1">Play</button><button class="nav" id="nav-lb" tabindex="-1">Leaderboard</button></div></div>

  <div id="playView">
  <div class="step" style="top:142px"><span>1</span>Choose a game</div>
  <div id="games"></div>

  <div class="step" style="top:530px"><span>2</span>Choose a skill</div>
  <div id="skills"><div id="tabs"></div><div id="grid"></div></div>

  <div id="summary">
    <div class="lbl">Your game</div><div id="pick-game"></div>
    <div class="lbl">Your skill</div><div id="pick-skill"></div>
    <div id="chips"></div>
    <button id="play">Play</button>
    <div id="hint">Press Enter to play</div>
  </div>
  </div>
  <div id="lbView" class="hidden">
    <div id="lbtabs"></div>
    <div id="lbskill"><span>Skill</span><select id="lbsel"></select></div>
    <div id="lbboard"></div>
    <div id="lbfoot"></div>
  </div>
  <div id="frame" class="hidden"></div>
</div>

<script src="settings.js"></script>
<script src="leaderboard.js"></script>
<script>
/* =====================================================================
   SikesQ: the shared question bank for Sikes Arcade (games/questions.js)
   Every game loads this one file. SETS are append-only: score codes store
   each set's position in the list, so never reorder or delete a set.
   ===================================================================== */
var SikesQ=(function(){
'use strict';
var MINUS='\u2212';
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){return String(Math.round(Math.abs(n)*100)/100);}
function num(n){return (n<0?MINUS:'')+fmt(n);}
function plain(h){return String(h).replace(/<[^>]*>/g,'');}
function art(n){return (n===8||n===11||n===18)?'An':'A';}
function subs(f){return f.replace(/(\d+)/g,'<sub>$1</sub>');}

/* ---------- chemistry data + an independent formula parser ---------- */
var ELEM={H:'hydrogen',O:'oxygen',C:'carbon',N:'nitrogen',S:'sulfur',Ca:'calcium',Al:'aluminum',
          Mg:'magnesium',Na:'sodium',Fe:'iron',Cl:'chlorine'};
var FORMULAS=[
 {f:'H2O',c:{H:2,O:1}},{f:'CO2',c:{C:1,O:2}},{f:'NH3',c:{N:1,H:3}},{f:'CH4',c:{C:1,H:4}},
 {f:'H2SO4',c:{H:2,S:1,O:4}},{f:'HNO3',c:{H:1,N:1,O:3}},{f:'H2O2',c:{H:2,O:2}},
 {f:'Ca(OH)2',c:{Ca:1,O:2,H:2}},{f:'Al(OH)3',c:{Al:1,O:3,H:3}},
 {f:'Mg(NO3)2',c:{Mg:1,N:2,O:6}},{f:'Ca(NO3)2',c:{Ca:1,N:2,O:6}},
 {f:'Al2(SO4)3',c:{Al:2,S:3,O:12}},{f:'(NH4)2SO4',c:{N:2,H:8,S:1,O:4}},
 {f:'C6H12O6',c:{C:6,H:12,O:6}},{f:'NaHCO3',c:{Na:1,H:1,C:1,O:3}},{f:'Na2CO3',c:{Na:2,C:1,O:3}},
 {f:'CaCO3',c:{Ca:1,C:1,O:3}},{f:'Fe2O3',c:{Fe:2,O:3}},{f:'NaCl',c:{Na:1,Cl:1}}
];
FORMULAS.forEach(function(x){x.h=subs(x.f);});
function parseF(s,ignoreGroupMult){
  var i=0;
  function number(){var st=i;while(i<s.length&&/[0-9]/.test(s[i]))i++;return st===i?1:parseInt(s.slice(st,i),10);}
  function group(){
    var out={};
    while(i<s.length){
      var ch=s[i];
      if(ch==='('){i++;var inner=group();var n=number();if(ignoreGroupMult)n=1;
        for(var k in inner)out[k]=(out[k]||0)+inner[k]*n;}
      else if(ch===')'){i++;return out;}
      else if(/[A-Z]/.test(ch)){var sym=ch;i++;if(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++;}
        var m=number();out[sym]=(out[sym]||0)+m;}
      else i++;
    }
    return out;
  }
  return group();
}
function sumVals(o){var t=0;for(var k in o)t+=o[k];return t;}
function digitSum(f){var t=0,m=f.match(/\d+/g)||[];m.forEach(function(d){t+=parseInt(d,10);});return t;}

/* ---------- build one 4-choice question from a spec ---------- */
function build(spec){
  if(!spec)return null;
  if(!spec.check(spec.correct.val))return null;               // the right answer must pass the check
  var seen={};seen[spec.correct.html]=true;var pool=[];
  spec.wrongs.forEach(function(w){
    if(seen[w.html])return; seen[w.html]=true;
    if(spec.check(w.val))return;                               // a wrong choice may never pass
    pool.push(w);
  });
  if(pool.length<3)return null;
  pool=shuffle(pool).slice(0,3);
  var all=[{html:spec.correct.html,ok:true,why:''}].concat(pool.map(function(w){return {html:w.html,ok:false,why:w.why};}));
  all=shuffle(all);all.forEach(function(c,i){c.key=String(i+1);});
  return {topic:spec.topic,prompt:spec.prompt,choices:all,explain:spec.explain||'',visual:spec.visual||null};
}

/* ---------- generic generators for concept questions ----------
   labelGen: the 4 (or 5) choices are always the same labels; item = [question, answerLabel, explanation]
   bankGen:  each item carries its own wrong answers; item = [question, right, explanation, [[wrong, why], ...]] */
function labelGen(topic,items,labels,whyFn,lead){
  return function(){
    var it=pick(items),a=it[1];
    var wr=labels.filter(function(l){return l!==a;}).map(function(l){return {val:l,html:l,why:whyFn(l)};});
    return {topic:topic,prompt:(lead||'')+it[0],correct:{val:a,html:a},wrongs:wr,
      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'</b>.')};
  };
}
function bankGen(topic,items){
  return function(){
    var it=pick(items),a=it[1];
    var wr=it[3].map(function(w){return {val:w[0],html:w[0],why:w[1]};});
    return {topic:topic,prompt:it[0],correct:{val:a,html:a},wrongs:wr,
      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'</b>.')};
  };
}

/* ---------- small SVG helpers (380 x 380, dark theme) ---------- */
function svgOpen(){return '<svg viewBox="0 0 380 380" width="380" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial,sans-serif" font-size="17" font-weight="700">';}
function graphSVG(o){
  var W=380,H=380,L=64,R=14,T=14,B=62,pw=W-L-R,ph=H-T-B;
  function X(t){return L+t/o.xmax*pw;}
  function Y(d){return T+ph-d/o.ymax*ph;}
  var s=svgOpen(),i;
  for(i=0;i<=o.xmax;i+=o.xstep){s+='<line x1="'+X(i)+'" y1="'+T+'" x2="'+X(i)+'" y2="'+(T+ph)+'" stroke="#2b3d7a" stroke-width="1"/>';
    if(i%o.xlab===0)s+='<text x="'+X(i)+'" y="'+(T+ph+22)+'" fill="#eef3ff" text-anchor="middle">'+i+'</text>';}
  for(i=0;i<=o.ymax;i+=o.ystep){s+='<line x1="'+L+'" y1="'+Y(i)+'" x2="'+(L+pw)+'" y2="'+Y(i)+'" stroke="#2b3d7a" stroke-width="1"/>';
    if(i%o.ylab===0)s+='<text x="'+(L-8)+'" y="'+(Y(i)+6)+'" fill="#eef3ff" text-anchor="end">'+i+'</text>';}
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="#9db0d6" stroke-width="3"/>';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="#9db0d6" stroke-width="3"/>';
  s+='<text x="'+(L+pw/2)+'" y="'+(H-8)+'" fill="#9db0d6" text-anchor="middle">Time (s)</text>';
  s+='<text transform="translate(16,'+(T+ph/2)+') rotate(-90)" fill="#9db0d6" text-anchor="middle">Distance (m)</text>';
  (o.marks||[]).forEach(function(m){
    s+='<line x1="'+X(m.t)+'" y1="'+(T+ph)+'" x2="'+X(m.t)+'" y2="'+Y(m.d)+'" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 5"/>';
    s+='<line x1="'+L+'" y1="'+Y(m.d)+'" x2="'+X(m.t)+'" y2="'+Y(m.d)+'" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 5"/>';
  });
  o.lines.forEach(function(ln){
    var p=ln.pts.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);}).join(' ');
    s+='<polyline points="'+p+'" fill="none" stroke="'+ln.color+'" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
    if(ln.dots)ln.pts.forEach(function(q,k){if(k===0||k===ln.pts.length-1)s+='<circle cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="7" fill="'+ln.color+'"/>';});
    if(ln.label){var e=ln.pts[ln.pts.length-1];s+='<text x="'+(X(e[0])-8)+'" y="'+(Y(e[1])-10)+'" fill="'+ln.color+'" text-anchor="end" font-size="20">'+ln.label+'</text>';}
  });
  return s+'</svg>';
}

/* =====================================================================
   SET 0  Newton's Second Law (8.7A)
   ===================================================================== */
var OBJ=['cart','wagon','sled','skateboard','crate','lab trolley','toy car','shopping cart'];
function gAccel(){
  var m=pick([2,3,4,5,6,8,10,12,15,20]),a=rnd(2,9),F=m*a,o=pick(OBJ),wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' m/s²',why:why});}
  W(F*m,'You multiplied. Acceleration is force <b>÷</b> mass.');
  W(m/F,'That’s upside down. Divide the force by the mass.');
  W(F-m,'Subtracting doesn’t work here. Use a = F ÷ m.');
  W(F+m,'Adding doesn’t work here. Use a = F ÷ m.');
  return {topic:'accel',prompt:art(m)+' <b>'+m+' kg</b> '+o+' is pushed with a net force of <b>'+F+' N</b>. What is its acceleration?',
    correct:{val:a,html:a+' m/s²'},wrongs:wr,check:function(v){return Math.abs(v*m-F)<1e-9;},
    explain:'a = F ÷ m = '+F+' ÷ '+m+' = <b>'+a+' m/s²</b>'};
}
function gForce(){
  var m=rnd(2,12),a=rnd(2,9),F=m*a,o=pick(OBJ),wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' N',why:why});}
  W(m+a,'You added. Force is mass <b>×</b> acceleration.');
  W(m/a,'That’s mass ÷ acceleration. Multiply them instead.');
  W(a/m,'That’s upside down. Multiply mass by acceleration.');
  W(m-a,'Subtracting doesn’t work here. Use F = m × a.');
  return {topic:'force',prompt:art(m)+' <b>'+m+' kg</b> '+o+' speeds up at <b>'+a+' m/s²</b>. What net force acts on it?',
    correct:{val:F,html:F+' N'},wrongs:wr,check:function(v){return Math.abs(v/m-a)<1e-9;},
    explain:'F = m × a = '+m+' × '+a+' = <b>'+F+' N</b>'};
}
function gMass(){
  var m=pick([2,3,4,5,6,8,10,12,15]),a=rnd(2,9),F=m*a,wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' kg',why:why});}
  W(F*a,'You multiplied. Mass is force <b>÷</b> acceleration.');
  W(a/F,'That’s upside down. Divide the force by the acceleration.');
  W(F-a,'Subtracting doesn’t work here. Use m = F ÷ a.');
  W(F+a,'Adding doesn’t work here. Use m = F ÷ a.');
  return {topic:'mass',prompt:'A net force of <b>'+F+' N</b> gives an object an acceleration of <b>'+a+' m/s²</b>. What is its mass?',
    correct:{val:m,html:m+' kg'},wrongs:wr,check:function(v){return Math.abs(v*a-F)<1e-9;},
    explain:'m = F ÷ a = '+F+' ÷ '+a+' = <b>'+m+' kg</b>'};
}
function gNet(){
  var m=pick([2,3,4,5,6,8,10]),a=rnd(2,8),net=m*a,F2=rnd(5,30),F1=F2+net,wr=[];
  function W(v,why){wr.push({val:v,html:num(v)+' m/s²',why:why});}
  W((F1+F2)/m,'Those pushes point opposite ways, so subtract to find the net force first.');
  W(F1/m,'You ignored the push from the other student. Use the net force.');
  W(net,'That’s the net force. Now divide it by the mass.');
  W(net*m,'You multiplied. Divide the net force by the mass.');
  W(F2/m,'You used only the smaller push. Use the net force.');
  return {topic:'net',prompt:'Two students push '+art(m).toLowerCase()+' <b>'+m+' kg</b> crate. One pushes right with <b>'+F1+' N</b>. The other pushes left with <b>'+F2+' N</b>. What is the crate’s acceleration?',
    correct:{val:a,html:a+' m/s²'},wrongs:wr,check:function(v){return Math.abs(v*m-(F1-F2))<1e-9;},
    explain:'Net force = '+F1+' − '+F2+' = '+net+' N (to the right)<br>a = '+net+' ÷ '+m+' = <b>'+a+' m/s²</b>'};
}

/* =====================================================================
   SET 1  Count the Atoms (7.6B)
   ===================================================================== */
function gOne(){
  var f=pick(FORMULAS),els=Object.keys(f.c),el=pick(els),cnt=f.c[el],wr=[];
  var other=pick(els.filter(function(e){return e!==el;}));
  var vis=parseF(f.f,true)[el];
  function W(v,why){wr.push({val:v,html:String(v),why:why});}
  W(sumVals(f.c),'That’s <b>all</b> the atoms. The question asks only about '+ELEM[el]+'.');
  W(els.length,'That counts kinds of elements, not atoms of '+ELEM[el]+'.');
  W(vis,'Remember: the number outside the parentheses multiplies everything inside.');
  W(f.c[other],'That’s the count for '+ELEM[other]+', not '+ELEM[el]+'.');
  W(cnt+1,'Check again. No subscript means 1 atom.');
  if(cnt>1)W(cnt-1,'Check again. Count every atom of '+ELEM[el]+'.');
  return {topic:'one',prompt:'How many <b>'+ELEM[el]+'</b> atoms are in <b>'+f.h+'</b>?',
    correct:{val:cnt,html:String(cnt)},wrongs:wr,check:function(v){return parseF(f.f)[el]===v;},
    explain:'In '+f.h+', '+ELEM[el]+' ('+el+') shows up <b>'+cnt+'</b> time'+(cnt>1?'s':'')+'.'+(f.f.indexOf('(')>=0?' Multiply the number outside the parentheses by the number inside.':'')};
}
function gTotal(){

function galaxySVG(kind){
  var s=svgOpen(),i,a,rot=Math.random()*Math.PI*2,cols,x,y;
  function clampv(v){return Math.max(8,Math.min(372,v));}
  function dot(x,y,r,c,o){return '<circle cx="'+f1(clampv(x))+'" cy="'+f1(clampv(y))+'" r="'+f1(r)+'" fill="'+c+'" fill-opacity="'+o+'"/>';}
  for(i=0;i<45;i++)s+=dot(Math.random()*380,Math.random()*380,1,'#6f82b3',0.7);
  if(kind==='Spiral'){
    s+=dot(190,190,34,'#ffe9a8',0.25)+dot(190,190,20,'#ffe9a8',0.8);
    cols=['#bfe0ff','#ffffff','#9ec8ff'];
    for(a=0;a<2;a++)for(i=0;i<320;i++){
      var t=0.5+i/320*2.3*Math.PI,rad=18+t*17,ang=t+a*Math.PI+rot,sp=4+i/320*13;
      x=190+rad*Math.cos(ang)+gauss()*sp;y=190+rad*Math.sin(ang)+gauss()*sp;
      s+=dot(x,y,1.6+Math.random()*1.6,pick(cols),0.85);}
  }else if(kind==='Elliptical'){
    var ax=pick([100,115]),ay=pick([55,75]);cols=['#ffe2b0','#ffd08a','#ffffff'];
    s+=dot(190,190,40,'#ffe9a8',0.18);
    for(i=0;i<850;i++){
      var px=gauss()*ax,py=gauss()*ay;
      x=190+px*Math.cos(rot)-py*Math.sin(rot);y=190+px*Math.sin(rot)+py*Math.cos(rot);
      s+=dot(x,y,1.3+Math.random()*1.2,pick(cols),0.8);}
  }else{
    cols=['#9ec8ff','#ff9ccf','#ffffff','#c8b0ff'];
    var k=rnd(4,6),j;
    for(j=0;j<k;j++){
      var cxx=90+Math.random()*200,cyy=90+Math.random()*200,sp2=14+Math.random()*22;

  }

}

/* forGame('lh') -> null if the link names no set (unless options say which set) */
function forGame(prefix,opt){
  opt=opt||{};
  var setId=opt.set||param('set');if(!setId)return null;
  var idx=findSet(setId);if(idx<0)return null;
  var set=SETS[idx];
  var want=opt.topics||(param('topics')?param('topics').split(','):[]);
  var tops=want.filter(function(t){return set.topicIds.indexOf(t)>=0;});
  if(!tops.length)tops=set.topicIds.slice();
  var mask=0;set.topicIds.forEach(function(t,i){if(tops.indexOf(t)>=0)mask|=(1<<i);});
  var bag=[],recent=[];
  var api={prefix:prefix,set:set,setIndex:idx,topics:tops,topicMask:mask,
    next:function(){
      var q,sig,tries=0;
      do{
        if(!bag.length)bag=shuffle(tops);
        q=make(set,bag.pop());tries++;
        sig=q.prompt+'|'+q.choices.filter(function(c){return c.ok;})[0].html;
      }while(recent.indexOf(sig)>=0&&tries<40);
      recent.push(sig);if(recent.length>10)recent.shift();

        if(q.choices.every(function(c){return plain(c.html).length<=maxLen;}))return q;}
      return q;}};

}

/* fit test: generate many questions from every set/topic and report problems */
function selftest(count){

    var ok=eqElements(e).every(function(el){return sideCount(e.L,el)===sideCount(e.R,el);});
    if(!ok){bad++;out.push('Equation not balanced: #'+i);}
  });
  SETS.forEach(function(s){s.topics.forEach(function(t){
    var mx=0,n=0,fail=0,vis=0,seenPrompts={};
    for(var i=0;i<count;i++){
      try{var q=make(s,t.id);n++;tot++;
        var oks=q.choices.filter(function(c){return c.ok;}).length;
        if(q.choices.length!==4||oks!==1)fail++;
        var keys={};
        q.choices.forEach(function(c){var L=plain(c.html).length;keys[plain(c.html)]=1;if(L>mx)mx=L;if(q.visual&&L>maxVisChoice)maxVisChoice=L;
          if(!c.ok&&!c.why)fail++;});
        if(Object.keys(keys).length!==4)fail++;
        if(q.visual){vis++;if(q.visual.indexOf('<svg')!==0)fail++;if(q.choices.some(function(c){return plain(c.html).length>12;}))fail++;}
        if(plain(q.prompt).length>maxPrompt)maxPrompt=plain(q.prompt).length;
        seenPrompts[q.prompt]=1;
      }catch(e){fail++;out.push('  error in '+s.id+'/'+t.id+': '+e.message);}
    }
    if(mx>maxChoice)maxChoice=mx;bad+=fail;
    out.push(s.teks+' '+s.id+' / '+t.id+': '+n+' qs, '+Object.keys(seenPrompts).length+' different prompts, '+fail+' problems, longest answer '+mx+(vis?', picture':''));
  });});
  out.push('Total '+tot+' questions. Longest prompt '+maxPrompt+' chars. Longest answer '+maxChoice+' chars. Longest picture answer '+maxVisChoice+' chars.');
  out.push(bad===0?'ALL CLEAR':'PROBLEMS FOUND: '+bad);
  return {ok:bad===0,lines:out,bad:bad};
}

  out.ok=(seal(v,name)===sealBits);
  out.date=new Date(EPOCH+out.day*86400000);
  return out;
}
function fmtCode(c){return c.replace(/(.{4})(?=.)/g,'$1-');}
/* S = {name, score, correct, answered, setIndex, topicMask, runSec} */
function make(gameId,S){
  var day=Math.floor((Date.now()-EPOCH)/86400000);
  return fmtCode(encode({ver:1,game:GAMES[gameId]||0,set:S.setIndex,topics:S.topicMask,
    run:Math.round((S.runSec||240)/15),day:day,score:S.score,correct:S.correct,answered:S.answered},S.name));
}

}

<script>
/* =====================================================================
   SikesBoard: reads score rows (from your published Google Sheet) and builds the leaderboard (games/board.js)
   Needs questions.js and scorecode.js to be loaded first.
   Every row is checked: the code must have been earned under the name written next to it.
   ===================================================================== */
var SikesBoard=(function(){
'use strict';
var ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',NUM2ID={};
Object.keys(SikesCode.GAMES).forEach(function(k){NUM2ID[SikesCode.GAMES[k]]=k;});

/* a small CSV reader that handles quotes and line breaks inside quotes */
function parseCSV(text){
  var rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function cleanCode(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function looksLikeCode(s){var c=cleanCode(s);if(c.length!==16)return false;for(var i=0;i<16;i++)if(ALPHA.indexOf(c[i])<0)return false;return true;}
function isStamp(s){return /^\s*\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}/.test(s)||/\d{1,2}:\d{2}/.test(s);}
function fmtDate(d){return d.toISOString().slice(0,10);}

/* turn rows of fields into checked entries: [{name, code, info}] (bad rows are skipped) */
function entries(rows){
  var out=[],seen={};
  rows.forEach(function(r){
    var f=r.map(function(x){return String(x).trim();}).filter(function(x){return x.length;});
    var codes=f.filter(looksLikeCode),names=f.filter(function(x){return !looksLikeCode(x)&&!isStamp(x)&&/[A-Za-z]/.test(x);});
    if(!codes.length||!names.length)return;
    var code=cleanCode(codes[0]),res=null,name='';
    for(var i=0;i<names.length&&!res;i++){var d=SikesCode.decode(code,names[i]);if(d.ok){res=d;name=names[i];}}
    if(!res)return;
    var gid=NUM2ID[res.game],set=SikesQ.SETS[res.set];
    if(!gid||!set||res.answered<1||res.correct>res.answered||res.ver!==1)return;
    if(seen[code])return;seen[code]=true;
    out.push({name:name,code:code,info:{game:gid,set:set,score:res.score,correct:res.correct,answered:res.answered,date:res.date}});
  });
  return out;
}

/* best score per student for each game, and for each skill inside each game; top 10 of each */
function build(list){
  var best={},bestSkill={},games={},skills={};
  function better(a,b){return !b||a.score>b.score||(a.score===b.score&&a.correct/a.answered>b.correct/b.answered);}
  list.forEach(function(e){
    var i=e.info,nm=e.name.trim(),norm=SikesCode.normName(nm);
    var rec={game:i.game,name:nm,score:i.score,correct:i.correct,answered:i.answered,set:i.set.id,skill:i.set.name+' ('+i.set.teks+')',date:fmtDate(i.date)};
    var k1=i.game+'|'+norm,k2=i.game+'|'+i.set.id+'|'+norm;
    if(better(rec,best[k1]))best[k1]=rec;
    if(better(rec,bestSkill[k2]))bestSkill[k2]=rec;
  });
  function trim(a){return a.sort(function(x,y){return y.score-x.score||(y.correct/y.answered)-(x.correct/x.answered);}).slice(0,10).map(function(b){
    return {name:b.name,score:b.score,correct:b.correct,answered:b.answered,set:b.set,skill:b.skill,date:b.date};});}
  Object.keys(best).forEach(function(k){var b=best[k];(games[b.game]=games[b.game]||[]).push(b);});
  Object.keys(bestSkill).forEach(function(k){var b=bestSkill[k];((skills[b.game]=skills[b.game]||{})[b.set]=skills[b.game][b.set]||[]).push(b);});
  Object.keys(games).forEach(function(g){games[g]=trim(games[g]);});
  Object.keys(skills).forEach(function(g){Object.keys(skills[g]).forEach(function(s){skills[g][s]=trim(skills[g][s]);});});
  return {updated:new Date().toISOString(),games:games,skills:skills};
}
function fromCSV(text){return build(entries(parseCSV(text)));}
return {parseCSV:parseCSV,entries:entries,build:build,fromCSV:fromCSV};
})();
if(typeof module!=='undefined')module.exports=SikesBoard;

</script>

8px;color:var(--rose)}\n#setsel{width:100%;height:84px;border-radius:20px;border:3px solid #2b3d7a;background:#16224a;color:var(--ink);font-family:inherit;font-size:36px;font-weight:800;padding:0 22px}\n#setsel:focus{outline:none;border-color:var(--cyan)}\n#tiles{display:flex;gap:20px;width:100%}\n.tile{flex:1;background:#16224a;border:3px solid #2b3d7a;border-radius:22px;padding:18px 22px;cursor:pointer;\n  display:flex;flex-direction:column;gap:6px;text-align:left;font-size:40px;font-weight:800}\n.tile span{font-size:26px;color:var(--dim)}\n.tile.on{border-color:var(--ball);background:#2a2340}\n#chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:62px}\n.chip{background:#16224a;border:3px solid #2b3d7a;border-radius:30px;padding:8px 24px;font-size:28px;\n  font-weight:800;cursor:pointer;color:var(--dim)}\n.chip.on{border-color:var(--mint);color:var(--ink);background:#143a35}\n.actions{display:flex;gap:20px;margin-top:10px}\n.big{border:0;border-radius:24px;background:var(--ball);color:#1d1004;font-family:'Baloo 2','Nunito',sans-serif;\n  font-size:66px;font-weight:800;padding:6px 90px 10px;cursor:pointer}\n.big:hover{background:#ff9d5e}\n.alt{border:3px solid #2b3d7a;border-radius:24px;background:#16224a;font-size:34px;font-weight:800;\n  padding:10px 34px;cursor:pointer}\n.alt:hover{border-color:var(--cyan)}\n.how{font-size:28px;color:var(--dim);margin-top:6px}\n#ov-end .card{gap:12px}\n#ov-end h2{font-family:'Baloo 2','Nunito',sans-serif;font-size:96px;line-height:1;font-weight:800}\n#e-result{font-size:50px;font-weight:800}\n#e-sub{font-size:32px;color:var(--dim);text-align:center;line-height:1.4}\n.showit{font-size:38px;font-weight:800;color:var(--gold);margin-top:8px}\n#lh-code{font-family:'Baloo 2','Nunito',sans-serif;font-size:92px;font-weight:800;letter-spacing:.06em;\n  background:#0b1228;border:3px dashed var(--gold);border-radius:22px;padding:6px 40px 10px}\n#ov-new .card{width:900px;gap:22px}\n#ov-new h2{font-family:'Baloo 2','Nunito',sans-serif;font-size:84px;font-weight:800}\n#ov-new p{font-size:36px;color:var(--dim)}\n#ov-test pre{font-size:24px;line-height:1.35;max-width:1500px;white-space:pre-wrap;color:var(--ink)}\n.fb.live{padding:18px 26px}\n#helpbar span.keyhint{color:var(--cyan)}\n\n#e-send{font-size:32px;font-weight:800;color:var(--mint);min-height:42px}\n.act:disabled{opacity:.45;cursor:default;background:#8a5a30}\n", "js": {"questions.js": "/* =====================================================================\n   SikesQ: the shared question bank for Sikes Arcade (games/questions.js)\n   Every game loads this one file. SETS are append-only: score codes store\n   each set's position in the list, so never reorder or delete a set.\n   ===================================================================== */\nvar SikesQ=(function(){\n'use strict';\nvar MINUS='\\u2212';\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)];}\nfunction shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}\nfunction fmt(n){return String(Math.round(Math.abs(n)*100)/100);}\nfunction num(n){return (n<0?MINUS:'')+fmt(n);}\nfunction plain(h){return String(h).replace(/<[^>]*>/g,'');}\nfunction art(n){return (n===8||n===11||n===18)?'An':'A';}\nfunction subs(f){return f.replace(/(\\d+)/g,'<sub>$1<\/sub>');}\n\n/* ---------- chemistry data + an independent formula parser ---------- */\nvar ELEM={H:'hydrogen',O:'oxygen',C:'carbon',N:'nitrogen',S:'sulfur',Ca:'calcium',Al:'aluminum',\n          Mg:'magnesium',Na:'sodium',Fe:'iron',Cl:'chlorine'};\nvar FORMULAS=[\n {f:'H2O',c:{H:2,O:1}},{f:'CO2',c:{C:1,O:2}},{f:'NH3',c:{N:1,H:3}},{f:'CH4',c:{C:1,H:4}},\n {f:'H2SO4',c:{H:2,S:1,O:4}},{f:'HNO3',c:{H:1,N:1,O:3}},{f:'H2O2',c:{H:2,O:2}},\n {f:'Ca(OH)2',c:{Ca:1,O:2,H:2}},{f:'Al(OH)3',c:{Al:1,O:3,H:3}},\n {f:'Mg(NO3)2',c:{Mg:1,N:2,O:6}},{f:'Ca(NO3)2',c:{Ca:1,N:2,O:6}},\n {f:'Al2(SO4)3',c:{Al:2,S:3,O:12}},{f:'(NH4)2SO4',c:{N:2,H:8,S:1,O:4}},\n {f:'C6H12O6',c:{C:6,H:12,O:6}},{f:'NaHCO3',c:{Na:1,H:1,C:1,O:3}},{f:'Na2CO3',c:{Na:2,C:1,O:3}},\n {f:'CaCO3',c:{Ca:1,C:1,O:3}},{f:'Fe2O3',c:{Fe:2,O:3}},{f:'NaCl',c:{Na:1,Cl:1}}\n];\nFORMULAS.forEach(function(x){x.h=subs(x.f);});\nfunction parseF(s,ignoreGroupMult){\n  var i=0;\n  function number(){var st=i;while(i<s.length&&/[0-9]/.test(s[i]))i++;return st===i?1:parseInt(s.slice(st,i),10);}\n  function group(){\n    var out={};\n    while(i<s.length){\n      var ch=s[i];\n      if(ch==='('){i++;var inner=group();var n=number();if(ignoreGroupMult)n=1;\n        for(var k in inner)out[k]=(out[k]||0)+inner[k]*n;}\n      else if(ch===')'){i++;return out;}\n      else if(/[A-Z]/.test(ch)){var sym=ch;i++;if(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++;}\n        var m=number();out[sym]=(out[sym]||0)+m;}\n      else i++;\n    }\n    return out;\n  }\n  return group();\n}\nfunction sumVals(o){var t=0;for(var k in o)t+=o[k];return t;}\nfunction digitSum(f){var t=0,m=f.match(/\\d+/g)||[];m.forEach(function(d){t+=parseInt(d,10);});return t;}\n\n/* ---------- build one 4-choice question from a spec ---------- */\nfunction build(spec){\n  if(!spec)return null;\n  if(!spec.check(spec.correct.val))return null;               // the right answer must pass the check\n  var seen={};seen[spec.correct.html]=true;var pool=[];\n  spec.wrongs.forEach(function(w){\n    if(seen[w.html])return; seen[w.html]=true;\n    if(spec.check(w.val))return;                               // a wrong choice may never pass\n    pool.push(w);\n  });\n  if(pool.length<3)return null;\n  pool=shuffle(pool).slice(0,3);\n  var all=[{html:spec.correct.html,ok:true,why:''}].concat(pool.map(function(w){return {html:w.html,ok:false,why:w.why};}));\n  all=shuffle(all);all.forEach(function(c,i){c.key=String(i+1);});\n  return {topic:spec.topic,prompt:spec.prompt,choices:all,explain:spec.explain||'',visual:spec.visual||null};\n}\n\n/* ---------- generic generators for concept questions ----------\n   labelGen: the 4 (or 5) choices are always the same labels; item = [question, answerLabel, explanation]\n   bankGen:  each item carries its own wrong answers; item = [question, right, explanation, [[wrong, why], ...]] */\nfunction labelGen(topic,items,labels,whyFn,lead){\n  return function(){\n    var it=pick(items),a=it[1];\n    var wr=labels.filter(function(l){return l!==a;}).map(function(l){return {val:l,html:l,why:whyFn(l)};});\n    return {topic:topic,prompt:(lead||'')+it[0],correct:{val:a,html:a},wrongs:wr,\n      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'<\/b>.')};\n  };\n}\nfunction bankGen(topic,items){\n  return function(){\n    var it=pick(items),a=it[1];\n    var wr=it[3].map(function(w){return {val:w[0],html:w[0],why:w[1]};});\n    return {topic:topic,prompt:it[0],correct:{val:a,html:a},wrongs:wr,\n      check:function(v){return v===a;},explain:it[2]||('The answer is <b>'+a+'<\/b>.')};\n  };\n}\n\n/* ---------- small SVG helpers (380 x 380, dark theme) ---------- */\nfunction svgOpen(){return '<svg viewBox=\"0 0 380 380\" width=\"380\" height=\"380\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Nunito,Arial,sans-serif\" font-size=\"17\" font-weight=\"700\">';}\nfunction graphSVG(o){\n  var W=380,H=380,L=64,R=14,T=14,B=62,pw=W-L-R,ph=H-T-B;\n  function X(t){return L+t/o.xmax*pw;}\n  function Y(d){return T+ph-d/o.ymax*ph;}\n  var s=svgOpen(),i;\n  for(i=0;i<=o.xmax;i+=o.xstep){s+='<line x1=\"'+X(i)+'\" y1=\"'+T+'\" x2=\"'+X(i)+'\" y2=\"'+(T+ph)+'\" stroke=\"#2b3d7a\" stroke-width=\"1\"/>';\n    if(i%o.xlab===0)s+='<text x=\"'+X(i)+'\" y=\"'+(T+ph+22)+'\" fill=\"#eef3ff\" text-anchor=\"middle\">'+i+'<\/text>';}\n  for(i=0;i<=o.ymax;i+=o.ystep){s+='<line x1=\"'+L+'\" y1=\"'+Y(i)+'\" x2=\"'+(L+pw)+'\" y2=\"'+Y(i)+'\" stroke=\"#2b3d7a\" stroke-width=\"1\"/>';\n    if(i%o.ylab===0)s+='<text x=\"'+(L-8)+'\" y=\"'+(Y(i)+6)+'\" fill=\"#eef3ff\" text-anchor=\"end\">'+i+'<\/text>';}\n  s+='<line x1=\"'+L+'\" y1=\"'+T+'\" x2=\"'+L+'\" y2=\"'+(T+ph)+'\" stroke=\"#9db0d6\" stroke-width=\"3\"/>';\n  s+='<line x1=\"'+L+'\" y1=\"'+(T+ph)+'\" x2=\"'+(L+pw)+'\" y2=\"'+(T+ph)+'\" stroke=\"#9db0d6\" stroke-width=\"3\"/>';\n  s+='<text x=\"'+(L+pw/2)+'\" y=\"'+(H-8)+'\" fill=\"#9db0d6\" text-anchor=\"middle\">Time (s)<\/text>';\n  s+='<text transform=\"translate(16,'+(T+ph/2)+') rotate(-90)\" fill=\"#9db0d6\" text-anchor=\"middle\">Distance (m)<\/text>';\n  (o.marks||[]).forEach(function(m){\n    s+='<line x1=\"'+X(m.t)+'\" y1=\"'+(T+ph)+'\" x2=\"'+X(m.t)+'\" y2=\"'+Y(m.d)+'\" stroke=\"#ff8a3d\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>';\n    s+='<line x1=\"'+L+'\" y1=\"'+Y(m.d)+'\" x2=\"'+X(m.t)+'\" y2=\"'+Y(m.d)+'\" stroke=\"#ff8a3d\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>';\n  });\n  o.lines.forEach(function(ln){\n    var p=ln.pts.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);}).join(' ');\n    s+='<polyline points=\"'+p+'\" fill=\"none\" stroke=\"'+ln.color+'\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>';\n    if(ln.dots)ln.pts.forEach(function(q,k){if(k===0||k===ln.pts.length-1)s+='<circle cx=\"'+X(q[0])+'\" cy=\"'+Y(q[1])+'\" r=\"7\" fill=\"'+ln.color+'\"/>';});\n    if(ln.label){var e=ln.pts[ln.pts.length-1];s+='<text x=\"'+(X(e[0])-8)+'\" y=\"'+(Y(e[1])-10)+'\" fill=\"'+ln.color+'\" text-anchor=\"end\" font-size=\"20\">'+ln.label+'<\/text>';}\n  });\n  return s+'<\/svg>';\n}\n\n/* =====================================================================\n   SET 0  Newton's Second Law (8.7A)\n   ===================================================================== */\nvar OBJ=['cart','wagon','sled','skateboard','crate','lab trolley','toy car','shopping cart'];\nfunction gAccel(){\n  var m=pick([2,3,4,5,6,8,10,12,15,20]),a=rnd(2,9),F=m*a,o=pick(OBJ),wr=[];\n  function W(v,why){wr.push({val:v,html:num(v)+' m/s\u00b2',why:why});}\n  W(F*m,'You multiplied. Acceleration is force <b>\u00f7<\/b m on the outside of a cold glass on a humid day.','Condensation','Water vapor in the air cools and turns to liquid on the glass.'],\n ['Snow falls on a mountain.','Precipitation','Water falling from clouds as snow is precipitation.'],\n ['Rainwater washes down a street into a storm drain.','Runoff','Water flowing over the surface is runoff.']\n],['Evaporation','Condensation','Precipitation','Runoff'],function(l){return 'Not this one. '+WCW[l];},'Which part of the water cycle is this?<br>');\nvar gSunLand=bankGen('land',[\n ['Why do coastal cities usually have milder temperatures than inland cities?','Water heats up and cools down more slowly than land','The ocean takes in or gives off a lot of energy without changing temperature much, which keeps nearby land milder.',\n  [['The ocean gives off its own heat all year','The ocean gets its energy from the Sun.'],['The Sun shines less on the coast','The coast gets about the same sunlight as inland areas.'],['Coastal cities are always at a higher elevation','Many coastal cities are at sea level.']]],\n ['On a sunny day at the beach, a cool breeze blows from the ocean toward the land. Why?','Land heats faster, so air over land rises and cooler ocean air moves in','Warm air rises over the hot land, and cooler air from over the water flows in to replace it.',\n  [['The Moon pulls air toward the land','The Moon does not cause the sea breeze.'],['Air over the water is warmer, so it rises','The air over land is the warmer air in the daytime.'],['Salty air is heavier and falls onto the land','The breeze comes from the temperature difference, not from salt.']]],\n ['Which heats up faster in sunlight: land or water?','Land heats up faster than water','Water takes more energy to warm up than land does.',\n  [['Water heats up faster than land','Water warms up slowly.'],['They heat up at exactly the same rate','Land warms much faster than water.'],['Neither one heats up in sunlight','Both absorb sunlight, but at different rates.']]],\n ['At night, land cools faster than the ocean. Which way does the breeze blow?','From the land toward the warmer sea','Warm air rises over the water, and cooler air from the land flows out to replace it.',\n  [['From the sea toward the land','That is the daytime sea breeze.'],['It stops completely','There is still a temperature difference, so air still moves.'],['Straight up from the land','Air rises over the warmer water, not over the cooler land.']]],\n ['The Gulf of Mexico stays warm into the fall. How does this affect nearby land?','It keeps coastal temperatures milder and adds moisture to the air','Warm water warms the air above it and evaporates, adding moisture.',\n  [['It makes coastal land much colder','Warm water makes nearby land milder, not colder.'],['It has no effect on the weather','Large bodies of water strongly affect nearby weather.'],['It removes moisture from the air','Warm water evaporates and adds moisture to the air.']]],\n ['Why can a desert get very hot during the day and cool off quickly at night?','Dry air and dry land hold little heat, so energy escapes quickly','With little water vapor and moisture, the desert cannot hold on to heat after sunset.',\n  [['Deserts are much closer to the Sun','Deserts are the same distance from the Sun as other places.'],['Sand makes its own heat during the day','Sand absorbs heat from the Sun. It does not make heat.'],['The Moon cools the ground at night','The Moon does not cool the ground.']]]\n]);\n\n/* ---------- SET 25: Global Wind Patterns (8.10B) ---------- */\nvar WBW={'Trade winds':'Trade winds blow from east to west between the equator and about 30\\u00b0 latitude.','Westerlies':'Westerlies blow from west to east between about 30\\u00b0 and 60\\u00b0 latitude.','Polar easterlies':'Polar easterlies blow from the east near the poles (60\\u00b0 to 90\\u00b0).','Doldrums':'The doldrums are a calm zone near the equator where warm air rises.'};\nvar gWindBelt=labelGen('belts',[\n ['Winds between 30\\u00b0 and 60\\u00b0 latitude that blow from west to east and push weather across the United States.','Westerlies','These winds blow from the west, so weather in Texas usually moves from west to east.'],\n ['Steady winds near the equator that blow from east to west. Sailors used them to cross the Atlantic.','Trade winds','Trade winds blow from the east toward the west in the tropics.'],\n ['Cold winds near the poles that blow from the east.','Polar easterlies','Polar easterlies are the cold winds blowing away from the poles.'],\n ['A calm region near the equator where warm air rises and winds are light.','Doldrums','Near the equator, warm air rises instead of blowing sideways, so winds are light.'],\n ['These winds explain why most storms in Texas move from west to east.','Westerlies','The westerlies steer weather systems across the middle latitudes.'],\n ['Winds in the zone from the equator to 30\\u00b0 latitude that blow toward the equator and to the west.','Trade winds','Trade winds blow from the east in the tropics.'],\n ['Winds between 60\\u00b0 and 90\\u00b0 latitude that blow from the east.','Polar easterlies','These cold winds blow from the poles toward lower latitudes.']\n],['Trade winds','Westerlies','Polar easterlies','Doldrums'],function(l){return 'Not this one. '+WBW[l];},'Which global wind belt is described?<br>');\nvar gWindCause=bankGen('cause',[\n ['What causes Earth\\u2019s global wind patterns?','Uneven heating of Earth by the Sun, plus Earth\\u2019s rotation','The equator is heated more than the poles, which sets air moving. Earth\\u2019s spin then bends the winds.',\n  [['Ocean tides','Tides are caused by gravity and do not set global winds.'],['The phases of the Moon','Moon phases do not drive wind.'],['Earth\\u2019s magnetic field','The magnetic field does not make wind.']]],\n ['What does the Coriolis effect do to winds in the Northern Hemisphere?','It bends them to the right','Earth\\u2019s rotation turns moving air to the right in the Norther sure.']]],\n ['In the United States, weather systems usually travel in which direction?','From west to east','The westerlies and the jet stream push weather systems from west to east.',\n  [['From east to west','That is the direction of the trade winds, not the westerlies.'],['From south to north only','The main direction is from west to east.'],['They do not move','Weather systems are moved along by winds in the atmosphere.']]],\n ['A cold air mass from the north pushes into Texas and replaces warm air. What is the boundary called?','A cold front','A cold front is the leading edge of cold air that is replacing warmer air.',\n  [['A warm front','A warm front is where warm air replaces cooler air.'],['A trade wind','Trade winds are a global wind belt, not a front.'],['A doldrum','Doldrums are a calm region near the equator.']]],\n ['Why does the weather in a place often change when the jet stream shifts?','The jet stream steers warm and cold air masses and storms over the area','The jet stream is a boundary between warm and cold air masses and guides storm systems.',\n  [['The jet stream makes the Sun brighter','The jet stream does not change the Sun.'],['The jet stream stops all wind','The jet stream is a fast wind, not a calm zone.'],['The jet stream makes the ground colder','The jet stream is high in the atmosphere and does not cool the ground directly.']]]\n]);\n\n/* ---------- SET 26: Hurricanes and Typhoons (8.10C) ---------- */\nvar gHurrForm=bankGen('form',[\n ['What ocean condition is needed for a hurricane to form?','Warm surface water, at least about 80\\u00b0F (26.5\\u00b0C)','Warm water evaporates quickly and supplies the moisture and energy that a storm needs.',\n  [['Cold water from deep ocean currents','Cold water cannot supply enough heat and moisture.'],['Water that is frozen on the surface','Frozen water cannot evaporate into the air.'],['Very strong ocean tides','Tides are not what powers a hurricane.']]],\n ['How does warm ocean water help a hurr
